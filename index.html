<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malevin — Modular Deck Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        /* =========================================================
           1. MALEVIN DESIGN SYSTEM & CORE VARIABLES
           ========================================================= */
        :root {
            --bg-obsidian: #0A0B0A;
            --surface-dark: #121312;
            --card-obsidian: #161816;
            --border-obsidian: #242624;
            --accent-gold: #C49A57;
            --accent-gold-glow: rgba(196, 154, 87, 0.15);
            --text-white: #FEFEFE;
            --text-muted: #808280;
            --positive: #4CAF7A;
            --negative: #E55353;
            --font-main: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-white);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-obsidian);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%);
            color: #0A0B0A;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .topbar-actions { display: flex; gap: 8px; align-items: center; }

        .mode-tabs { display: flex; gap: 4px; background: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 6px; padding: 3px; }
        .mode-tab-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 6px 16px; font-size: 10px; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: all 0.2s ease;
        }
        .mode-tab-btn.active { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; }
        .mode-tab-btn:not(.active):hover { color: var(--accent-gold); }
        .mode-tab-btn, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 53px);
            overflow: hidden;
        }

        /* =========================================================
           2. EDITOR PANEL
           ========================================================= */
        .editor-panel {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            background-color: var(--surface-dark);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .slide-accordion {
            background-color: var(--card-obsidian);
            border: 1px solid var(--border-obsidian);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .slide-accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-obsidian);
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .element-box {
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-obsidian);
            border-left: 3px solid var(--accent-gold);
            border-radius: 4px;
            padding: 12px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .element-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .form-control {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-obsidian);
            color: var(--text-white);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            width: 100%;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 55px;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--card-obsidian);
            color: var(--text-white);
            border: 1px solid var(--border-obsidian);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .btn-gold {
            background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%);
            color: #0A0B0A;
            border: none;
            font-weight: 800;
        }

        .btn-danger {
            background-color: transparent;
            color: #E55353;
            border: 1px solid rgba(229, 83, 83, 0.3);
            padding: 3px 8px;
            font-size: 9px;
        }

        /* =========================================================
           3. LIVE PREVIEW CANVAS & BRAND BADGES
           ========================================================= */
        .preview-panel {
            flex: 1;
            background-color: #050505;
            overflow-y: auto;
            padding: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #deck-container {
            display: flex;
            flex-direction: column;
            gap: 35px;
            width: 100%;
            max-width: 850px;
        }

        .slide {
            width: 850px;
            height: 478.125px;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-obsidian);
            padding: 28px 36px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            overflow: hidden;
        }

        .slide::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, #C49A57 0%, rgba(196,154,87,0.2) 100%);
        }

        .corner-accent {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: var(--accent-gold);
            border-style: solid;
            opacity: 0.3;
        }
        .corner-tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
        .corner-br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

        .content-tag-badge {
            position: absolute;
            top: 14px;
            right: 18px;
            background: rgba(196, 154, 87, 0.12);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 8px;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
            z-index: 10;
        }

        .slide-body {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            align-content: center;
            align-items: start;
            margin: 12px 0;
            overflow: hidden;
        }

        .grid-item {
            grid-column: span var(--span, 6);
            position: relative;
            border-radius: 4px;
        }

        /* BRAND BADGE STYLE IN COVER/ELEMENTS */
        .cover-brand-pill {
            background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%);
            color: #0A0B0A;
            font-size: 9px;
            font-weight: 800;
            padding: 3px 8px;
            border-radius: 3px;
            letter-spacing: 1px;
            text-transform: uppercase;
            display: inline-block;
        }

        .elem-tag {
            font-size: 9px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            display: inline-block;
        }

        .elem-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        p, li { color: #C0C2C0; font-size: 11px; line-height: 1.5; white-space: pre-line; }

        .malevin-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; }
        .malevin-table th {
            background-color: rgba(196, 154, 87, 0.12);
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--accent-gold);
            text-align: left;
            font-weight: 700;
        }
        .malevin-table td { padding: 7px 10px; border-bottom: 1px solid var(--border-obsidian); color: #D1D1D1; }

        .kpi-grid { display: flex; gap: 10px; width: 100%; }
        .kpi-card { flex: 1; background: rgba(22, 24, 22, 0.8); border: 1px solid var(--border-obsidian); padding: 12px; text-align: center; border-radius: 4px; }
        .kpi-value { font-size: 24px; font-weight: 800; color: var(--accent-gold); letter-spacing: 1px; }
        .kpi-label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .compare-box { display: flex; gap: 14px; align-items: center; width: 100%; }
        .compare-stat { flex: 1; }
        .compare-num { font-size: 20px; font-weight: 800; margin: 2px 0; }
        .progress-track { width: 100%; height: 8px; background: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 20px; overflow: hidden; margin-top: 4px; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #8A6831, #C49A57); }

        .slide-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-obsidian);
            padding-top: 8px;
            font-size: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-top: auto;
        }

        .slide-num { font-size: 11px; font-weight: 800; color: var(--accent-gold); }
    </style>
</head>
<body>

    <!-- TOP CONTROL BAR -->
    <div class="topbar">
        <div class="brand-title">
            <span id="brandNameLabel">MALEVIN</span> <span class="brand-badge">MODULAR STUDIO</span>
        </div>
        <div class="mode-tabs">
            <button class="mode-tab-btn" id="tabEditBtn" onclick="setMode('edit')">Edit</button>
            <button class="mode-tab-btn" id="tabPreviewBtn" onclick="setMode('preview')">Preview</button>
        </div>
        <div class="topbar-actions">
            <button class="btn btn-gold" onclick="exportPDF()">Export PDF</button>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="app-container">
        <!-- LEFT: MODULAR EDITOR PANEL -->
        <div class="editor-panel" id="editorPanel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; font-weight:800; color:var(--accent-gold); letter-spacing:1px;">SLIDES CONTROL</span>
                <button class="btn btn-gold" onclick="addSlide()">+ Halaman Baru</button>
            </div>
            <div id="forms-wrapper"></div>
        </div>

        <!-- RIGHT: LIVE PREVIEW CANVAS -->
        <div class="preview-panel" id="previewPanel">
            <div id="deck-container"></div>
        </div>
    </div>

    <script>
        let BRAND_NAME = 'Malevin';

        const ELEM_LABELS = {
            cover: 'COVER', header: 'HEADER', text: 'TEKS',
            table: 'TABEL', kpi: 'KPI', comparison: 'PERBANDINGAN'
        };

        let slidesData = [
            {
                id: 1,
                footerLeft: `PREPARED BY ${BRAND_NAME.toUpperCase()} CREATIVE & PRODUCTION TEAM`,
                contentTag: 'Creative Deck',
                elements: [
                    { type: 'cover', brand: 'MALEVIN', tag: 'Creative Proposal', title: 'CAMPAIGN DECK 2026', subtitle: 'Dynamic Brand Strategy & Visual Direction', w: 6 }
                ]
            },
            {
                id: 2,
                footerLeft: 'SECTION 01 EXECUTION STRATEGY',
                contentTag: 'Creative Deck',
                elements: [
                    { type: 'header', tag: 'Section 01', title: 'PERFORMANCE & DELIVERABLES', w: 6 },
                    { type: 'kpi', k1Val: '1.2M+', k1Lbl: 'Monthly Reach', k2Val: '4.8%', k2Lbl: 'Eng. Rate', k3Val: '120+', k3Lbl: 'Video Assets', w: 6 },
                    {
                        type: 'table',
                        headers: 'Platform, Format, Target Output',
                        rows: 'TikTok, Short Video, 40 Clips / Mo\nInstagram, Reels & Grid, 20 Posts / Mo\nYouTube, Shorts, 15 Clips / Mo',
                        w: 6
                    }
                ]
            }
        ];

        function renderForms() {
            const wrapper = document.getElementById('forms-wrapper');
            wrapper.innerHTML = '';

            slidesData.forEach((slide, sIdx) => {
                const card = document.createElement('div');
                card.className = 'slide-accordion';

                let elementsHTML = '';

                slide.elements.forEach((elem, eIdx) => {
                    let fields = '';

                    if (elem.type === 'cover') {
                        fields = `
                            <div class="form-group"><label>Nama Brand (Opsional)</label><input type="text" class="form-control" value="${elem.brand || ''}" placeholder="contoh: MALEVIN" oninput="updateElem(${sIdx}, ${eIdx}, 'brand', this.value)"></div>
                            <div class="form-group"><label>Tag / Sub-Label</label><input type="text" class="form-control" value="${elem.tag || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'tag', this.value)"></div>
                            <div class="form-group"><label>Judul Utama</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>
                            <div class="form-group"><label>Sub-judul</label><input type="text" class="form-control" value="${elem.subtitle || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'subtitle', this.value)"></div>
                        `;
                    } else if (elem.type === 'header') {
                        fields = `
                            <div class="form-group"><label>Tag Section</label><input type="text" class="form-control" value="${elem.tag || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'tag', this.value)"></div>
                            <div class="form-group"><label>Judul Section</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>
                        `;
                    } else if (elem.type === 'text') {
                        fields = `
                            <div class="form-group"><label>Isi Teks</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'content', this.value)">${elem.content || ''}</textarea></div>
                        `;
                    }

                    elementsHTML += `
                        <div class="element-box">
                            <div class="element-header">
                                <span>ELEMEN ${eIdx + 1}: ${ELEM_LABELS[elem.type] || elem.type.toUpperCase()}</span>
                                <button class="btn btn-danger" onclick="deleteElem(${sIdx}, ${eIdx})">Hapus</button>
                            </div>
                            ${fields}
                        </div>
                    `;
                });

                card.innerHTML = `
                    <div class="slide-accordion-header">
                        <strong style="font-size:12px; color:var(--accent-gold);">SLIDE ${sIdx + 1}</strong>
                        <button class="btn btn-danger" onclick="deleteSlide(${sIdx})">Hapus Slide</button>
                    </div>
                    <div class="form-group">
                        <label>Teks Footer Kiri</label>
                        <input type="text" class="form-control" value="${slide.footerLeft || ''}" oninput="updateSlideFooter(${sIdx}, this.value)">
                    </div>
                    ${elementsHTML}
                `;

                wrapper.appendChild(card);
            });

            renderPreview();
        }

        function renderPreview() {
            const container = document.getElementById('deck-container');
            container.innerHTML = '';

            slidesData.forEach((slide, sIdx) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';

                const slideNum = sIdx + 1 < 10 ? '0' + (sIdx + 1) : sIdx + 1;
                let bodyHTML = '';

                slide.elements.forEach((elem) => {
                    let piece = '';

                    if (elem.type === 'cover') {
                        const brandPill = elem.brand ? `<span class="cover-brand-pill">${elem.brand}</span>` : '';
                        const tagText = elem.tag ? `<span class="elem-tag">${elem.tag}</span>` : '';

                        piece = `
                            <div style="margin: auto 0;">
                                <div style="display:flex; align-items:center; gap:8px; margin-bottom:8px; flex-wrap:wrap;">
                                    ${brandPill}
                                    ${tagText}
                                </div>
                                <div class="elem-title" style="font-size:32px; margin: 10px 0;">${elem.title || ''}</div>
                                <p style="font-size:13px; color:var(--accent-gold);">${elem.subtitle || ''}</p>
                            </div>
                        `;
                    } else if (elem.type === 'header') {
                        piece = `
                            <div style="border-bottom: 1px solid var(--border-obsidian); padding-bottom: 8px;">
                                <div class="elem-tag">${elem.tag || ''}</div>
                                <div class="elem-title">${elem.title || ''}</div>
                            </div>
                        `;
                    }

                    bodyHTML += `
                        <div class="grid-item" style="--span:${elem.w || 6}; grid-column: span ${elem.w || 6};">
                            ${piece}
                        </div>
                    `;
                });

                slideEl.innerHTML = `
                    <div class="corner-accent corner-tl"></div>
                    <div class="corner-accent corner-br"></div>
                    ${slide.contentTag ? `<div class="content-tag-badge">${slide.contentTag}</div>` : ''}
                    <div class="slide-body">${bodyHTML}</div>
                    <div class="slide-footer">
                        <span>${slide.footerLeft || ''}</span>
                        <span class="slide-num">${slideNum}</span>
                    </div>
                `;

                container.appendChild(slideEl);
            });
        }

        function updateElem(sIdx, eIdx, key, value) {
            slidesData[sIdx].elements[eIdx][key] = value;
            renderPreview();
        }

        function updateSlideFooter(sIdx, value) {
            slidesData[sIdx].footerLeft = value;
            renderPreview();
        }

        function deleteElem(sIdx, eIdx) {
            slidesData[sIdx].elements.splice(eIdx, 1);
            renderForms();
        }

        function addSlide() {
            slidesData.push({
                id: Date.now(),
                footerLeft: `PREPARED BY ${BRAND_NAME.toUpperCase()} TEAM`,
                contentTag: '',
                elements: [
                    { type: 'header', tag: 'Section Tag', title: 'JUDUL SLIDE BARU', w: 6 }
                ]
            });
            renderForms();
        }

        function deleteSlide(sIdx) {
            if (slidesData.length > 1) {
                slidesData.splice(sIdx, 1);
                renderForms();
            }
        }

        async function exportPDF() {
            const container = document.getElementById('deck-container');
            const opt = {
                margin: 0,
                filename: `${BRAND_NAME}_Deck.pdf`,
                image: { type: 'jpeg', quality: 1.0 },
                html2canvas: { scale: 3, useCORS: true, backgroundColor: '#0A0B0A' },
                jsPDF: { unit: 'px', format: [850, 478.125], orientation: 'landscape' }
            };
            await html2pdf().set(opt).from(container).save();
        }

        function setMode(mode) {
            const editorPanel = document.getElementById('editorPanel');
            const previewPanel = document.getElementById('previewPanel');
            if (mode === 'preview') {
                editorPanel.style.display = 'none';
                previewPanel.style.display = 'flex';
            } else {
                editorPanel.style.display = 'flex';
                previewPanel.style.display = 'none';
            }
        }

        renderForms();
        setMode('edit');
    </script>
</body>
</html>
