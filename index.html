        function deleteSlide(sIdx) {
            if (slidesData.length > 1) {
                slidesData.splice(sIdx, 1);
                renderForms();
            } else {
                alert('Minimal harus ada 1 slide!');
            }
        }

        /* ============================
           5. EXPORT ENGINE (VEKTOR NATIVE PDF)
           ============================ */
        function exportPDF() {
            setMode('preview');
            setTimeout(() => {
                window.print();
            }, 100);
        }

        function exportJSON() {
            const payload = {
                brand: BRAND_NAME,
                account: currentAccount,
                slides: slidesData
            };
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(payload, null, 2));
            const downloadAnchor = document.createElement('a');
            downloadAnchor.setAttribute("href", dataStr);
            downloadAnchor.setAttribute("download", `${BRAND_NAME.replace(/\s+/g, '_')}_Deck_Project.json`);
            document.body.appendChild(downloadAnchor);
            downloadAnchor.click();
            downloadAnchor.remove();
        }

        /* ============================
           6. IMPORT DECK (PROJECT / PDF)
           ============================ */
        async function handleImportPDF(event) {
            const file = event.target.files[0];
            event.target.value = '';
            if (!file) return;

            try {
                if (file.type === 'application/json' || file.name.endsWith('.json')) {
                    const text = await file.text();
                    const parsed = JSON.parse(text);
                    if (parsed && Array.isArray(parsed.slides)) {
                        slidesData = parsed.slides;
                        if (parsed.brand) {
                            BRAND_NAME = parsed.brand;
                            document.getElementById('brandNameLabel').textContent = BRAND_NAME.toUpperCase();
                        }
                        if (parsed.account) {
                            currentAccount = parsed.account;
                            const sel = document.getElementById('accountSelect');
                            if (sel) sel.value = currentAccount;
                        }
                        renderForms();
                        setMode('edit');
                        alert('Project deck berhasil diimpor!');
                        return;
                    }
                }

                const buffer = await file.arrayBuffer();
                const { PDFDocument } = PDFLib;
                const pdfDoc = await PDFDocument.load(buffer, { ignoreEncryption: true, updateMetadata: false });
                const keywords = pdfDoc.getKeywords() || '';

                if (!keywords.startsWith(MALEVIN_PDF_SIGNATURE)) {
                    alert('File PDF/Project ini tidak memiliki data deck Malevin valid.');
                    return;
                }

                const jsonStr = decodeURIComponent(keywords.slice(MALEVIN_PDF_SIGNATURE.length));
                const parsed = JSON.parse(jsonStr);
                if (!parsed || !Array.isArray(parsed.slides) || parsed.slides.length === 0) {
                    throw new Error('Struktur data pada PDF tidak valid.');
                }

                slidesData = parsed.slides;
                if (parsed.brand) {
                    BRAND_NAME = parsed.brand;
                    document.getElementById('brandNameLabel').textContent = BRAND_NAME.toUpperCase();
                }
                if (parsed.account) {
                    currentAccount = parsed.account;
                    const sel = document.getElementById('accountSelect');
                    if (sel) sel.value = currentAccount;
                }

                renderForms();
                setMode('edit');
                alert('Deck berhasil diimpor dari PDF. Silakan lanjutkan mengedit.');
            } catch (err) {
                console.error(err);
                alert('Gagal membaca file. Pastikan file yang dipilih adalah PDF hasil export Malevin atau file .json deck valid.');
            }
        }

        /* ============================
           7. MODE SWITCH — EDIT / PREVIEW
           ============================ */
        function setMode(mode) {
            const editorPanel = document.getElementById('editorPanel');
            const previewPanel = document.getElementById('previewPanel');
            const tabEdit = document.getElementById('tabEditBtn');
            const tabPreview = document.getElementById('tabPreviewBtn');

            if (mode === 'preview') {
                editorPanel.style.display = 'none';
                previewPanel.style.display = 'flex';
                tabEdit.classList.remove('active');
                tabPreview.classList.add('active');
            } else {
                editorPanel.style.display = 'flex';
                previewPanel.style.display = 'none';
                tabPreview.classList.remove('active');
                tabEdit.classList.add('active');
            }
        }

        // Initialize Engine
        document.getElementById('brandNameLabel').textContent = BRAND_NAME.toUpperCase();
        document.getElementById('accountSelect').innerHTML = ACCOUNTS.map(a =>
            `<option value="${a}" ${a === currentAccount ? 'selected' : ''}>${a}</option>`
        ).join('');
        renderForms();
        setMode('edit');
    </script>
</body>
