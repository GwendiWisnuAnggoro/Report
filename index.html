<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malevin — Modular Deck Studio</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
    <style>
        /* =========================================================
           1. MALEVIN DESIGN SYSTEM & CORE VARIABLES
           ========================================================= */
        :root {
            --bg-obsidian: #0A0B0A;
            --surface-dark: #121312;
            --card-obsidian: #161816;
            --border-obsidian: #242624;
            --accent-gold: #C49A57;
            --accent-gold-glow: rgba(196, 154, 87, 0.15);
            --text-white: #FEFEFE;
            --text-muted: #808280;
            --positive: #4CAF7A;
            --negative: #E55353;
            --font-main: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-white);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-obsidian);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
            gap: 8px;
        }

        .brand-title {
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 3px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-badge {
            background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%);
            color: #0A0B0A;
            font-size: 9px;
            padding: 2px 6px;
            border-radius: 2px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .topbar-actions { display: flex; gap: 8px; align-items: center; }

        .mode-tabs { display: flex; gap: 4px; background: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 6px; padding: 3px; }
        .mode-tab-btn {
            background: transparent; border: none; color: var(--text-muted);
            padding: 6px 16px; font-size: 10px; font-weight: 800; letter-spacing: 1px;
            text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: all 0.2s ease;
        }
        .mode-tab-btn.active { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; }
        .mode-tab-btn:not(.active):hover { color: var(--accent-gold); }
        .mode-tab-btn, .btn { display: inline-flex; align-items: center; justify-content: center; gap: 5px; }
        .mode-tab-btn svg, .btn svg { flex-shrink: 0; }
        .account-select { min-width: 150px; }

        .app-container {
            display: flex;
            flex: 1;
            height: calc(100vh - 53px);
            overflow: hidden;
        }

        /* =========================================================
           2. LEFT PANEL: MODULAR EDITOR
           ========================================================= */
        .editor-panel {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            background-color: var(--surface-dark);
            display: flex;
            flex-direction: column;
            overflow-y: auto;
            padding: 20px;
            gap: 20px;
        }

        .slide-accordion {
            background-color: var(--card-obsidian);
            border: 1px solid var(--border-obsidian);
            border-radius: 6px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .slide-accordion-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid var(--border-obsidian);
            padding-bottom: 10px;
            flex-wrap: wrap;
            gap: 8px;
        }

        .element-box {
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-obsidian);
            border-left: 3px solid var(--accent-gold);
            border-radius: 4px;
            padding: 12px;
            margin-top: 8px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .element-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 10px;
            font-weight: 700;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .form-group label {
            font-size: 9px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 700;
        }

        .form-control {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-obsidian);
            color: var(--text-white);
            padding: 8px 10px;
            border-radius: 4px;
            font-size: 11px;
            font-family: inherit;
            width: 100%;
        }

        .form-control:focus {
            outline: none;
            border-color: var(--accent-gold);
        }

        textarea.form-control {
            resize: vertical;
            min-height: 55px;
            line-height: 1.4;
        }

        .btn {
            background-color: var(--card-obsidian);
            color: var(--text-white);
            border: 1px solid var(--border-obsidian);
            padding: 6px 12px;
            border-radius: 4px;
            font-size: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .btn-gold {
            background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%);
            color: #0A0B0A;
            border: none;
            font-weight: 800;
        }

        .btn-danger {
            background-color: transparent;
            color: #E55353;
            border: 1px solid rgba(229, 83, 83, 0.3);
            padding: 3px 8px;
            font-size: 9px;
        }

        .add-element-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 6px;
            margin-top: 8px;
        }

        .micro-label {
            font-size: 9px;
            color: var(--text-muted);
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .col-wrap { display: flex; gap: 12px; width: 100%; flex-wrap: wrap; }
        .col-item { flex: 1 1 0; min-width: 120px; }
        .col-title { color: var(--accent-gold); font-size: 11px; font-weight: 700; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 1px; }
        .col-card--accent { background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); border-left: 2px solid var(--accent-gold); padding: 12px 15px; border-radius: 0 4px 4px 0; }
        .col-card--plain { background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); padding: 12px 15px; border-radius: 4px; }
        .col-card--minimal { border-bottom: 1px solid var(--border-obsidian); padding-bottom: 10px; }
        .col-card--numbered { position: relative; background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); padding: 12px 15px 12px 40px; border-radius: 4px; }
        .col-num-badge { position: absolute; left: 10px; top: 12px; width: 20px; height: 20px; border-radius: 50%; background: linear-gradient(135deg, #C49A57, #8A6831); color: #0A0B0A; font-size: 10px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

        .tag-select {
            background-color: var(--surface-dark);
            border: 1px solid var(--border-obsidian);
            color: var(--accent-gold);
            padding: 5px 8px;
            border-radius: 4px;
            font-size: 9px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* =========================================================
           3. RIGHT PANEL: LIVE PREVIEW CANVAS
           ========================================================= */
        .preview-panel {
            flex: 1;
            background-color: #050505;
            overflow-y: auto;
            padding: 35px;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        #deck-container {
            display: flex;
            flex-direction: column;
            gap: 35px;
            width: 100%;
            max-width: 850px;
        }

        .slide {
            width: 100%;
            aspect-ratio: 16 / 9;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-obsidian);
            padding: 35px 40px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            page-break-after: always;
            break-after: page;
            page-break-inside: avoid;
            break-inside: avoid;
            overflow: hidden;
        }

        .slide::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 2px;
            background: linear-gradient(90deg, #C49A57 0%, rgba(196,154,87,0.2) 100%);
        }

        .corner-accent {
            position: absolute;
            width: 10px;
            height: 10px;
            border-color: var(--accent-gold);
            border-style: solid;
            opacity: 0.3;
        }
        .corner-tl { top: 12px; left: 12px; border-width: 1px 0 0 1px; }
        .corner-br { bottom: 12px; right: 12px; border-width: 0 1px 1px 0; }

        .content-tag-badge {
            position: absolute;
            top: 16px;
            right: 18px;
            background: rgba(196, 154, 87, 0.12);
            border: 1px solid var(--accent-gold);
            color: var(--accent-gold);
            font-size: 8px;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: 800;
        }

        .slide-body {
            flex: 1;
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 14px;
            align-content: center;
            align-items: start;
            margin: 18px 0;
        }

        .grid-item {
            grid-column: span var(--span, 6);
            position: relative;
            cursor: grab;
            border-radius: 4px;
            transition: outline 0.15s ease, opacity 0.15s ease;
        }
        .grid-item.dragging { opacity: 0.35; }
        .grid-item.drag-over { outline: 1px dashed var(--accent-gold); outline-offset: 4px; }
        .drag-handle {
            position: absolute;
            top: -10px;
            right: -6px;
            font-size: 11px;
            color: var(--text-muted);
            opacity: 0;
            transition: opacity 0.15s ease;
            user-select: none;
        }
        .grid-item:hover .drag-handle { opacity: 0.6; }

        .elem-header-title {
            border-bottom: 1px solid var(--border-obsidian);
            padding-bottom: 8px;
        }

        .elem-tag {
            font-size: 9px;
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 2px;
            font-weight: 700;
            margin-bottom: 4px;
        }

        .elem-title {
            font-size: 22px;
            font-weight: 800;
            color: var(--text-white);
            text-transform: uppercase;
            letter-spacing: 1px;
            line-height: 1.2;
        }

        .elem-grid { display: flex; gap: 12px; width: 100%; }

        .elem-card {
            flex: 1;
            background-color: rgba(22, 24, 22, 0.6);
            border: 1px solid var(--border-obsidian);
            border-left: 2px solid var(--accent-gold);
            padding: 12px 15px;
            border-radius: 0 4px 4px 0;
        }

        .elem-card-title {
            color: var(--accent-gold);
            font-size: 11px;
            font-weight: 700;
            margin-bottom: 6px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        p, li { color: #C0C2C0; font-size: 11px; line-height: 1.5; white-space: pre-line; }
        ul { padding-left: 15px; }

        .t-paragraf { font-size: 11px; color: #C0C2C0; line-height: 1.6; white-space: pre-line; }
        .t-subjudul { font-size: 18px; color: var(--accent-gold); font-weight: 700; line-height: 1.35; white-space: pre-line; }
        .t-judul { font-size: 29px; font-weight: 800; color: var(--text-white); text-transform: uppercase; letter-spacing: 1px; line-height: 1.15; white-space: pre-line; }
        .t-hero { font-size: 47px; font-weight: 800; color: var(--text-white); text-transform: uppercase; letter-spacing: 1px; line-height: 1.05; white-space: pre-line; }
        .text-card-wrap {
            background-color: rgba(22, 24, 22, 0.6);
            border: 1px solid var(--border-obsidian);
            border-left: 2px solid var(--accent-gold);
            padding: 14px 16px;
            border-radius: 0 4px 4px 0;
        }

        .var-up { color: var(--positive); font-weight: 700; white-space: nowrap; }
        .var-down { color: var(--negative); font-weight: 700; white-space: nowrap; }

        .malevin-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; }
        .malevin-table th {
            background-color: rgba(196, 154, 87, 0.12);
            color: var(--accent-gold);
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 8px 10px;
            border-bottom: 1px solid var(--accent-gold);
            text-align: left;
            font-weight: 700;
        }
        .malevin-table td { padding: 7px 10px; border-bottom: 1px solid var(--border-obsidian); color: #D1D1D1; }

        .kpi-grid { display: flex; gap: 10px; width: 100%; }
        .kpi-card { flex: 1; background: rgba(22, 24, 22, 0.8); border: 1px solid var(--border-obsidian); padding: 12px; text-align: center; border-radius: 4px; }
        .kpi-value { font-size: 24px; font-weight: 800; color: var(--accent-gold); letter-spacing: 1px; }
        .kpi-label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .chart-wrap { width: 100%; }
        .chart-bar-row { display: flex; align-items: flex-end; gap: 8px; height: 110px; width: 100%; }
        .chart-bar-col { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 6px; }
        .chart-bar-fill { width: 100%; background: linear-gradient(180deg, #C49A57, #8A6831); border-radius: 3px 3px 0 0; min-height: 2px; }
        .chart-bar-val { font-size: 9px; color: var(--accent-gold); font-weight: 700; }
        .chart-bar-lbl { font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; text-align: center; }

        .donut-wrap { display: flex; align-items: center; gap: 16px; }
        .donut-circle { width: 100px; height: 100px; border-radius: 50%; position: relative; flex-shrink: 0; }
        .donut-hole {
            position: absolute; inset: 15px;
            background: var(--bg-obsidian);
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 15px; font-weight: 800; color: var(--accent-gold);
        }
        .chart-legend { display: flex; flex-direction: column; gap: 5px; font-size: 9px; color: #C0C2C0; }
        .legend-dot { width: 8px; height: 8px; border-radius: 2px; display: inline-block; margin-right: 6px; }

        .progress-track { width: 100%; height: 10px; background: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 20px; overflow: hidden; }
        .progress-fill { height: 100%; background: linear-gradient(90deg, #8A6831, #C49A57); }

        .compare-box { display: flex; gap: 14px; align-items: center; width: 100%; }
        .compare-stat { flex: 1; }
        .compare-num { font-size: 20px; font-weight: 800; margin: 2px 0; }
        .compare-delta { font-size: 11px; font-weight: 800; padding: 4px 11px; border-radius: 20px; white-space: nowrap; }
        .delta-up { color: var(--positive); background: rgba(76, 175, 122, 0.12); }
        .delta-down { color: var(--negative); background: rgba(229, 83, 83, 0.12); }
        .delta-flat { color: var(--text-muted); background: rgba(128,130,128,0.12); }
        .var-tag { font-size: 7px; color: var(--text-muted); margin-top: 6px; letter-spacing: 0.5px; }

        .social-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; gap: 8px; flex-wrap: wrap; }
        .social-period { font-size: 9px; color: var(--accent-gold); font-weight: 700; text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
        .social-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; width: 100%; }
        .social-card { background: rgba(22, 24, 22, 0.7); border: 1px solid var(--border-obsidian); border-radius: 4px; padding: 10px 12px; }
        .social-card-label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; }
        .social-card-value { font-size: 17px; font-weight: 800; color: var(--text-white); margin: 3px 0 4px; }
        .social-card-delta { font-size: 9px; font-weight: 800; display: inline-flex; align-items: center; gap: 3px; padding: 1px 6px; border-radius: 20px; }

        .breakdown-bar { display: flex; width: 100%; height: 10px; border-radius: 20px; overflow: hidden; background: var(--card-obsidian); margin-bottom: 10px; }
        .breakdown-list { display: flex; flex-direction: column; gap: 6px; }
        .breakdown-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #C0C2C0; }
        .breakdown-pct { color: var(--accent-gold); font-weight: 700; }

        .slide-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-obsidian);
            padding-top: 10px;
            font-size: 8px;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
        }

        .slide-num { font-size: 11px; font-weight: 800; color: var(--accent-gold); }

        /* =========================================================
           4. RESPONSIVE MEDIA QUERIES
           ========================================================= */
        @media (max-width: 900px) {
            body { height: auto; overflow: auto; }
            .app-container { flex-direction: column; height: auto; overflow: visible; }
            .preview-panel { padding: 16px; overflow-x: auto; width: 100%; }
            #deck-container { min-width: 650px; }
        }

        /* =========================================================
           5. NATIVE VECTOR PRINT ENGINE (EXPORT PDF VEKTOR ASLI)
           ========================================================= */
        @media print {
            @page {
                size: 16in 9in;
                margin: 0;
            }

            html, body {
                background-color: #0A0B0A !important;
                color: #FEFEFE !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                margin: 0 !important;
                padding: 0 !important;
                width: 100% !important;
                height: auto !important;
                overflow: visible !important;
            }

            .topbar, .editor-panel, .drag-handle, .var-tag, button, select, input {
                display: none !important;
            }

            .app-container {
                display: block !important;
                height: auto !important;
                overflow: visible !important;
            }

            .preview-panel {
                display: block !important;
                padding: 0 !important;
                margin: 0 !important;
                background-color: #0A0B0A !important;
                width: 100% !important;
                overflow: visible !important;
            }

            #deck-container {
                width: 100% !important;
                max-width: none !important;
                min-width: 0 !important;
                gap: 0 !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            .slide {
                width: 100vw !important;
                height: 56.25vw !important;
                max-height: 100vh !important;
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 35px 40px !important;
                box-sizing: border-box !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
                background-color: #0A0B0A !important;
            }
        }
    </style>
</head>
<body>

    <!-- TOP CONTROL BAR -->
    <div class="topbar">
        <div class="brand-title">
            <span id="brandNameLabel">MALEVIN</span> <span class="brand-badge">MODULAR STUDIO</span>
        </div>
        <select class="tag-select account-select" id="accountSelect" onchange="setAccount(this.value)"></select>
        <div class="mode-tabs">
            <button class="mode-tab-btn" id="tabEditBtn" onclick="setMode('edit')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
                Edit
            </button>
            <button class="mode-tab-btn" id="tabPreviewBtn" onclick="setMode('preview')">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8Z"/><circle cx="12" cy="12" r="3"/></svg>
                Preview
            </button>
        </div>
        <div class="topbar-actions">
            <input type="file" id="importPdfInput" accept="application/pdf,.json" style="display:none" onchange="handleImportPDF(event)">
            <button class="btn" onclick="document.getElementById('importPdfInput').click()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                Import Project / PDF
            </button>
            <button class="btn" onclick="exportJSON()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
                Simpan Project (.json)
            </button>
            <button class="btn btn-gold" onclick="exportPDF()">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>
                Export PDF Vector
            </button>
        </div>
    </div>

    <!-- MAIN APP WRAPPER -->
    <div class="app-container">

        <!-- LEFT: MODULAR EDITOR PANEL -->
        <div class="editor-panel" id="editorPanel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; font-weight:800; color:var(--accent-gold); letter-spacing:1px;">SLIDES CONTROL</span>
                <button class="btn btn-gold" onclick="addSlide()">+ Halaman Baru</button>
            </div>
            <p style="font-size:9px; color:var(--text-muted); line-height:1.5;">Drag ikon ⠿ di tab Preview untuk mengatur ulang posisi elemen. Atur "Lebar Elemen" di tiap kartu untuk membentuk grid dinamis (1/3, 1/2, 2/3, Full). Elemen "Kolom" bisa dipilih desainnya & ditambah tanpa batas.</p>

            <div id="forms-wrapper"></div>
        </div>

        <!-- RIGHT: LIVE PREVIEW CANVAS -->
        <div class="preview-panel" id="previewPanel">
            <div id="deck-container"></div>
        </div>

    </div>

    <!-- JAVASCRIPT ENGINE -->
    <script>
        let BRAND_NAME = 'Malevin';
        let PURPOSE_TAGS = ['', 'Creative Deck', 'Laporan Bulanan'];

        const CHART_PALETTE = ['#C49A57', '#8A6831', '#E8C888', '#5B4A2F', '#77664A', '#A68653'];
        const ACCOUNTS = ['Malevin Official', 'Malevin ID', 'Housemart ID'];
        let currentAccount = ACCOUNTS[0];

        const MALEVIN_PDF_SIGNATURE = 'MALEVIN_DECK_V1::';

        const ELEM_LABELS = {
            cover: 'COVER', header: 'HEADER', text: 'TEKS', grid2: 'KOLOM (LAMA)', columns: 'KOLOM',
            table: 'TABEL', kpi: 'KPI', chart: 'GRAFIK', comparison: 'PERBANDINGAN',
            social: 'STATISTIK SOSIAL', breakdown: 'WAWASAN'
        };

        let slidesData = [
            {
                id: 1,
                footerLeft: `Prepared by ${BRAND_NAME} Creative & Production Team`,
                contentTag: 'Creative Deck',
                elements: [
                    { type: 'cover', tag: 'Creative Proposal', title: `${BRAND_NAME.toUpperCase()} CAMPAIGN DECK 2026`, subtitle: 'Dynamic Brand Strategy & Visual Direction', w: 6 }
                ]
            },
            {
                id: 2,
                footerLeft: 'Section 01 — Execution Strategy',
                contentTag: 'Creative Deck',
                elements: [
                    { type: 'header', tag: 'Section 01', title: 'PERFORMANCE & DELIVERABLES', w: 6 },
                    { type: 'kpi', k1Val: '1.2M+', k1Lbl: 'Monthly Reach', k2Val: '4.8%', k2Lbl: 'Eng. Rate', k3Val: '120+', k3Lbl: 'Video Assets', w: 6 },
                    {
                        type: 'table',
                        headers: 'Platform, Format, Target Output, Status',
                        rows: 'TikTok, Short Video, 40 Clips / Mo, Active\nInstagram, Reels & Grid, 20 Posts / Mo, Active\nYouTube, Shorts, 15 Clips / Mo, Scheduled',
                        w: 6
                    }
                ]
            },
            {
                id: 3,
                footerLeft: 'Section 02 — Monthly Analysis',
                contentTag: 'Laporan Bulanan',
                elements: [
                    { type: 'header', tag: 'Section 02', title: 'MONTHLY GROWTH COMPARISON', w: 6 },
                    { type: 'comparison', label: 'Total Penonton', varName: 'penonton', prevVal: '17100', currVal: '12100', unit: '', w: 6 },
                    { type: 'text', style: 'paragraf', tag: '', content: 'Total penonton bulan ini tercatat {{penonton}} dibanding bulan lalu. Perlu evaluasi distribusi konten pada jam tayang utama.', card: true, w: 3 },
                    { type: 'chart', chartType: 'donut', title: 'Distribusi Gender Penonton', labels: 'Perempuan, Laki-laki', values: '81, 19', showPercent: true, w: 3 }
                ]
            }
        ];

        function dirArrow(dir) { return dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—'; }

        function computeVariables() {
            const vars = {};
            slidesData.forEach(s => s.elements.forEach(e => {
                if (e.type === 'comparison' && e.varName) {
                    const prev = parseFloat(e.prevVal) || 0;
                    const curr = parseFloat(e.currVal) || 0;
                    const diff = curr - prev;
                    let pct;
                    if (prev !== 0) pct = Math.abs(diff / Math.abs(prev) * 100);
                    else pct = curr !== 0 ? 100 : 0;
                    const dir = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
                    vars[e.varName] = { display: `${dirArrow(dir)} ${pct.toFixed(1)}%`, dir };
                }
                if (e.type === 'social') {
                    (e.metrics || []).forEach(m => {
                        if (!m.varName) return;
                        const dir = m.dir || 'flat';
                        const pctText = (m.deltaPercent || '').trim();
                        const display = pctText ? `${dirArrow(dir)} ${pctText.replace(/^[+-]/, '')}` : (m.value || '-');
                        vars[m.varName] = { display, dir };
                    });
                }
                if (e.type === 'breakdown') {
                    (e.items || []).forEach(it => {
                        if (!it.varName) return;
                        vars[it.varName] = { display: `${it.percent || 0}%`, dir: 'flat' };
                    });
                }
            }));
            return vars;
        }

        function renderVars(str, vars) {
            if (!str) return '';
            return str.replace(/\{\{(\w+)\}\}/g, (m, name) => {
                const v = vars[name];
                if (!v) return m;
                const cls = v.dir === 'up' ? 'var-up' : v.dir === 'down' ? 'var-down' : '';
                return `<span class="${cls}">${v.display}</span>`;
            });
        }

        function setAccount(name) {
            currentAccount = name;
            BRAND_NAME = name;
            document.getElementById('brandNameLabel').textContent = BRAND_NAME.toUpperCase();
            renderPreview();
        }

        function computePeriodLabel(preset) {
            const bulanID = ['Jan', 'Feb', 'Mar', 'Apr', 'Mei', 'Jun', 'Jul', 'Agu', 'Sep', 'Okt', 'Nov', 'Des'];
            const now = new Date();
            const fmt = d => `${d.getDate()} ${bulanID[d.getMonth()]} ${d.getFullYear()}`;

            if (preset === 'hari-ini') return fmt(now);
            if (preset === 'kemarin') { const d = new Date(now); d.setDate(d.getDate() - 1); return fmt(d); }
            if (preset === '7hari') { const d = new Date(now); d.setDate(d.getDate() - 7); return `${fmt(d)} - ${fmt(now)}`; }
            if (preset === '28hari') { const d = new Date(now); d.setDate(d.getDate() - 28); return `${fmt(d)} - ${fmt(now)}`; }
            if (preset === 'bulan-ini') return `1 - ${now.getDate()} ${bulanID[now.getMonth()]} ${now.getFullYear()}`;
            if (preset === 'bulan-lalu') { const d = new Date(now.getFullYear(), now.getMonth() - 1, 1); return `${bulanID[d.getMonth()]} ${d.getFullYear()}`; }
            if (preset === 'tahun-ini') return `${now.getFullYear()}`;
            if (preset === 'tahun-lalu') return `${now.getFullYear() - 1}`;
            return '';
        }

        function onSocialPresetChange(sIdx, eIdx, preset) {
            const elem = slidesData[sIdx].elements[eIdx];
            elem.periodPreset = preset;
            if (preset !== 'kustom') elem.period = computePeriodLabel(preset);
            renderForms();
        }

        function updateColumnItem(sIdx, eIdx, cIdx, key, value) {
            slidesData[sIdx].elements[eIdx].cols[cIdx][key] = value;
            renderPreview();
        }
        function addColumnItem(sIdx, eIdx) {
            const cols = slidesData[sIdx].elements[eIdx].cols;
            cols.push({ title: 'Kolom ' + (cols.length + 1), text: 'Isi...' });
            renderForms();
        }
        function removeColumnItem(sIdx, eIdx, cIdx) {
            const cols = slidesData[sIdx].elements[eIdx].cols;
            if (cols.length <= 1) { alert('Minimal harus ada 1 kolom!'); return; }
            cols.splice(cIdx, 1);
            renderForms();
        }

        function updateSocialMetric(sIdx, eIdx, mIdx, key, value) {
            slidesData[sIdx].elements[eIdx].metrics[mIdx][key] = value;
            renderPreview();
        }
        function addSocialMetric(sIdx, eIdx) {
            slidesData[sIdx].elements[eIdx].metrics.push({ label: 'Metrik Baru', value: '0', deltaValue: '', deltaPercent: '', dir: 'up', varName: '' });
            renderForms();
        }
        function removeSocialMetric(sIdx, eIdx, mIdx) {
            slidesData[sIdx].elements[eIdx].metrics.splice(mIdx, 1);
            renderForms();
        }

        function updateBreakdownItem(sIdx, eIdx, iIdx, key, value) {
            slidesData[sIdx].elements[eIdx].items[iIdx][key] = value;
            renderPreview();
        }
        function addBreakdownItem(sIdx, eIdx) {
            slidesData[sIdx].elements[eIdx].items.push({ label: 'Kategori Baru', percent: '0', varName: '' });
            renderForms();
        }
        function removeBreakdownItem(sIdx, eIdx, iIdx) {
            slidesData[sIdx].elements[eIdx].items.splice(iIdx, 1);
            renderForms();
        }

        /* ============================
           1. RENDER LEFT EDITOR FORMS
           ============================ */
        function renderForms() {
            const wrapper = document.getElementById('forms-wrapper');
            wrapper.innerHTML = '';

            slidesData.forEach((slide, sIdx) => {
                const card = document.createElement('div');
                card.className = 'slide-accordion';

                let elementsHTML = '';

                slide.elements.forEach((elem, eIdx) => {
                    let fields = '';

                    if (elem.type === 'cover') {
                        fields = `
                            <div class="form-group"><label>Tag</label><input type="text" class="form-control" value="${elem.tag || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'tag', this.value)"></div>
                            <div class="form-group"><label>Judul Utama</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>
                            <div class="form-group"><label>Sub-judul</label><input type="text" class="form-control" value="${elem.subtitle || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'subtitle', this.value)"></div>
                        `;
                    } else if (elem.type === 'header') {
                        fields = `
                            <div class="form-group"><label>Tag Section</label><input type="text" class="form-control" value="${elem.tag || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'tag', this.value)"></div>
                            <div class="form-group"><label>Judul Section</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>
                        `;
                    } else if (elem.type === 'text') {
                        fields = `
                            <div class="form-group"><label>Ukuran Teks (Golden Ratio)</label>
                                <select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'style', this.value)">
                                    <option value="hero" ${elem.style === 'hero' ? 'selected' : ''}>Hero — 47px</option>
                                    <option value="judul" ${elem.style === 'judul' ? 'selected' : ''}>Judul — 29px</option>
                                    <option value="subjudul" ${elem.style === 'subjudul' ? 'selected' : ''}>Sub Judul — 18px</option>
                                    <option value="paragraf" ${(!elem.style || elem.style === 'paragraf') ? 'selected' : ''}>Paragraf — 11px</option>
                                </select>
                            </div>
                            <div class="form-group"><label>Eyebrow / Tag (opsional)</label><input type="text" class="form-control" value="${elem.tag || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'tag', this.value)"></div>
                            <div class="form-group"><label>Isi Teks — bisa pakai {{namavariable}}</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'content', this.value)">${elem.content || ''}</textarea></div>
                            <div class="form-group"><label style="display:flex; align-items:center; gap:6px; text-transform:none;"><input type="checkbox" ${elem.card ? 'checked' : ''} onchange="updateElem(${sIdx}, ${eIdx}, 'card', this.checked)"> Bungkus dengan Card</label></div>
                        `;
                    } else if (elem.type === 'grid2') {
                        fields = `
                            <div class="form-group"><label>Judul Kolom 1</label><input type="text" class="form-control" value="${elem.c1Title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'c1Title', this.value)"></div>
                            <div class="form-group"><label>Teks Kolom 1</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'c1Text', this.value)">${elem.c1Text || ''}</textarea></div>
                            <div class="form-group"><label>Judul Kolom 2</label><input type="text" class="form-control" value="${elem.c2Title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'c2Title', this.value)"></div>
                            <div class="form-group"><label>Teks Kolom 2</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'c2Text', this.value)">${elem.c2Text || ''}</textarea></div>
                        `;
                    } else if (elem.type === 'columns') {
                        const designOptions = [
                            ['accent', 'Aksen Garis Emas'],
                            ['plain', 'Kartu Polos'],
                            ['minimal', 'Minimalis (Tanpa Kotak)'],
                            ['numbered', 'Kartu Bernomor']
                        ].map(([v, l]) => `<option value="${v}" ${(elem.design || 'accent') === v ? 'selected' : ''}>${l}</option>`).join('');

                        const colRows = (elem.cols || []).map((c, cIdx) => `
                            <div class="element-box">
                                <div class="element-header">
                                    <span>KOLOM ${cIdx + 1}</span>
                                    <button class="btn btn-danger" onclick="removeColumnItem(${sIdx}, ${eIdx}, ${cIdx})">Hapus</button>
                                </div>
                                <div class="form-group"><label>Judul Kolom</label><input type="text" class="form-control" value="${c.title || ''}" oninput="updateColumnItem(${sIdx}, ${eIdx}, ${cIdx}, 'title', this.value)"></div>
                                <div class="form-group"><label>Isi Teks</label><textarea class="form-control" oninput="updateColumnItem(${sIdx}, ${eIdx}, ${cIdx}, 'text', this.value)">${c.text || ''}</textarea></div>
                            </div>
                        `).join('');

                        fields = `
                            <div class="form-group"><label>Desain Kolom</label>
                                <select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'design', this.value)">${designOptions}</select>
                            </div>
                            ${colRows}
                            <button class="btn" onclick="addColumnItem(${sIdx}, ${eIdx})">+ Tambah Kolom</button>
                        `;
                    } else if (elem.type === 'table') {
                        fields = `
                            <div class="form-group"><label>Headers Tabel (Pisahkan Koma)</label><input type="text" class="form-control" value="${elem.headers || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'headers', this.value)"></div>
                            <div class="form-group"><label>Baris Tabel (Baris baru = Row, Koma = Kolom)</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'rows', this.value)">${elem.rows || ''}</textarea></div>
                        `;
                    } else if (elem.type === 'kpi') {
                        fields = `
                            <div style="display:flex; gap:6px;">
                                <div class="form-group" style="flex:1;"><label>KPI 1 Value</label><input type="text" class="form-control" value="${elem.k1Val || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'k1Val', this.value)"></div>
                                <div class="form-group" style="flex:1;"><label>KPI 1 Label</label><input type="text" class="form-control" value="${elem.k1Lbl || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'k1Lbl', this.value)"></div>
                            </div>
                            <div style="display:flex; gap:6px;">
                                <div class="form-group" style="flex:1;"><label>KPI 2 Value</label><input type="text" class="form-control" value="${elem.k2Val || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'k2Val', this.value)"></div>
                                <div class="form-group" style="flex:1;"><label>KPI 2 Label</label><input type="text" class="form-control" value="${elem.k2Lbl || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'k2Lbl', this.value)"></div>
                            </div>
                            <div style="display:flex; gap:6px;">
                                <div class="form-group" style="flex:1;"><label>KPI 3 Value</label><input type="text" class="form-control" value="${elem.k3Val || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'k3Val', this.value)"></div>
                                <div class="form-group" style="flex:1;"><label>KPI 3 Label</label><input type="text" class="form-control" value="${elem.k3Lbl || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'k3Lbl', this.value)"></div>
                            </div>
                        `;
                    } else if (elem.type === 'chart') {
                        fields = `
                            <div class="form-group"><label>Tipe Grafik</label>
                                <select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'chartType', this.value)">
                                    <option value="bar" ${elem.chartType === 'bar' ? 'selected' : ''}>Bar Chart</option>
                                    <option value="line" ${elem.chartType === 'line' ? 'selected' : ''}>Line Chart</option>
                                    <option value="pie" ${elem.chartType === 'pie' ? 'selected' : ''}>Pie Chart</option>
                                    <option value="donut" ${elem.chartType === 'donut' ? 'selected' : ''}>Donut (Persentase Tengah)</option>
                                    <option value="progress" ${elem.chartType === 'progress' ? 'selected' : ''}>Progress Bar</option>
                                </select>
                            </div>
                            <div class="form-group"><label>Judul Grafik</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>
                            ${elem.chartType === 'progress' ? `
                                <div style="display:flex; gap:6px;">
                                    <div class="form-group" style="flex:1;"><label>Nilai</label><input type="text" class="form-control" value="${elem.values || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'values', this.value)"></div>
                                    <div class="form-group" style="flex:1;"><label>Target</label><input type="text" class="form-control" value="${elem.target || '100'}" oninput="updateElem(${sIdx}, ${eIdx}, 'target', this.value)"></div>
                                    <div class="form-group" style="flex:1;"><label>Satuan</label><input type="text" class="form-control" value="${elem.unit || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'unit', this.value)"></div>
                                </div>
                            ` : `
                                <div class="form-group"><label>Label (pisahkan koma)</label><input type="text" class="form-control" value="${elem.labels || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'labels', this.value)"></div>
                                <div class="form-group"><label>Nilai (pisahkan koma)</label><input type="text" class="form-control" value="${elem.values || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'values', this.value)"></div>
                            `}
                            ${(elem.chartType === 'pie' || elem.chartType === 'donut') ? `
                                <div class="form-group"><label style="display:flex; align-items:center; gap:6px; text-transform:none;"><input type="checkbox" ${elem.showPercent !== false ? 'checked' : ''} onchange="updateElem(${sIdx}, ${eIdx}, 'showPercent', this.checked)"> Tampilkan Persentase</label></div>
                                ${elem.chartType === 'donut' ? `<div class="form-group"><label>Teks Tengah (kosongkan = otomatis)</label><input type="text" class="form-control" value="${elem.centerText || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'centerText', this.value)"></div>` : ''}
                            ` : ''}
                        `;
                    } else if (elem.type === 'comparison') {
                        fields = `
                            <div class="form-group"><label>Nama Metrik</label><input type="text" class="form-control" value="${elem.label || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'label', this.value)"></div>
                            <div class="form-group"><label>Nama Variable — dipakai di teks sbg {{nama}}</label><input type="text" class="form-control" value="${elem.varName || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'varName', this.value)"></div>
                            <div style="display:flex; gap:6px;">
                                <div class="form-group" style="flex:1;"><label>Bulan Lalu</label><input type="text" class="form-control" value="${elem.prevVal || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'prevVal', this.value)"></div>
                                <div class="form-group" style="flex:1;"><label>Sekarang</label><input type="text" class="form-control" value="${elem.currVal || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'currVal', this.value)"></div>
                                <div class="form-group" style="flex:1;"><label>Satuan</label><input type="text" class="form-control" value="${elem.unit || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'unit', this.value)"></div>
                            </div>
                        `;
                    } else if (elem.type === 'social') {
                        const presetOptions = [
                            ['kustom', 'Kustom (ketik manual)'], ['hari-ini', 'Hari Ini'], ['kemarin', 'Kemarin'],
                            ['7hari', '7 Hari Terakhir'], ['28hari', '28 Hari Terakhir'], ['bulan-ini', 'Bulan Ini'],
                            ['bulan-lalu', 'Bulan Lalu'], ['tahun-ini', 'Tahun Ini'], ['tahun-lalu', 'Tahun Lalu']
                        ].map(([v, l]) => `<option value="${v}" ${(elem.periodPreset || 'kustom') === v ? 'selected' : ''}>${l}</option>`).join('');

                        const metricRows = (elem.metrics || []).map((m, mIdx) => `
                            <div class="element-box">
                                <div class="element-header">
                                    <span>METRIK ${mIdx + 1}</span>
                                    <button class="btn btn-danger" onclick="removeSocialMetric(${sIdx}, ${eIdx}, ${mIdx})">Hapus</button>
                                </div>
                                <div class="form-group"><label>Nama Metrik</label><input type="text" class="form-control" value="${m.label || ''}" oninput="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'label', this.value)"></div>
                                <div class="form-group"><label>Nama Variabel (opsional)</label><input type="text" class="form-control" value="${m.varName || ''}" oninput="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'varName', this.value)"></div>
                                <div style="display:flex; gap:6px;">
                                    <div class="form-group" style="flex:1;"><label>Nilai</label><input type="text" class="form-control" value="${m.value || ''}" oninput="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'value', this.value)"></div>
                                    <div class="form-group" style="flex:1;"><label>Arah Perubahan</label>
                                        <select class="form-control" onchange="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'dir', this.value)">
                                            <option value="up" ${m.dir === 'up' ? 'selected' : ''}>Naik</option>
                                            <option value="down" ${m.dir === 'down' ? 'selected' : ''}>Turun</option>
                                            <option value="flat" ${m.dir === 'flat' ? 'selected' : ''}>Tetap</option>
                                        </select>
                                    </div>
                                </div>
                                <div style="display:flex; gap:6px;">
                                    <div class="form-group" style="flex:1;"><label>Perubahan Nilai</label><input type="text" class="form-control" placeholder="cth: +91" value="${m.deltaValue || ''}" oninput="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'deltaValue', this.value)"></div>
                                    <div class="form-group" style="flex:1;"><label>Perubahan Persen</label><input type="text" class="form-control" placeholder="cth: +13.6%" value="${m.deltaPercent || ''}" oninput="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'deltaPercent', this.value)"></div>
                                </div>
                            </div>
                        `).join('');

                        fields = `
                            <div class="form-group"><label>Judul Section</label><input type="text" class="form-control" value="${elem.sectionTitle || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'sectionTitle', this.value)"></div>
                            <div style="display:flex; gap:6px;">
                                <div class="form-group" style="flex:1;"><label>Periode Cepat</label>
                                    <select class="form-control" onchange="onSocialPresetChange(${sIdx}, ${eIdx}, this.value)">${presetOptions}</select>
                                </div>
                                <div class="form-group" style="flex:1;"><label>Teks Periode</label><input type="text" class="form-control" value="${elem.period || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'period', this.value)"></div>
                            </div>
                            ${metricRows}
                            <button class="btn" onclick="addSocialMetric(${sIdx}, ${eIdx})">+ Tambah Metrik</button>
                        `;
                    } else if (elem.type === 'breakdown') {
                        const itemRows = (elem.items || []).map((it, iIdx) => `
                            <div class="element-box">
                                <div class="element-header">
                                    <span>BARIS ${iIdx + 1}</span>
                                    <button class="btn btn-danger" onclick="removeBreakdownItem(${sIdx}, ${eIdx}, ${iIdx})">Hapus</button>
                                </div>
                                <div style="display:flex; gap:6px;">
                                    <div class="form-group" style="flex:2;"><label>Label</label><input type="text" class="form-control" value="${it.label || ''}" oninput="updateBreakdownItem(${sIdx}, ${eIdx}, ${iIdx}, 'label', this.value)"></div>
                                    <div class="form-group" style="flex:1;"><label>Persen (%)</label><input type="text" class="form-control" value="${it.percent || ''}" oninput="updateBreakdownItem(${sIdx}, ${eIdx}, ${iIdx}, 'percent', this.value)"></div>
                                </div>
                                <div class="form-group"><label>Nama Variabel</label><input type="text" class="form-control" value="${it.varName || ''}" oninput="updateBreakdownItem(${sIdx}, ${eIdx}, ${iIdx}, 'varName', this.value)"></div>
                            </div>
                        `).join('');

                        fields = `
                            <div class="form-group"><label>Judul</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>
                            <div class="form-group"><label>Kategori</label><input type="text" class="form-control" value="${elem.category || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'category', this.value)"></div>
                            ${itemRows}
                            <button class="btn" onclick="addBreakdownItem(${sIdx}, ${eIdx})">+ Tambah Baris</button>
                        `;
                    }

                    const widthField = `
                        <div class="form-group"><label>Lebar Elemen</label>
                            <select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'w', parseInt(this.value))">
                                <option value="2" ${elem.w == 2 ? 'selected' : ''}>1/3</option>
                                <option value="3" ${elem.w == 3 ? 'selected' : ''}>1/2</option>
                                <option value="4" ${elem.w == 4 ? 'selected' : ''}>2/3</option>
                                <option value="6" ${(!elem.w || elem.w == 6) ? 'selected' : ''}>Full</option>
                            </select>
                        </div>
                    `;
                    if (elem.type !== 'cover') fields = widthField + fields;

                    elementsHTML += `
                        <div class="element-box">
                            <div class="element-header">
                                <span>ELEMEN ${eIdx + 1}: ${ELEM_LABELS[elem.type] || elem.type.toUpperCase()}</span>
                                <button class="btn btn-danger" onclick="deleteElem(${sIdx}, ${eIdx})">Hapus</button>
                            </div>
                            ${fields}
                        </div>
                    `;
                });

                const tagOptions = PURPOSE_TAGS.map(t => `<option value="${t}" ${slide.contentTag === t ? 'selected' : ''}>${t || '— Tujuan Pembuatan —'}</option>`).join('');

                card.innerHTML = `
                    <div class="slide-accordion-header">
                        <strong style="font-size:12px; color:var(--accent-gold);">SLIDE ${sIdx + 1}</strong>
                        <select class="tag-select" onchange="updateSlideTag(${sIdx}, this.value)">${tagOptions}</select>
                        <button class="btn btn-danger" onclick="deleteSlide(${sIdx})">Hapus Slide</button>
                    </div>
                    <div class="form-group">
                        <label>Teks Footer Kiri</label>
                        <input type="text" class="form-control" value="${slide.footerLeft || ''}" oninput="updateSlideFooter(${sIdx}, this.value)">
                    </div>
                    <div>
                        <label class="micro-label">+ TAMBAH ELEMEN KONTEN:</label>
                        <div class="add-element-bar">
                            <button class="btn" onclick="addElem(${sIdx}, 'cover')">+ Cover</button>
                            <button class="btn" onclick="addElem(${sIdx}, 'header')">+ Header</button>
                            <button class="btn" onclick="addElem(${sIdx}, 'text')">+ Teks</button>
                            <button class="btn" onclick="addElem(${sIdx}, 'columns')">+ Kolom</button>
                            <button class="btn" onclick="addElem(${sIdx}, 'table')">+ Tabel</button>
                            <button class="btn" onclick="addElem(${sIdx}, 'kpi')">+ KPI</button>
                            <button class="btn" onclick="addElem(${sIdx}, 'chart')">+ Grafik</button>
                        </div>
                        <label class="micro-label" style="margin-top:10px; display:block; color:var(--accent-gold);">+ TAMBAH ELEMEN ANALISIS:</label>
                        <div class="add-element-bar">
                            <button class="btn" onclick="addElem(${sIdx}, 'comparison')">+ Perbandingan</button>
                            <button class="btn" onclick="addElem(${sIdx}, 'social')">+ Statistik</button>
                            <button class="btn" onclick="addElem(${sIdx}, 'breakdown')">+ Wawasan</button>
                        </div>
                    </div>
                    ${elementsHTML}
                `;

                wrapper.appendChild(card);
            });

            renderPreview();
        }

        /* ============================
           2. RENDER LIVE PREVIEW
           ============================ */
        function renderPreview() {
            const container = document.getElementById('deck-container');
            container.innerHTML = '';
            const vars = computeVariables();

            slidesData.forEach((slide, sIdx) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';

                const slideNum = sIdx + 1 < 10 ? '0' + (sIdx + 1) : sIdx + 1;
                let bodyHTML = '';

                slide.elements.forEach((elem, eIdx) => {
                    let piece = '';

                    if (elem.type === 'cover') {
                        piece = `
                            <div style="margin: auto 0;">
                                <div class="elem-tag">${elem.tag || ''}</div>
                                <div class="elem-title" style="font-size:30px; margin: 10px 0;">${elem.title || ''}</div>
                                <p style="font-size:13px; color:var(--accent-gold);">${elem.subtitle || ''}</p>
                            </div>
                        `;
                    } else if (elem.type === 'header') {
                        piece = `
                            <div class="elem-header-title">
                                <div class="elem-tag">${elem.tag || ''}</div>
                                <div class="elem-title">${elem.title || ''}</div>
                            </div>
                        `;
                    } else if (elem.type === 'text') {
                        const cls = 't-' + (elem.style || 'paragraf');
                        const inner = `${elem.tag ? `<div class="elem-tag">${elem.tag}</div>` : ''}<div class="${cls}">${renderVars(elem.content || '', vars)}</div>`;
                        piece = elem.card ? `<div class="text-card-wrap">${inner}</div>` : inner;
                    } else if (elem.type === 'grid2') {
                        piece = `
                            <div class="elem-grid">
                                <div class="elem-card">
                                    <div class="elem-card-title">${elem.c1Title || ''}</div>
                                    <p>${renderVars(elem.c1Text || '', vars)}</p>
                                </div>
                                <div class="elem-card">
                                    <div class="elem-card-title">${elem.c2Title || ''}</div>
                                    <p>${renderVars(elem.c2Text || '', vars)}</p>
                                </div>
                            </div>
                        `;
                    } else if (elem.type === 'columns') {
                        piece = renderColumnsElement(elem, vars);
                    } else if (elem.type === 'table') {
                        const headersArr = elem.headers ? elem.headers.split(',') : [];
                        const rowsArr = elem.rows ? elem.rows.split('\n') : [];
                        let thHTML = headersArr.map(h => `<th>${h.trim()}</th>`).join('');
                        let trHTML = rowsArr.map(r => {
                            const cols = r.split(',');
                            return `<tr>${cols.map(c => `<td>${c.trim()}</td>`).join('')}</tr>`;
                        }).join('');
                        piece = `
                            <table class="malevin-table">
                                <thead><tr>${thHTML}</tr></thead>
                                <tbody>${trHTML}</tbody>
                            </table>
                        `;
                    } else if (elem.type === 'kpi') {
                        piece = `
                            <div class="kpi-grid">
                                <div class="kpi-card"><div class="kpi-value">${elem.k1Val || '-'}</div><div class="kpi-label">${elem.k1Lbl || ''}</div></div>
                                <div class="kpi-card"><div class="kpi-value">${elem.k2Val || '-'}</div><div class="kpi-label">${elem.k2Lbl || ''}</div></div>
                                <div class="kpi-card"><div class="kpi-value">${elem.k3Val || '-'}</div><div class="kpi-label">${elem.k3Lbl || ''}</div></div>
                            </div>
                        `;
                    } else if (elem.type === 'chart') {
                        piece = renderChartElement(elem);
                    } else if (elem.type === 'comparison') {
                        piece = renderComparisonElement(elem);
                    } else if (elem.type === 'social') {
                        piece = renderSocialElement(elem);
                    } else if (elem.type === 'breakdown') {
                        piece = renderBreakdownElement(elem);
                    }

                    bodyHTML += `
                        <div class="grid-item" style="--span:${elem.w || 6};" draggable="true"
                             ondragstart="onDragStart(event, ${sIdx}, ${eIdx})"
                             ondragend="onDragEnd(event)"
                             ondragover="onDragOver(event)"
                             ondragleave="onDragLeave(event)"
                             ondrop="onDrop(event, ${sIdx}, ${eIdx})">
                            <span class="drag-handle">⠿</span>
                            ${piece}
                        </div>
                    `;
                });

                slideEl.innerHTML = `
                    <div class="corner-accent corner-tl"></div>
                    <div class="corner-accent corner-br"></div>
                    ${slide.contentTag ? `<div class="content-tag-badge">${slide.contentTag}</div>` : ''}
                    <div class="slide-body">${bodyHTML}</div>
                    <div class="slide-footer">
                        <span>${slide.footerLeft || ''}</span>
                        <span class="slide-num">${slideNum}</span>
                    </div>
                `;

                container.appendChild(slideEl);
            });
        }

        /* ============================
           CHART RENDERERS
           ============================ */
        function renderChartElement(elem) {
            const labels = (elem.labels || '').split(',').map(s => s.trim()).filter(Boolean);
            const values = (elem.values || '').split(',').map(s => parseFloat(s.trim()) || 0);
            const max = Math.max(...values, 1);
            const total = values.reduce((a, b) => a + b, 0) || 1;

            if (elem.chartType === 'line') {
                const w = 300, h = 90;
                const n = Math.max(values.length - 1, 1);
                const pts = values.map((v, i) => `${(i / n) * w},${h - (v / max) * (h * 0.85)}`).join(' ');
                const dots = values.map((v, i) => `<circle cx="${(i / n) * w}" cy="${h - (v / max) * (h * 0.85)}" r="3" fill="#C49A57"/>`).join('');
                return `
                    <div class="chart-wrap">
                        ${elem.title ? `<div class="elem-card-title">${elem.title}</div>` : ''}
                        <svg viewBox="0 0 ${w} ${h}" style="width:100%; height:100px; overflow:visible;">
                            <polyline points="${pts}" fill="none" stroke="#C49A57" stroke-width="2"/>
                            ${dots}
                        </svg>
                        <div style="display:flex; justify-content:space-between; margin-top:4px;">
                            ${labels.map(l => `<span class="chart-bar-lbl">${l}</span>`).join('')}
                        </div>
                    </div>
                `;
            }

            if (elem.chartType === 'pie' || elem.chartType === 'donut') {
                let cum = 0;
                const grad = values.map((v, i) => {
                    const s = cum / total * 360; cum += v; const e = cum / total * 360;
                    return `${CHART_PALETTE[i % CHART_PALETTE.length]} ${s}deg ${e}deg`;
                }).join(',');
                const centerVal = elem.centerText || (values.length ? Math.round(values[0] / total * 100) + '%' : '');
                return `
                    <div class="chart-wrap">
                        ${elem.title ? `<div class="elem-card-title">${elem.title}</div>` : ''}
                        <div class="donut-wrap">
                            <div class="donut-circle" style="background:conic-gradient(${grad});">
                                ${elem.chartType === 'donut' ? `<div class="donut-hole">${centerVal}</div>` : ''}
                            </div>
                            <div class="chart-legend">
                                ${labels.map((l, i) => `<div><span class="legend-dot" style="background:${CHART_PALETTE[i % CHART_PALETTE.length]}"></span>${l}${elem.showPercent !== false ? ' — ' + Math.round(values[i] / total * 100) + '%' : ''}</div>`).join('')}
                            </div>
                        </div>
                    </div>
                `;
            }

            if (elem.chartType === 'progress') {
                const val = parseFloat((elem.values || '0').split(',')[0]) || 0;
                const target = parseFloat(elem.target) || 100;
                const pct = Math.min(100, (val / target * 100)).toFixed(0);
                return `
                    <div class="chart-wrap">
                        <div style="display:flex; justify-content:space-between; margin-bottom:6px;">
                            <span class="chart-bar-lbl">${elem.title || 'Progress'}</span>
                            <span class="chart-bar-val">${val} / ${target}${elem.unit || ''} (${pct}%)</span>
                        </div>
                        <div class="progress-track"><div class="progress-fill" style="width:${pct}%"></div></div>
                    </div>
                `;
            }

            return `
                <div class="chart-wrap">
                    ${elem.title ? `<div class="elem-card-title">${elem.title}</div>` : ''}
                    <div class="chart-bar-row">
                        ${values.map((v, i) => `
                            <div class="chart-bar-col">
                                <span class="chart-bar-val">${v}</span>
                                <div class="chart-bar-fill" style="height:${(v / max) * 100}%;"></div>
                                <span class="chart-bar-lbl">${labels[i] || ''}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            `;
        }

        function renderComparisonElement(elem) {
            const prev = parseFloat(elem.prevVal) || 0;
            const curr = parseFloat(elem.currVal) || 0;
            const diff = curr - prev;
            const pct = prev !== 0 ? Math.abs(diff / Math.abs(prev) * 100).toFixed(1) : (curr !== 0 ? '100.0' : '0.0');
            const dir = diff > 0 ? 'up' : diff < 0 ? 'down' : 'flat';
            const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
            const deltaCls = dir === 'up' ? 'delta-up' : dir === 'down' ? 'delta-down' : 'delta-flat';
            const maxV = Math.max(prev, curr, 1);

            return `
                <div class="compare-box">
                    <div class="compare-stat">
                        <div class="chart-bar-lbl">${elem.label || 'Metrik'} (Bulan Lalu)</div>
                        <div class="compare-num" style="color:var(--text-muted)">${elem.prevVal || 0}${elem.unit || ''}</div>
                        <div class="progress-track"><div class="progress-fill" style="width:${(prev / maxV) * 100}%; opacity:0.45;"></div></div>
                    </div>
                    <div class="compare-stat">
                        <div class="chart-bar-lbl">${elem.label || 'Metrik'} (Sekarang)</div>
                        <div class="compare-num" style="color:var(--accent-gold)">${elem.currVal || 0}${elem.unit || ''}</div>
                        <div class="progress-track"><div class="progress-fill" style="width:${(curr / maxV) * 100}%;"></div></div>
                    </div>
                    <div class="compare-delta ${deltaCls}">${arrow} ${pct}%</div>
                </div>
                ${elem.varName ? `<div class="var-tag">Variabel teks: {{${elem.varName}}}</div>` : ''}
            `;
        }

        function renderColumnsElement(elem, vars) {
            const cols = elem.cols || [];
            const design = elem.design || 'accent';
            const items = cols.map((c, i) => `
                <div class="col-item col-card--${design}">
                    ${design === 'numbered' ? `<div class="col-num-badge">${i + 1}</div>` : ''}
                    <div class="col-title">${c.title || ''}</div>
                    <p>${renderVars(c.text || '', vars)}</p>
                </div>
            `).join('');
            return `<div class="col-wrap">${items}</div>`;
        }

        function renderSocialElement(elem) {
            const metrics = elem.metrics || [];
            const activeVars = metrics.filter(m => m.varName).map(m => m.varName);
            const cards = metrics.map(m => {
                const dir = m.dir || 'flat';
                const arrow = dir === 'up' ? '▲' : dir === 'down' ? '▼' : '—';
                const deltaCls = dir === 'up' ? 'delta-up' : dir === 'down' ? 'delta-down' : 'delta-flat';
                const deltaText = [m.deltaValue, m.deltaPercent ? `(${m.deltaPercent})` : ''].filter(Boolean).join(' ');
                return `
                    <div class="social-card">
                        <div class="social-card-label">${m.label || ''}</div>
                        <div class="social-card-value">${m.value || '-'}</div>
                        ${deltaText ? `<div class="social-card-delta ${deltaCls}">${arrow} ${deltaText}</div>` : ''}
                    </div>
                `;
            }).join('');
            return `
                <div class="chart-wrap">
                    <div class="social-head">
                        ${elem.sectionTitle ? `<div class="elem-card-title" style="margin:0;">${elem.sectionTitle}</div>` : '<span></span>'}
                        ${elem.period ? `<span class="social-period">${elem.period}</span>` : ''}
                    </div>
                    <div class="social-grid">${cards}</div>
                    ${activeVars.length ? `<div class="var-tag">Variabel teks: ${activeVars.map(v => '{{' + v + '}}').join(', ')}</div>` : ''}
                </div>
            `;
        }

        function renderBreakdownElement(elem) {
            const items = elem.items || [];
            const activeVars = items.filter(it => it.varName).map(it => it.varName);
            const segs = items.map((it, i) => `<div style="flex:${Math.max(parseFloat(it.percent) || 0, 0.001)}; background:${CHART_PALETTE[i % CHART_PALETTE.length]};"></div>`).join('');
            const rows = items.map((it, i) => `
                <div class="breakdown-row">
                    <span><span class="legend-dot" style="background:${CHART_PALETTE[i % CHART_PALETTE.length]}"></span>${it.label || ''}</span>
                    <span class="breakdown-pct">${it.percent || 0}%</span>
                </div>
            `).join('');
            return `
                <div class="chart-wrap">
                    <div class="social-head">
                        ${elem.title ? `<div class="elem-card-title" style="margin:0;">${elem.title}</div>` : '<span></span>'}
                        ${elem.category ? `<span class="social-period">${elem.category}</span>` : ''}
                    </div>
                    <div class="breakdown-bar">${segs}</div>
                    <div class="breakdown-list">${rows}</div>
                    ${activeVars.length ? `<div class="var-tag">Variabel teks: ${activeVars.map(v => '{{' + v + '}}').join(', ')}</div>` : ''}
                </div>
            `;
        }

        /* ============================
           3. DRAG & DROP
           ============================ */
        let dragSrc = null;

        function onDragStart(e, sIdx, eIdx) {
            dragSrc = { sIdx, eIdx };
            e.currentTarget.classList.add('dragging');
            e.dataTransfer.effectAllowed = 'move';
        }
        function onDragEnd(e) {
            e.currentTarget.classList.remove('dragging');
            document.querySelectorAll('.drag-over').forEach(el => el.classList.remove('drag-over'));
        }
        function onDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }
        function onDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }
        function onDrop(e, sIdx, eIdx) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');
            if (!dragSrc || dragSrc.sIdx !== sIdx) { dragSrc = null; return; }
            const arr = slidesData[sIdx].elements;
            const [moved] = arr.splice(dragSrc.eIdx, 1);
            arr.splice(eIdx, 0, moved);
            dragSrc = null;
            renderForms();
        }

        /* ============================
           4. HELPER / CRUD FUNCTIONS
           ============================ */
        function updateSlideFooter(sIdx, value) {
            slidesData[sIdx].footerLeft = value;
            renderPreview();
        }

        function updateSlideTag(sIdx, value) {
            slidesData[sIdx].contentTag = value;
            renderPreview();
        }

        function updateElem(sIdx, eIdx, key, value) {
            slidesData[sIdx].elements[eIdx][key] = value;
            renderPreview();
        }

        function addElem(sIdx, type) {
            let newElem = { type, w: 6 };
            if (type === 'cover') newElem = { type, tag: 'Creative Proposal', title: 'JUDUL COVER BARU', subtitle: 'Sub-judul deskriptif', w: 6 };
            if (type === 'header') newElem = { type, tag: 'Section Tag', title: 'Judul Baru', w: 6 };
            if (type === 'text') newElem = { type, style: 'paragraf', tag: '', content: 'Ketikkan teks di sini...', card: false, w: 6 };
            if (type === 'grid2') newElem = { type, c1Title: 'Kolom 1', c1Text: 'Isi...', c2Title: 'Kolom 2', c2Text: 'Isi...', w: 6 };
            if (type === 'columns') newElem = {
                type, design: 'accent',
                cols: [
                    { title: 'Kolom 1', text: 'Isi...' },
                    { title: 'Kolom 2', text: 'Isi...' }
                ],
                w: 6
            };
            if (type === 'table') newElem = { type, headers: 'Item, Target, Status', rows: 'Video A, 10K Views, Done\nVideo B, 50K Views, Process', w: 6 };
            if (type === 'kpi') newElem = { type, k1Val: '100', k1Lbl: 'Stat 1', k2Val: '50%', k2Lbl: 'Stat 2', k3Val: '24/7', k3Lbl: 'Stat 3', w: 6 };
            if (type === 'chart') newElem = { type, chartType: 'bar', title: 'Judul Grafik', labels: 'Jan, Feb, Mar', values: '10, 20, 15', showPercent: true, w: 3 };
            if (type === 'comparison') newElem = { type, label: 'Nama Metrik', varName: 'metrik' + (Date.now() % 1000), prevVal: '1000', currVal: '900', unit: '', w: 6 };
            if (type === 'social') newElem = {
                type, sectionTitle: 'Ikhtisar', period: '', periodPreset: 'kustom',
                metrics: [
                    { label: 'Tayangan Postingan', value: '40,3 rb', deltaValue: '-10,5 rb', deltaPercent: '-20.7%', dir: 'down', varName: '' },
                    { label: 'Tampilan Profil', value: '762', deltaValue: '+91', deltaPercent: '+13.6%', dir: 'up', varName: '' },
                    { label: 'Suka', value: '733', deltaValue: '+341', deltaPercent: '+87%', dir: 'up', varName: '' },
                    { label: 'Komentar', value: '31', deltaValue: '+21', deltaPercent: '+210%', dir: 'up', varName: '' },
                    { label: 'Bagikan', value: '313', deltaValue: '+115', deltaPercent: '+58.1%', dir: 'up', varName: '' },
                    { label: 'Jumlah Pengikut', value: '4.528', deltaValue: '+9', deltaPercent: '0%', dir: 'flat', varName: '' }
                ],
                w: 6
            };
            if (type === 'breakdown') newElem = {
                type, title: 'Wawasan Pengikut', category: 'Gender',
                items: [
                    { label: 'Laki-laki', percent: '45', varName: '' },
                    { label: 'Perempuan', percent: '55', varName: '' }
                ],
                w: 6
            };

            slidesData[sIdx].elements.push(newElem);
            renderForms();
        }

        function deleteElem(sIdx, eIdx) {
            slidesData[sIdx].elements.splice(eIdx, 1);
            renderForms();
        }

        function addSlide() {
            slidesData.push({
                id: Date.now(),
                footerLeft: `${BRAND_NAME} Creative Studio`,
                contentTag: '',
                elements: [
                    { type: 'header', tag: 'Section Tag', title: 'JUDUL SLIDE BARU', w: 6 },
                    { type: 'text', style: 'paragraf', tag: '', content: 'Ketikkan detail penjelasan slide di sini...', card: true, w: 6 }
                ]
            });
            renderForms();
        }
