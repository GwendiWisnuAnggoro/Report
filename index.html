<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MALEVIN STUDIO</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
<style>
    :root {
        --bg-obsidian: #0A0B0A;
        --surface-dark: #121312;
        --card-obsidian: #161816;
        --border-obsidian: #242624;
        --accent-gold: #C49A57;
        --accent-gold-glow: rgba(196, 154, 87, 0.25);
        --text-white: #FEFEFE;
        --text-muted: #808280;
        --positive: #4CAF7A;
        --negative: #E55353;
        --font-main: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    *, *::before, *::after { 
        box-sizing: border-box; 
        margin: 0; 
        padding: 0; 
    }

    html, body {
        width: 100%;
        max-width: 100%;
        overflow-x: hidden;
    }

    body { 
        background-color: var(--bg-obsidian); 
        color: var(--text-white); 
        font-family: var(--font-main); 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        padding-bottom: 60px;
        -webkit-font-smoothing: antialiased; 
    }

    /* TOPBAR SCROLLABLE */
    .topbar { 
        background-color: var(--surface-dark); 
        border-bottom: 1px solid var(--border-obsidian); 
        padding: 10px 20px; 
        display: flex; 
        align-items: center; 
        justify-content: space-between;
        z-index: 100; 
        overflow-x: auto;
        white-space: nowrap;
        gap: 15px; 
        width: 100%;
    }
    .topbar::-webkit-scrollbar { height: 4px; }
    .topbar::-webkit-scrollbar-thumb { background: var(--border-obsidian); border-radius: 2px; }

    .brand-title { font-size: 14px; font-weight: 800; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; flex-shrink: 0; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; flex-shrink: 0; }

    /* FIXED BOTTOM NAVIGATION BAR */
    .bottom-nav-bar {
        position: fixed;
        bottom: 0;
        left: 0;
        right: 0;
        height: 52px;
        background-color: var(--surface-dark);
        border-top: 1px solid var(--border-obsidian);
        display: flex;
        justify-content: center;
        align-items: center;
        gap: 12px;
        z-index: 10000;
        box-shadow: 0 -4px 20px rgba(0,0,0,0.6);
        padding: 0 16px;
    }

    .mode-tabs { display: flex; gap: 6px; background: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 6px; padding: 4px; }
    .mode-tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 8px 18px; font-size: 11px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab-btn.active { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; }
    .mode-tab-btn:not(.active):hover { color: var(--accent-gold); }

    .app-container { display: flex; flex: 1; min-height: 0; overflow: hidden; width: 100%; }

    /* EDITOR PANEL */
    .editor-panel { 
        width: 100%; 
        max-width: 720px; 
        margin: 0 auto; 
        background-color: var(--surface-dark); 
        display: flex; 
        flex-direction: column; 
        overflow-y: auto; 
        padding: 20px; 
        gap: 16px; 
        box-sizing: border-box;
    }
    .slide-accordion { background-color: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; width: 100%; box-sizing: border-box; }
    .slide-accordion-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-obsidian); padding-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .add-elem-btn { background-color: var(--surface-dark); color: var(--text-white); border: 1px solid var(--border-obsidian); font-size: 9px; padding: 8px 4px; border-radius: 4px; cursor: pointer; font-weight: 700; letter-spacing: 0.5px; text-align: center; }
    .add-elem-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
    .add-elem-btn.btn-ana { border-color: rgba(196, 154, 87, 0.4); color: var(--accent-gold); background: rgba(196, 154, 87, 0.05); }

    .element-box { background-color: var(--bg-obsidian); border: 1px solid var(--border-obsidian); border-left: 3px solid var(--accent-gold); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; width: 100%; box-sizing: border-box; }
    .element-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; }
    
    .form-group { display: flex; flex-direction: column; gap: 4px; width: 100%; }
    .form-group label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .form-control { background-color: var(--surface-dark); border: 1px solid var(--border-obsidian); color: var(--text-white); padding: 7px 9px; border-radius: 4px; font-size: 11px; font-family: inherit; width: 100%; box-sizing: border-box; }
    .form-control:focus { outline: none; border-color: var(--accent-gold); }
    textarea.form-control { resize: vertical; min-height: 50px; line-height: 1.4; }
    .two-col-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }

    .btn { background-color: var(--card-obsidian); color: var(--text-white); border: 1px solid var(--border-obsidian); padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
    .btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
    .btn-gold { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; border: none; font-weight: 800; }
    .btn-danger { background-color: transparent; color: #E55353; border: 1px solid rgba(229, 83, 83, 0.3); padding: 3px 8px; font-size: 9px; }

    /* GLOBAL VARIABLE WIDGET UI */
    .global-var-panel { background: var(--surface-dark); border: 1px solid var(--accent-gold); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px; margin-bottom: 16px; width: 100%; box-sizing: border-box; }
    .global-var-list { display: flex; flex-wrap: nowrap; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
    .global-var-list::-webkit-scrollbar { height: 4px; }
    .global-var-list::-webkit-scrollbar-thumb { background: var(--border-obsidian); border-radius: 2px; }

    .var-pill-btn { background: rgba(196, 154, 87, 0.1); border: 1px solid var(--accent-gold); color: var(--accent-gold); font-size: 9px; padding: 3px 8px; border-radius: 4px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; flex-shrink: 0; }
    .var-pill-btn:hover { background: var(--accent-gold); color: #0A0B0A; }

    /* FLOATING HIGHLIGHT VARIABLE & TREND TOOLTIP */
    #highlightPopup { position: absolute; display: none; background: var(--card-obsidian); border: 1px solid var(--accent-gold); padding: 4px; border-radius: 6px; z-index: 9999; box-shadow: 0 4px 15px rgba(0,0,0,0.6); flex-direction: row; gap: 4px; }
    .hl-pop-btn { background: var(--surface-dark); border: 1px solid var(--border-obsidian); color: var(--text-white); font-size: 9px; font-weight: 800; padding: 4px 8px; border-radius: 4px; cursor: pointer; white-space: nowrap; display: inline-flex; align-items: center; gap: 4px; }
    .hl-pop-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
    .hl-pop-btn.btn-up { color: var(--positive); border-color: rgba(76, 175, 122, 0.4); }
    .hl-pop-btn.btn-up:hover { background: rgba(76, 175, 122, 0.15); }
    .hl-pop-btn.btn-down { color: var(--negative); border-color: rgba(229, 83, 83, 0.4); }
    .hl-pop-btn.btn-down:hover { background: rgba(229, 83, 83, 0.15); }

    /* VARIABLE-AWARE INPUT (contenteditable) */
    .var-input { background-color: var(--surface-dark); border: 1px solid var(--border-obsidian); color: var(--text-white); padding: 7px 9px; border-radius: 4px; font-size: 11px; font-family: inherit; width: 100%; min-height: 32px; line-height: 1.4; white-space: pre-wrap; word-break: break-word; cursor: text; box-sizing: border-box; }
    .var-input:focus { outline: none; border-color: var(--accent-gold); }
    .var-input.var-multiline { min-height: 60px; }
    .var-input:empty::before { content: attr(data-placeholder); color: var(--text-muted); pointer-events: none; }

    .var-token { display: inline-block; background: #C49A57; color: #0A0B0A; font-weight: 800; font-size: 10px; padding: 1px 8px; border-radius: 10px; margin: 0 2px; cursor: default; user-select: none; }
    .var-token.var-token-missing { background: transparent; border: 1px dashed var(--negative); color: var(--negative); border-radius: 10px; padding: 1px 7px; }

    /* AUTOCOMPLETE LIST */
    #varAutocomplete { position: absolute; display: none; background: var(--card-obsidian); border: 1px solid var(--accent-gold); border-radius: 6px; z-index: 10000; min-width: 170px; max-width: 260px; max-height: 170px; overflow-y: auto; box-shadow: 0 10px 24px rgba(0,0,0,0.6); }
    .var-ac-item { padding: 6px 10px; font-size: 10px; color: var(--text-white); cursor: pointer; display: flex; justify-content: space-between; align-items: center; gap: 8px; white-space: nowrap; }
    .var-ac-item span.var-ac-type { font-size: 8px; color: var(--text-muted); text-transform: uppercase; }
    .var-ac-item:hover, .var-ac-item.active { background: rgba(196, 154, 87, 0.15); color: var(--accent-gold); }
    .var-ac-empty { padding: 8px 10px; font-size: 9px; color: var(--text-muted); }

    /* MODAL POPUP */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.72); display: none; align-items: center; justify-content: center; z-index: 10001; padding: 16px; }
    .modal-overlay.show { display: flex; }
    .modal-box { background: var(--card-obsidian); border: 1px solid var(--accent-gold); border-radius: 8px; padding: 18px; width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 12px; max-height: 90vh; overflow-y: auto; box-shadow: 0 20px 50px rgba(0,0,0,0.7); }
    .modal-title { font-size: 12px; font-weight: 800; color: var(--accent-gold); letter-spacing: 1.5px; text-transform: uppercase; }
    .type-badge { display: inline-block; font-size: 9px; font-weight: 800; padding: 4px 9px; border-radius: 10px; background: rgba(196, 154, 87, 0.15); color: var(--accent-gold); letter-spacing: 0.5px; text-transform: uppercase; width: fit-content; }
    .modal-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 4px; }
    .modal-img-preview { max-width: 100%; max-height: 100px; border-radius: 4px; display: block; margin: 0 auto; }

    /* LIVE PREVIEW CANVAS & DRAG AND DROP */
    .preview-panel { flex: 1; background-color: #050505; overflow-y: auto; overflow-x: hidden; padding: 30px 10px; display: flex; flex-direction: column; align-items: center; justify-content: flex-start; width: 100%; box-sizing: border-box; }
    .preview-container { width: 100%; max-width: 850px; display: flex; justify-content: center; align-items: flex-start; }
    #deck-container { display: flex; flex-direction: column; gap: 30px; width: 850px; margin: 0 auto; transition: transform 0.2s ease; transform-origin: top center; }

    .slide { width: 850px !important; min-height: 478px; height: auto; background-color: var(--bg-obsidian); border: 1px solid var(--border-obsidian); padding: 28px 36px 20px 36px; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; gap: 20px; flex-shrink: 0; overflow: hidden; }
    .slide::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #C49A57 0%, rgba(196,154,87,0.2) 100%); }
    
    .slide-body { flex: 1; display: flex; flex-wrap: wrap; flex-direction: row; align-content: flex-start; align-items: flex-start; gap: 16px; justify-content: flex-start; margin: 10px 0; position: relative; width: 100%; }

    .slide-body.drag-over-empty {
        outline: 1px dashed var(--accent-gold);
        outline-offset: 3px;
        background: rgba(196, 154, 87, 0.025);
        box-shadow: inset 0 0 24px rgba(196, 154, 87, 0.05);
    }
    
    .slide-body.has-cover { 
        justify-content: center; 
        align-items: center; 
        align-content: center; 
        height: 100%; 
        min-height: 380px; 
    }

    .cover-container {
        display: flex;
        flex-direction: column;
        justify-content: center;
        width: 100%;
        height: 100%;
        padding: 20px 0;
        box-sizing: border-box;
        transition: transform 0.2s ease;
    }

    .draggable-element { box-sizing: border-box; flex: 0 0 auto; min-width: 0; align-self: flex-start; }
    .slide-body .elem-width-half { flex-basis: calc(50% - 8px); }
    .slide-body .elem-width-third { flex-basis: calc(33.333% - 10.66px); }
    .slide-body .elem-width-twothird { flex-basis: calc(66.666% - 5.33px); }
    .slide-body .elem-width-full { flex-basis: 100%; }

    .slide-accordion { position: relative; transition: transform .15s ease, box-shadow .15s ease, border-color .15s ease; }
    .slide-accordion.slide-dragging { opacity: .55; transform: scale(.995); }

    .draggable-element { position: relative; user-select: none; transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; border: 1px dashed transparent; padding: 4px; border-radius: 4px; cursor: grab; }
    .draggable-element:active { cursor: grabbing; opacity: 0.75; }
    .draggable-element:hover { border-color: rgba(196, 154, 87, 0.4); background: rgba(196, 154, 87, 0.02); }

    .draggable-element.drag-over-top { border-top: 3px solid var(--accent-gold) !important; box-shadow: 0 -8px 15px var(--accent-gold-glow); }
    .draggable-element.drag-over-bottom { border-bottom: 3px solid var(--accent-gold) !important; box-shadow: 0 8px 15px var(--accent-gold-glow); }
    .draggable-element.drag-over-left { border-left: 3px solid var(--accent-gold) !important; box-shadow: -8px 0 15px var(--accent-gold-glow); }
    .draggable-element.drag-over-right { border-right: 3px solid var(--accent-gold) !important; box-shadow: 8px 0 15px var(--accent-gold-glow); }

    .elem-drag-bar { display: none; position: absolute; top: -12px; right: 6px; background: var(--card-obsidian); border: 1px solid var(--accent-gold); border-radius: 4px; padding: 2px 6px; font-size: 8px; font-weight: 800; color: var(--accent-gold); gap: 4px; z-index: 10; cursor: default; }
    .draggable-element:hover .elem-drag-bar { display: flex; }
    .grid-opt-btn { cursor: pointer; padding: 1px 4px; border-radius: 2px; }
    .grid-opt-btn:hover { background: var(--accent-gold); color: #0A0B0A; }

    .elem-brand-pill { background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%); color: #0A0B0A; font-size: 8px; font-weight: 800; padding: 3px 8px; letter-spacing: 1px; text-transform: uppercase; display: inline-block; }
    .elem-tag { font-size: 9px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; display: inline-block; }
    .elem-title { font-size: 20px; font-weight: 800; color: var(--text-white); text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; }
    
    .t-hero { font-size: 42px; font-weight: 800; color: var(--text-white); text-transform: uppercase; line-height: 1.05; }
    .t-judul { font-size: 26px; font-weight: 800; color: var(--text-white); text-transform: uppercase; line-height: 1.15; }
    .t-subjudul { font-size: 16px; font-weight: 700; color: var(--accent-gold); line-height: 1.3; }
    .t-paragraf { font-size: 11px; color: #C0C2C0; line-height: 1.5; white-space: pre-line; }

    .text-card-wrap { background-color: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); border-left: 2px solid var(--accent-gold); padding: 12px 14px; border-radius: 0 4px 4px 0; }

    .kpi-grid { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
    .kpi-card { flex: 1; min-width: 100px; background: rgba(22, 24, 22, 0.8); border: 1px solid var(--border-obsidian); padding: 10px; text-align: center; }
    .kpi-value { font-size: 20px; font-weight: 800; color: var(--accent-gold); letter-spacing: 1px; margin-top: 4px; }

    .col-wrap { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
    .col-item { flex: 1; min-width: 120px; }
    .col-card--accent { background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); border-left: 2px solid var(--accent-gold); padding: 10px 12px; }
    .col-card--plain { background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); padding: 10px 12px; }
    .col-card--minimal { border-bottom: 1px solid var(--border-obsidian); padding-bottom: 8px; }
    .col-card--numbered { position: relative; background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); padding: 10px 12px 10px 36px; }
    .col-num-badge { position: absolute; left: 8px; top: 10px; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #C49A57, #8A6831); color: #0A0B0A; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

    .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; width: 100%; }
    .social-card { background: rgba(22, 24, 22, 0.7); border: 1px solid var(--border-obsidian); border-radius: 4px; padding: 10px; }
    .social-card-val { font-size: 14px; font-weight: 800; color: var(--text-white); margin: 3px 0; word-break: break-all; }

    .breakdown-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #C0C2C0; padding: 4px 0; border-bottom: 1px dashed var(--border-obsidian); }
    .wawasan-box { background: rgba(196, 154, 87, 0.05); border: 1px solid var(--accent-gold); padding: 12px; font-size: 11px; color: #E0E0E0; display: flex; flex-direction: column; gap: 8px; }

    .var-badge { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 9px; padding: 2px 6px; border-radius: 12px; white-space: nowrap; cursor: pointer; user-select: none; }
    .var-up { color: var(--positive); background: rgba(76, 175, 122, 0.15); border: 1px solid rgba(76, 175, 122, 0.3); }
    .var-up:hover { background: rgba(76, 175, 122, 0.3); }
    .var-down { color: var(--negative); background: rgba(229, 83, 83, 0.15); border: 1px solid rgba(229, 83, 83, 0.3); }
    .var-down:hover { background: rgba(229, 83, 83, 0.3); }

    #badgeActionPopup { position: absolute; display: none; background: var(--card-obsidian); border: 1px solid var(--accent-gold); padding: 6px; border-radius: 6px; z-index: 10002; box-shadow: 0 10px 25px rgba(0,0,0,0.8); flex-direction: column; gap: 4px; }

    .compare-box { background: rgba(22, 24, 22, 0.8); border: 1px solid var(--border-obsidian); border-radius: 4px; padding: 12px; display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .compare-num { font-size: 20px; font-weight: 800; color: var(--text-white); }

    .img-preview-box { max-width: 100%; max-height: 250px; object-fit: contain; display: block; }
    .slide-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-obsidian); padding-top: 8px; font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: auto; width: 100%; }
    .slide-num { font-size: 11px; font-weight: 800; color: var(--accent-gold); }

    /* PERBAIKAN STYLES UNTUK GENERASI PDF PRESISI */
    body.exporting-pdf .elem-drag-bar,
    body.exporting-pdf #highlightPopup,
    body.exporting-pdf #badgeActionPopup,
    body.exporting-pdf #varAutocomplete,
    body.exporting-pdf .bottom-nav-bar,
    body.exporting-pdf .topbar {
        display: none !important;
    }

    body.exporting-pdf .draggable-element {
        border: none !important;
        background: transparent !important;
        box-shadow: none !important;
        padding: 0 !important;
    }

    body.exporting-pdf .slide {
        box-shadow: none !important;
        transform: none !important;
        margin: 0 !important;
    }

    /* PERBAIKAN 3: FIX OVERFLOW / GAP DI HP SISI KANAN MODE EDIT */
    @media (max-width: 768px) {
        html, body {
            width: 100% !important;
            max-width: 100% !important;
            overflow-x: hidden !important;
            height: auto !important;
        }
        .app-container { 
            width: 100% !important;
            max-width: 100% !important;
            height: auto !important; 
            overflow-x: hidden !important; 
        }
        .editor-panel { 
            width: 100% !important;
            max-width: 100% !important; 
            padding: 12px !important; 
            padding-bottom: 120px !important; 
            overflow-x: hidden !important;
            box-sizing: border-box !important;
        }
        .slide-accordion, .global-var-panel {
            width: 100% !important;
            max-width: 100% !important;
            box-sizing: border-box !important;
        }
        .btn-grid { grid-template-columns: repeat(2, 1fr); }
        .two-col-form { grid-template-columns: 1fr !important; }
        .preview-panel { padding: 15px 5px !important; width: 100% !important; }
    }
</style>
</head>
<body>

    <!-- TOOLTIP POPUP PADA BLOCK TEKS EDITOR -->
    <div id="highlightPopup">
        <button class="hl-pop-btn" onclick="createVariableFromHighlight()">+ Variabel</button>
        <button class="hl-pop-btn btn-up" onclick="applyHighlightTrend('up')">▲ Kenaikan</button>
        <button class="hl-pop-btn btn-down" onclick="applyHighlightTrend('down')">▼ Penurunan</button>
    </div>

    <!-- POPUP KLIK BADGE TREND PADA PREVIEW CANVAS -->
    <div id="badgeActionPopup">
        <span style="font-size:8px; font-weight:800; color:var(--accent-gold); text-transform:uppercase; margin-bottom:2px;">Opsi Highlight</span>

    <div class="modal-overlay" id="varModalOverlay">

                    <button class="btn" style="padding: 7px 10px; flex-shrink:0;" title="Pilih Gambar dari Perangkat" onclick="document.getElementById('varModalImgInput').click()">
                        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"></path><circle cx="12" cy="13" r="4"></circle></svg>

    <div class="app-container">
        <div class="editor-panel" id="editorPanel">
            <!-- GLOBAL VARIABLE MANAGER WIDGET -->
            <div class="global-var-panel">
                <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span style="font-size:11px; font-weight:800; color:var(--accent-gold);">MANAJEMEN VARIABEL KUSTOM</span>

                    <strong>Petunjuk:</strong> Ketik <code>{</code> atau <code>{{</code> untuk autocomplete. Blok teks untuk opsi Variabel / Highlight.

            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; font-weight:800; color:var(--accent-gold); letter-spacing:1px;">SLIDES CONTROL</span>
                <button class="btn btn-gold" onclick="addSlide()">+ Slide Baru</button>

    <!-- BOTTOM FIXED NAVIGATION BAR -->
    <div class="bottom-nav-bar">
        <div class="mode-tabs">
            <button class="mode-tab-btn active" id="tabEditBtn" onclick="setMode('edit')">Form Editor</button>
            <button class="mode-tab-btn" id="tabPreviewBtn" onclick="setMode('preview')">Canvas Preview</button>
        </div>
    </div>

    <script>
        const STORAGE_KEY_SLIDES = 'deck_studio_slides_v3';
        const STORAGE_KEY_VARS = 'deck_studio_vars_v3';

        const ELEM_LABELS = { 
            cover: 'COVER', header: 'HEADER', text: 'TEKS', columns: 'KOLOM DOKUMEN', table: 'TABEL', 
            kpi: 'KPI METRIK', chart: 'GRAFIK ANALISIS', image: 'GAMBAR/LOGO', comparison: 'PERBANDINGAN (NAIK/TURUN / BOOLEAN)', 
            social: 'STATISTIK SOSIAL & LINK SOSMED', breakdown: 'WAWASAN PENONTON', wawasan: 'CATATAN' 
        };

        let customVariables = [];
        let slidesData = [
            {
                id: 1,
                footerLeft: 'MALEVIN',
                elements: [
                    { type: 'cover', width: 'full', tag: 'PRESENTASI', title: 'Judul Cover Utama', subtitle: 'Sub-judul Cover Malevin Studio', align: 'left', scale: 1 }
                ]
            }
        ];

        let chartInstances = [];

        /* PERBAIKAN 1: MENGUBAH SEMUA WARNA PERSENTASE / ANGKA GRAFIK MENJADI PUTIH (#FEFEFE) */
        const valueLabelPlugin = {
            id: 'valueLabelPlugin',
            afterDatasetsDraw(chart) {
                const opts = chart.options.plugins && chart.options.plugins.valueLabelPlugin;
                if (!opts || !opts.enabled) return;
                const { ctx } = chart;
                const suffix = opts.suffix || '';

                chart.data.datasets.forEach((dataset, dsIndex) => {
                    const meta = chart.getDatasetMeta(dsIndex);
                    if (meta.hidden) return;

                    meta.data.forEach((element, index) => {
                        const rawValue = dataset.data[index];
                        if (rawValue === null || rawValue === undefined) return;
                        const label = `${rawValue}${suffix}`;

                        ctx.save();
                        ctx.font = '700 11px Helvetica Neue, Arial, sans-serif';
                        ctx.textAlign = 'center';
                        ctx.textBaseline = 'middle';

                        let x, y;
                        if (chart.config.type === 'pie' || chart.config.type === 'doughnut') {
                            const midAngle = (element.startAngle + element.endAngle) / 2;
                            const midRadius = (element.innerRadius + element.outerRadius) / 2;
                            x = element.x + Math.cos(midAngle) * midRadius;
                            y = element.y + Math.sin(midAngle) * midRadius;
                            ctx.fillStyle = '#FEFEFE';
                        } else if (chart.config.type === 'line') {
                            x = element.x;
                            y = element.y - 12;
                            ctx.fillStyle = '#FEFEFE';
                        } else {
                            /* bar: taruh di tengah-tengah tinggi bar biar gampang kebaca */
                            x = element.x;
                            y = (element.y + element.base) / 2;
                            ctx.fillStyle = '#0A0B0A';
                        }
                        ctx.fillText(label, x, y);
                        ctx.restore();
                    });
                });
            }
        };
        Chart.register(valueLabelPlugin);

        let draggedElemInfo = null;
        let dragHoverInfo = null;
        let activeBadgeTarget = null;

        const VAR_TYPE_LABELS = { text: 'Teks', number: 'Angka', calculation: 'Rumus / Kalkulasi', image: 'Gambar' };

        function sanitizeVarName(raw) { return (raw || '').trim().replace(/[^a-zA-Z0-9_]/g, ''); }
        function escapeHtml(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }

        function setMode(mode) {
            const editorPanel = document.getElementById('editorPanel');
            const previewPanel = document.getElementById('previewPanel');
            const tabEditBtn = document.getElementById('tabEditBtn');
            const tabPreviewBtn = document.getElementById('tabPreviewBtn');

            if (mode === 'edit') {
                editorPanel.style.display = 'flex';
                previewPanel.style.display = 'none';
                tabEditBtn.classList.add('active');
                tabPreviewBtn.classList.remove('active');
            } else {
                editorPanel.style.display = 'none';
                previewPanel.style.display = 'flex';
                tabEditBtn.classList.remove('active');
                tabPreviewBtn.classList.add('active');
                autoScaleDeckContainer();
            }
        }

        function autoScaleDeckContainer() {
            const container = document.getElementById('deck-container');
            const panel = document.getElementById('previewPanel');
            if (!container || !panel) return;

            const panelWidth = panel.clientWidth - 20;
            const targetWidth = 850;

            if (panelWidth < targetWidth && panelWidth > 0) {
                const scale = panelWidth / targetWidth;
                container.style.transform = `scale(${scale})`;
                container.style.marginBottom = `-${(1 - scale) * container.offsetHeight}px`;
            } else {
                container.style.transform = 'scale(1)';
                container.style.marginBottom = '0px';
            }
        }

        window.addEventListener('resize', autoScaleDeckContainer);

        function saveToLocalStorage() {
            try {
                localStorage.setItem(STORAGE_KEY_SLIDES, JSON.stringify(slidesData));
                localStorage.setItem(STORAGE_KEY_VARS, JSON.stringify(customVariables));
            } catch (e) {
                console.warn('LocalStorage Save Error:', e);
            }
        }

        function loadFromLocalStorage() {
            try {
                const savedSlides = localStorage.getItem(STORAGE_KEY_SLIDES);
                const savedVars = localStorage.getItem(STORAGE_KEY_VARS);
                if (savedSlides) slidesData = JSON.parse(savedSlides);
                if (savedVars) customVariables = JSON.parse(savedVars);
            } catch (e) {
                console.warn('LocalStorage Load Error:', e);
            }
        }

        let varModalEditIndex = null;
        let varModalImageData = null;
        let varModalPendingInsert = null;

        function detectVarType(value) {
            if (varModalImageData) return 'image';
            const v = (value || '').trim();
            if (v === '') return 'text';
            if (/^-?\d+(\.\d+)?$/.test(v)) return 'number';
            if (/^[\d\s+\-*/().]+$/.test(v) && /[+\-*/]/.test(v) && /\d/.test(v)) return 'calculation';
            return 'text';
        }

        function updateVarModalTypeBadge() {
            const value = document.getElementById('varModalValue').value;
            const type = detectVarType(value);
            document.getElementById('varModalTypeBadge').innerText = 'Tipe Terdeteksi: ' + (VAR_TYPE_LABELS[type] || type);
        }

        function openVarModal(editIndex, prefillName, prefillValue) {
            varModalEditIndex = (editIndex === undefined) ? null : editIndex;
            varModalImageData = null;
            const nameEl = document.getElementById('varModalName');
            const valueEl = document.getElementById('varModalValue');

            document.getElementById('varModalImgPreviewBox').style.display = 'none';

            if (varModalEditIndex !== null) {
                const v = customVariables[varModalEditIndex];
                document.getElementById('varModalTitle').innerText = 'Edit Variabel';
                nameEl.value = v.name; nameEl.disabled = true;
                if (v.type === 'image') {
                    varModalImageData = v.value;
                    document.getElementById('varModalImgPreview').src = v.value;
                    document.getElementById('varModalImgPreviewBox').style.display = 'block';
                    valueEl.value = '';
                } else {
                    valueEl.value = v.value;
                }
            } else {
                document.getElementById('varModalTitle').innerText = 'Variabel Baru';
                nameEl.disabled = false;
                nameEl.value = prefillName || '';
                valueEl.value = prefillValue || '';
            }
            updateVarModalTypeBadge();
            document.getElementById('varModalOverlay').classList.add('show');
            setTimeout(() => nameEl.focus(), 50);
        }

        function closeVarModal() {
            document.getElementById('varModalOverlay').classList.remove('show');
            varModalPendingInsert = null;
        }

        function handleVarModalImgUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function (e) {
                varModalImageData = e.target.result;
                document.getElementById('varModalImgPreview').src = varModalImageData;
                document.getElementById('varModalImgPreviewBox').style.display = 'block';
                document.getElementById('varModalValue').value = '';
                updateVarModalTypeBadge();
            };
            reader.readAsDataURL(file);
            event.target.value = '';
        }

        function clearVarModalImage() {
            varModalImageData = null;
            document.getElementById('varModalImgPreviewBox').style.display = 'none';
            updateVarModalTypeBadge();
        }

        function saveVarModal() {
            const nameEl = document.getElementById('varModalName');
            const name = sanitizeVarName(nameEl.value);
            if (!name) { alert('Nama variabel tidak valid. Gunakan huruf, angka, atau underscore.'); return; }

            const nameLower = name.toLowerCase();
            const isDuplicate = customVariables.some((v, idx) => 
                idx !== varModalEditIndex && v.name.toLowerCase() === nameLower
            );

            if (isDuplicate) {
                alert('Nama variabel sudah ada! Silakan gunakan nama lain.');
                return;
            }

            let type, value;
            if (varModalImageData) { type = 'image'; value = varModalImageData; }
            else { value = document.getElementById('varModalValue').value; type = detectVarType(value); }

            if (varModalEditIndex === null) {
                customVariables.push({ name, type, value });
            } else {
                customVariables[varModalEditIndex].type = type;
                customVariables[varModalEditIndex].value = value;
            }

            saveToLocalStorage();
            const pending = varModalPendingInsert;
            closeVarModal();
            renderCustomVarsUI();

            if (pending && pending.el) {
                insertVarTokenIntoField(pending.el, name, pending.range || null);
            } else {
                renderForms();
            }
        }

        function copyVarToClipboard(name) {
            navigator.clipboard.writeText(`{{${name}}}`);
        }

        function deleteCustomVar(index) {
            customVariables.splice(index, 1);
            saveToLocalStorage();
            renderCustomVarsUI();
            renderForms();
        }

        function renderCustomVarsUI() {
            const container = document.getElementById('globalVarListUI');
            if (!container) return;
            if (customVariables.length === 0) {
                container.innerHTML = '<div style="font-size:9px; color:var(--text-muted);">Belum ada variabel kustom.</div>';
                return;
            }
            container.innerHTML = customVariables.map((v, idx) => `
                <div class="var-pill-btn" title="Klik nama untuk copy {{${v.name}}}">
                   <span onclick="copyVarToClipboard('${v.name}')">${v.type === 'image' ? '🖼️ ' : ''}{{${v.name}}}</span>
                   <span style="cursor:pointer;" title="Edit" onclick="openVarModal(${idx})">✎</span>
                   <span style="color:#E55353; cursor:pointer;" title="Hapus" onclick="deleteCustomVar(${idx})">✕</span>
                </div>
            `).join('');
        }

        function varTextToHtml(str) {
            if (!str) return '';
            const escaped = escapeHtml(str);
            return escaped.replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (m, name) => {
                const exists = customVariables.some(v => v.name.toLowerCase() === name.toLowerCase());
                const cls = exists ? 'var-token' : 'var-token var-token-missing';
                return `<span class="${cls}" contenteditable="false" data-var="${name}">${exists ? name : name + '?'}</span>`;
            }).replace(/\r\n|\n/g, '<br>');
        }

        function serializeVarInput(el) {
            let out = '';
            el.childNodes.forEach(node => {
                if (node.nodeType === Node.TEXT_NODE) {
                    out += node.textContent;
                } else if (node.nodeType === Node.ELEMENT_NODE) {
                    if (node.classList && node.classList.contains('var-token')) {
                        out += `{{${node.getAttribute('data-var')}}}`;
                    } else if (node.tagName === 'BR') {
                        out += '\n';
                    } else if (node.tagName === 'DIV' || node.tagName === 'P') {
                        out += '\n' + serializeVarInput(node);
                    } else {
                        out += node.textContent;
                    }
                }
            });
            return out;
        }

        function varInputHTML(vtype, sIdx, eIdxOrKeyPath, key, value, placeholder, multiline) {
            let dataAttrs;
            if (vtype === 'elem') dataAttrs = `data-vtype="elem" data-sidx="${sIdx}" data-eidx="${eIdxOrKeyPath}" data-key="${key}"`;
            else if (vtype === 'slide') dataAttrs = `data-vtype="slide" data-sidx="${sIdx}" data-key="${key}"`;
            else dataAttrs = `data-vtype="${vtype}" data-sidx="${sIdx}" data-eidx="${eIdxOrKeyPath}" data-mkey="${key}"`;
            const cls = multiline ? 'form-control var-input var-multiline' : 'form-control var-input';
            return `<div class="${cls}" contenteditable="true" ${dataAttrs} data-placeholder="${escapeHtml(placeholder || '')}">${varTextToHtml(value || '')}</div>`;
        }

        function applyVarInputChange(el) {
            const vtype = el.getAttribute('data-vtype');
            const raw = serializeVarInput(el);
            const sIdx = parseInt(el.getAttribute('data-sidx'), 10);
            if (vtype === 'elem') {
                const eIdx = parseInt(el.getAttribute('data-eidx'), 10);
                const key = el.getAttribute('data-key');
                slidesData[sIdx].elements[eIdx][key] = raw;
            } else if (vtype === 'slide') {
                const key = el.getAttribute('data-key');
                slidesData[sIdx][key] = raw;
            } else if (vtype === 'metric' || vtype === 'social' || vtype === 'col') {
                const eIdx = parseInt(el.getAttribute('data-eidx'), 10);
                const [arrIdx, field] = el.getAttribute('data-mkey').split('.');
                const arrKey = vtype === 'metric' ? 'metrics' : (vtype === 'social' ? 'socialLinks' : 'cols');
                slidesData[sIdx].elements[eIdx][arrKey][parseInt(arrIdx, 10)][field] = raw;
            }
            saveToLocalStorage();
            renderPreview();
        }

        function convertTypedVarsToCapsules(el) {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0 || !el.contains(sel.anchorNode)) return;
            const node = sel.anchorNode;
            if (node.nodeType !== Node.TEXT_NODE) return;

            const text = node.textContent;
            const match = /\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/.exec(text);
            if (match) {
                const fullMatch = match[0];
                const varName = match[1];
                const matchIdx = match.index;

                const range = document.createRange();
                range.setStart(node, matchIdx);
                range.setEnd(node, matchIdx + fullMatch.length);

                const matchedVar = customVariables.find(v => v.name.toLowerCase() === varName.toLowerCase());
                const displayName = matchedVar ? matchedVar.name : varName;

                insertVarTokenIntoField(el, displayName, range);
            }
        }

        let activeVarTarget = null;

        function initSelectionListeners() {
            document.addEventListener('selectionchange', () => {
                clearTimeout(window.selectionTimeout);
                window.selectionTimeout = setTimeout(handleFieldSelectionEvent, 100);
            });

            document.addEventListener('touchend', () => {
                setTimeout(handleFieldSelectionEvent, 50);
            });

            document.addEventListener('pointerdown', (e) => {
                const popup = document.getElementById('highlightPopup');
                const isInput = e.target.classList && e.target.classList.contains('var-input');
                const isInsidePopup = popup && popup.contains(e.target);

                if (!isInput && !isInsidePopup) {
                    popup.style.display = 'none';
                }
            });
        }

        function handleFieldSelectionEvent() {
            const popup = document.getElementById('highlightPopup');
            const el = document.activeElement;
            
            const isVarInput = el && el.classList && el.classList.contains('var-input');
            if (!isVarInput) { 
                if (popup) popup.style.display = 'none'; 
                return; 
            }

            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0 || sel.isCollapsed) {
                if (popup) popup.style.display = 'none'; 
                return;
            }

            const range = sel.getRangeAt(0);
            const isStartInside = el.contains(range.startContainer);
            const isEndInside = el.contains(range.endContainer);

            if (!isStartInside || !isEndInside) {
                if (popup) popup.style.display = 'none'; 
                return;
            }

            const text = sel.toString();
            if (!text.trim()) { 
                if (popup) popup.style.display = 'none'; 
                return; 
            }

            activeVarTarget = { el, range: range.cloneRange(), text };
            
            const rect = range.getBoundingClientRect();
            const popupHeight = popup.offsetHeight || 38;
            const popupWidth = popup.offsetWidth || 120;
            const margin = 12;

            let top = rect.bottom + window.scrollY + margin; 
            let left = rect.left + window.scrollX;

            const spaceBelow = window.innerHeight - rect.bottom;
            const spaceAbove = rect.top;

            if (spaceBelow < popupHeight + margin && spaceAbove > spaceBelow) {
                top = rect.top + window.scrollY - popupHeight - 60; 
            }

            const maxLeft = window.innerWidth - popupWidth - margin;
            left = Math.max(margin, Math.min(left, maxLeft));

            popup.style.left = `${left}px`;
            popup.style.top = `${top}px`;
            popup.style.display = 'flex';
        }

        document.addEventListener('DOMContentLoaded', () => {
            loadFromLocalStorage();
            initSelectionListeners();
            renderForms();
        });

        document.getElementById('editorPanel').addEventListener('mouseup', handleFieldSelectionEvent);
        document.getElementById('editorPanel').addEventListener('keyup', handleFieldSelectionEvent);

        function createVariableFromHighlight() {
            if (!activeVarTarget) return;
            const { el, range, text } = activeVarTarget;
            document.getElementById('highlightPopup').style.display = 'none';
            varModalPendingInsert = { el, range };
            openVarModal(null, sanitizeVarName(text) || `var${Date.now().toString().slice(-4)}`, text);
        }

        function applyHighlightTrend(type) {
            if (!activeVarTarget) return;
            const { el, range, text } = activeVarTarget;
            document.getElementById('highlightPopup').style.display = 'none';

            el.focus();
            const sel = window.getSelection();
            sel.removeAllRanges();
            sel.addRange(range);

            const tag = `[${type}:${text}]`;
            document.execCommand('insertText', false, tag);
            applyVarInputChange(el);
        }

        function insertVarTokenIntoField(el, name, range) {
            el.focus();
            const sel = window.getSelection();
            sel.removeAllRanges();
            if (range) {
                try { sel.addRange(range); } catch (err) {}
            }
            if (sel.rangeCount === 0 || !el.contains(sel.anchorNode)) {
                const r = document.createRange(); r.selectNodeContents(el); r.collapse(false);
                sel.removeAllRanges(); sel.addRange(r);
            }
            const r2 = sel.getRangeAt(0);
            r2.deleteContents();

            const pill = document.createElement('span');
            pill.className = 'var-token'; pill.setAttribute('contenteditable', 'false'); pill.setAttribute('data-var', name);
            pill.textContent = name;
            r2.insertNode(pill);

            const space = document.createTextNode('\u00A0');
            pill.after(space);

            const r3 = document.createRange(); r3.setStartAfter(space); r3.collapse(true);
            sel.removeAllRanges(); sel.addRange(r3);

            applyVarInputChange(el);
        }

        let acActiveEl = null, acItems = [], acIndex = -1;

        function closeAutocomplete() {
            document.getElementById('varAutocomplete').style.display = 'none';
            acActiveEl = null; acItems = []; acIndex = -1;
        }

        function getAutocompleteContext(el) {
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0 || !el.contains(sel.anchorNode)) return null;
            const node = sel.anchorNode;
            if (node.nodeType !== Node.TEXT_NODE) return null;
            const textBefore = node.textContent.substring(0, sel.anchorOffset);
            const m = textBefore.match(/\{\{?([a-zA-Z0-9_]*)$/);
            if (!m) return null;
            return { node, query: m[1], matchStart: sel.anchorOffset - m[0].length, matchEnd: sel.anchorOffset };
        }

        function renderAutocomplete(el) {
            const ctx = getAutocompleteContext(el);
            if (!ctx) { closeAutocomplete(); return; }
            const q = ctx.query.toLowerCase();
            acItems = customVariables.filter(v => v.name.toLowerCase().includes(q));
            acActiveEl = el; acIndex = acItems.length ? 0 : -1;

            const box = document.getElementById('varAutocomplete');
            if (customVariables.length === 0) {
                box.innerHTML = '<div class="var-ac-empty">Belum ada variabel kustom.</div>';
            } else if (acItems.length === 0) {
                box.innerHTML = '<div class="var-ac-empty">Tidak ada variabel cocok</div>';
            } else {
                box.innerHTML = acItems.map((v, i) => `<div class="var-ac-item${i === acIndex ? ' active' : ''}" data-i="${i}" onmousedown="event.preventDefault(); pickAutocomplete(${i});">
                    <span>${v.type === 'image' ? '🖼️ ' : ''}${escapeHtml(v.name)}</span><span class="var-ac-type">${VAR_TYPE_LABELS[v.type] || v.type}</span>
                </div>`).join('');
            }

            const sel = window.getSelection();
            if (sel && sel.rangeCount > 0) {
                const rect = sel.getRangeAt(0).getBoundingClientRect();
                box.style.left = `${rect.left + window.scrollX}px`;
                box.style.top = `${rect.bottom + window.scrollY + 4}px`;
                box.style.display = 'block';
            }
        }

        function pickAutocomplete(i) {
            if (!acActiveEl || !acItems[i]) return;
            const el = acActiveEl;
            const ctx = getAutocompleteContext(el);
            closeAutocomplete();
            if (!ctx) return;

            const range = document.createRange();
            range.setStart(ctx.node, ctx.matchStart);
            range.setEnd(ctx.node, ctx.matchEnd);

            insertVarTokenIntoField(el, acItems[i].name, range);
        }

        document.getElementById('editorPanel').addEventListener('input', function (e) {
            const el = e.target;
            if (!el.classList || !el.classList.contains('var-input')) return;
            applyVarInputChange(el);
            convertTypedVarsToCapsules(el);
            renderAutocomplete(el);
        });

        document.getElementById('editorPanel').addEventListener('keydown', function (e) {
            const el = e.target;
            if (!el.classList || !el.classList.contains('var-input')) return;
            const box = document.getElementById('varAutocomplete');
            const acOpen = box.style.display === 'block';
            if (acOpen) {
                if (e.key === 'ArrowDown') { 
                    e.preventDefault(); 
                    acIndex = Math.min(acIndex + 1, acItems.length - 1); 
                    refreshAcHighlight(); 
                    return; 
                }
                if (e.key === 'ArrowUp') { 
                    e.preventDefault(); 
                    acIndex = Math.max(acIndex - 1, 0); 
                    refreshAcHighlight(); 
                    return; 
                }
                if (e.key === 'Enter' || e.key === 'Tab') { 
                    if (acIndex >= 0 && acItems[acIndex]) { 
                        e.preventDefault(); 
                        pickAutocomplete(acIndex); 
                        return; 
                    } 
                }
                if (e.key === 'Escape') { closeAutocomplete(); return; }
            }
            if (e.key === 'Enter' && !el.classList.contains('var-multiline')) { e.preventDefault(); }
        });

        function refreshAcHighlight() {
            document.querySelectorAll('.var-ac-item').forEach((it, i) => it.classList.toggle('active', i === acIndex));
        }

        document.addEventListener('mousedown', function (e) {
            const box = document.getElementById('varAutocomplete');
            if (box.style.display === 'block' && !box.contains(e.target)) closeAutocomplete();
            const badgePop = document.getElementById('badgeActionPopup');
            if (badgePop.style.display === 'flex' && !badgePop.contains(e.target)) badgePop.style.display = 'none';
        });

        function computeGlobalVariables() {
            const vars = {};
            customVariables.forEach(v => {
                if (v.type === 'calculation') {
                    try { vars[v.name] = { type: 'text', value: eval(v.value) }; }
                    catch (e) { vars[v.name] = { type: 'text', value: '[Error Calc]' }; }
                } else if (v.type === 'image') {
                    vars[v.name] = { type: 'image', value: v.value };
                } else {
                    vars[v.name] = { type: 'text', value: v.value };
                }
            });
            return vars;
        }

        function renderVarsInText(str, vars, sIdx, eIdx, fieldKey, subType, subIdx) {
            if (!str) return '';
            let parsed = String(str).replace(/\{\{\s*([a-zA-Z0-9_]+)\s*\}\}/g, (match, varKey) => {
                const keyLower = varKey.toLowerCase();
                const matchedKey = Object.keys(vars).find(k => k.toLowerCase() === keyLower);
                if (!matchedKey) return `<span style="color:var(--negative); font-size:9px; border:1px dashed var(--negative); padding:0 3px;">{{${varKey}}}?</span>`;
                const item = vars[matchedKey];
                if (item.type === 'image') return `<img src="${item.value}" style="max-height:30px; vertical-align:middle; display:inline-block;">`;
                return item.value;
            });

            parsed = parsed.replace(/\[(up|down):([^\]]+)\]/g, (match, dir, val) => {
                const cls = dir === 'up' ? 'var-up' : 'var-down';
                const arrow = dir === 'up' ? '▲' : '▼';
                const metaAttrs = `data-sidx="${sIdx}" data-eidx="${eIdx}" data-field="${fieldKey}" data-dir="${dir}" data-val="${escapeHtml(val)}" ${subType ? `data-subtype="${subType}" data-subidx="${subIdx}"` : ''}`;
                return `<span class="var-badge ${cls}" onclick="openTrendBadgeUI(event, this)" ${metaAttrs}>${arrow} ${val}</span>`;
            });

            return parsed;
        }

            activeBadgeTarget = {

                field: el.getAttribute('data-field'),
                dir: el.getAttribute('data-dir'),
                val: el.getAttribute('data-val'),
                subType: el.getAttribute('data-subtype'),
                subIdx: el.getAttribute('data-subidx')
            };

            const rect = el.getBoundingClientRect();
            const pop = document.getElementById('badgeActionPopup');
            pop.style.left = `${rect.left + window.scrollX}px`;
            pop.style.top = `${rect.bottom + window.scrollY + 6}px`;
            pop.style.display = 'flex';
        }

            const { sIdx, eIdx, field, subType, subIdx } = target;
            if (subType) {
                const arrKey = subType === 'metric' ? 'metrics' : (subType === 'social' ? 'socialLinks' : 'cols');
                return slidesData[sIdx].elements[eIdx][arrKey][parseInt(subIdx, 10)][field] || '';
            } else {
                return slidesData[sIdx].elements[eIdx][field] || '';
            }
        }

        function setTargetStringValue(target, newStr) {
            const { sIdx, eIdx, field, subType, subIdx } = target;
            if (subType) {
                const arrKey = subType === 'metric' ? 'metrics' : (subType === 'social' ? 'socialLinks' : 'cols');
                slidesData[sIdx].elements[eIdx][arrKey][parseInt(subIdx, 10)][field] = newStr;
            } else {
                slidesData[sIdx].elements[eIdx][field] = newStr;
            }
            saveToLocalStorage();
            renderForms();
        }

        function switchTrendBadgeType() {
            if (!activeBadgeTarget) return;
            document.getElementById('badgeActionPopup').style.display = 'none';
            const { dir, val } = activeBadgeTarget;
            const oldPattern = `[${dir}:${val}]`;
            const newDir = dir === 'up' ? 'down' : 'up';
            const newPattern = `[${newDir}:${val}]`;

            let text = getTargetStringValue(activeBadgeTarget);
            text = text.replace(oldPattern, newPattern);
            setTargetStringValue(activeBadgeTarget, text);
        }

        function clearDragIndicators() {
            document.querySelectorAll('.draggable-element').forEach(el => {
                el.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-left', 'drag-over-right');
            });
            document.querySelectorAll('.slide-body').forEach(el => el.classList.remove('drag-over-empty'));
        }

        function onElemDragStart(e, sIdx, eIdx) {
            draggedElemInfo = { kind: 'element', sIdx, eIdx };
            dragHoverInfo = null;
            try {
                e.dataTransfer.effectAllowed = 'move';
                e.dataTransfer.setData('text/plain', JSON.stringify({ sIdx, eIdx }));
            } catch (_) {}
            e.currentTarget.style.opacity = '0.5';
        }

        function onElemDragEnd(e) {
            e.currentTarget.style.opacity = '1';
            clearDragIndicators();
            draggedElemInfo = null;
        }

        function getDropSide(e, rect) {
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            const w = Math.max(1, rect.width);
            const h = Math.max(1, rect.height);
            const horizontalZone = Math.max(55, Math.min(w * 0.38, 120));
            if (x <= horizontalZone) return 'left';
            if (x >= w - horizontalZone) return 'right';
            const verticalZone = Math.max(35, Math.min(h * 0.32, 90));
            if (y <= verticalZone) return 'top';
            if (y >= h - verticalZone) return 'bottom';
            return x < w / 2 ? 'left' : 'right';
        }

        function onElemDragOver(e) {
            e.preventDefault();
            e.stopPropagation();
            if (!draggedElemInfo || draggedElemInfo.kind === 'slide') return;
            try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}

            const targetEl = e.currentTarget;
            const targetSIdx = Number(targetEl.closest('.slide-body')?.dataset.slideIndex);
            const targetEIdx = Number(targetEl.dataset.elemIndex);
            const rect = targetEl.getBoundingClientRect();
            const side = getDropSide(e, rect);

            dragHoverInfo = { sIdx: targetSIdx, eIdx: targetEIdx, side };
            targetEl.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-left', 'drag-over-right');
            targetEl.classList.add('drag-over-' + side);
        }

        function onElemDragLeave(e) {
            if (!e.currentTarget.contains(e.relatedTarget)) {
                e.currentTarget.classList.remove('drag-over-top', 'drag-over-bottom', 'drag-over-left', 'drag-over-right');
            }
        }

        function onSlideBodyDragOver(e) {
            if (!draggedElemInfo) return;
            if (e.target.closest('.draggable-element')) return;

            e.preventDefault();
            try { e.dataTransfer.dropEffect = 'move'; } catch (_) {}
            e.currentTarget.classList.add('drag-over-empty');
        }

        function onSlideBodyDragLeave(e) {
            if (!e.currentTarget.contains(e.relatedTarget)) {
                e.currentTarget.classList.remove('drag-over-empty');
            }
        }

        function getElementIndexFromPoint(slideBody, clientX, clientY, excludeIndex) {
            const items = [...slideBody.querySelectorAll(':scope > .draggable-element')]
                .filter(el => !el.classList.contains('drag-placeholder'));

            let best = { index: -1, before: false, distance: Infinity };

            items.forEach((el, domIndex) => {
                const dataIndex = Number(el.dataset.elemIndex);
                if (dataIndex === excludeIndex) return;

                const r = el.getBoundingClientRect();
                const cx = r.left + r.width / 2;
                const cy = r.top + r.height / 2;
                const d = Math.hypot(clientX - cx, clientY - cy);
                if (d < best.distance) {
                    best = {
                        index: dataIndex,
                        before: clientX < cx || (Math.abs(clientX - cx) < r.width * 0.25 && clientY < cy),
                        distance: d
                    };
                }
            });
            return best;
        }

        function setAdaptiveSideWidths(elements, movedIndex, targetIndex, side) {
            const moved = elements[movedIndex];
            const target = elements[targetIndex];
            if (!moved || !target) return;

            const targetWidth = target.width || 'full';
            if (targetWidth === 'third') {
                moved.width = 'third';
            } else if (targetWidth === 'twothird') {
                moved.width = 'third';
                target.width = 'twothird';
            } else {
                moved.width = 'half';
                target.width = 'half';
            }
        }

        function onSlideBodyDrop(e, targetSIdx) {
            if (!draggedElemInfo || draggedElemInfo.sIdx !== targetSIdx) return;
            if (e.target.closest('.draggable-element')) return;

            e.preventDefault();
            e.stopPropagation();

            const slideBody = e.currentTarget;
            slideBody.classList.remove('drag-over-empty');

            const srcSIdx = draggedElemInfo.sIdx;
            const srcEIdx = draggedElemInfo.eIdx;
            const elements = slidesData[targetSIdx].elements;
            if (!elements[srcEIdx]) return;

            const point = getElementIndexFromPoint(slideBody, e.clientX, e.clientY, srcEIdx);
            const [moved] = elements.splice(srcEIdx, 1);

            let insertIdx = elements.length;
            if (point.index >= 0) {
                insertIdx = elements.findIndex((_, i) => i === point.index);
                if (insertIdx < 0) insertIdx = elements.length;
            }

            if (point.index >= 0) {
                if (point.before) {
                    insertIdx = Math.max(0, point.index);
                } else {
                    insertIdx = Math.min(elements.length, point.index + 1);
                }
            }

            elements.splice(insertIdx, 0, moved);
            draggedElemInfo = null;
            clearDragIndicators();
            saveToLocalStorage();
            renderForms();
        }

        function onElemDrop(e, targetSIdx, targetEIdx) {
            e.preventDefault();
            e.stopPropagation();
            if (!draggedElemInfo || draggedElemInfo.kind === 'slide') return;

            const srcSIdx = draggedElemInfo.sIdx;
            const srcEIdx = draggedElemInfo.eIdx;
            if (srcSIdx !== targetSIdx) { draggedElemInfo = null; dragHoverInfo = null; clearDragIndicators(); return; }

            const elements = slidesData[targetSIdx].elements;
            if (!elements[srcEIdx] || !elements[targetEIdx] || srcEIdx === targetEIdx) {
                draggedElemInfo = null; dragHoverInfo = null; clearDragIndicators(); return;
            }

            const targetEl = e.currentTarget;
            const rect = targetEl.getBoundingClientRect();
            const side = (dragHoverInfo && dragHoverInfo.sIdx === targetSIdx && dragHoverInfo.eIdx === targetEIdx)
                ? dragHoverInfo.side : getDropSide(e, rect);

            const moved = elements[srcEIdx];
            const targetRef = elements[targetEIdx];

            if (side === 'left' || side === 'right') {
                setAdaptiveSideWidths(elements, srcEIdx, targetEIdx, side);
            }

            elements.splice(srcEIdx, 1);
            const targetIndex = elements.indexOf(targetRef);
            let insertIndex = targetIndex < 0 ? elements.length : targetIndex;
            if (side === 'right' || side === 'bottom') insertIndex++;
            insertIndex = Math.max(0, Math.min(insertIndex, elements.length));
            elements.splice(insertIndex, 0, moved);

            draggedElemInfo = null;
            dragHoverInfo = null;
            clearDragIndicators();
            saveToLocalStorage();
            renderForms();
        }

        function quickSetWidth(sIdx, eIdx, widthVal) {
            slidesData[sIdx].elements[eIdx].width = widthVal;
            saveToLocalStorage();
            renderForms();
        }

        function computeChartBadge(type, dataArr) {
            if (!dataArr || dataArr.length === 0 || dataArr.some(isNaN)) {
                return { badgeClass: 'var-up', badgeIcon: '▲', badgeText: '0%' };
            }

            const first = dataArr[0];
            const last = dataArr[dataArr.length - 1];
            const prev = dataArr.length > 1 ? dataArr[dataArr.length - 2] : first;

            let badgeClass = 'var-up';
            let badgeIcon = '▲';
            let badgeText = '';

            switch (type) {
                case 'compare':
                    const compDiff = last - prev;
                    const compPct = prev !== 0 ? Math.abs((compDiff / prev) * 100).toFixed(1) : '0';
                    badgeClass = compDiff >= 0 ? 'var-up' : 'var-down';
                    badgeIcon = compDiff >= 0 ? '▲' : '▼';
                    badgeText = `${compDiff >= 0 ? '+' : '-'}${compPct}% vs Sblm`;
                    break;
                case 'percentage':
                    const maxVal = Math.max(...dataArr, 1);
                    const pctOfMax = ((last / maxVal) * 100).toFixed(0);
                    badgeClass = 'var-up';
                    badgeIcon = '⌖';
                    badgeText = `${pctOfMax}% Capaian`;
                    break;
                case 'target':
                    const targetVal = Math.max(...dataArr);
                    const isMet = last >= targetVal;
                    badgeClass = isMet ? 'var-up' : 'var-down';
                    badgeIcon = isMet ? '✓' : '✕';
                    badgeText = isMet ? 'Target Tercapai' : 'Di Bawah Target';
                    break;
                case 'trend':
                default:
                    const trendDiff = last - first;
                    const trendPct = first !== 0 ? Math.abs((trendDiff / first) * 100).toFixed(1) : '0';
                    badgeClass = trendDiff >= 0 ? 'var-up' : 'var-down';
                    badgeIcon = trendDiff >= 0 ? '▲' : '▼';
                    badgeText = `${trendPct}%`;
                    break;
            }

            return { badgeClass, badgeIcon, badgeText };
        }
