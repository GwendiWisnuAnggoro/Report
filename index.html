                            const cells = r.split(',').map(c => c.trim());
                            const td = cells.map(c => `<td style="padding:6px 8px; font-size:10px; color:var(--text-white); border-bottom:1px solid var(--border-obsidian);">${renderVarsInText(c, globalVars, sIdx, eIdx, 'rowsData')}</td>`).join('');
                            return `<tr>${td}</tr>`;
                        }).join('');

                        p = `${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<table style="width:100%; border-collapse:collapse; background:rgba(22,24,22,0.6); border:1px solid var(--border-obsidian); border-radius:${br}; overflow:hidden;"><thead><tr>${thHtml}</tr></thead><tbody>${trHtml}</tbody></table>`;
                    }
                    else if (elem.type === 'social') {
                        const links = elem.socialLinks || [];
                        const sHtml = links.map((l, lIdx) => {
                            const pPlat = renderVarsInText(l.platform || '', globalVars, sIdx, eIdx, 'platform', 'social', lIdx);
                            const pHandle = renderVarsInText(l.handle || '', globalVars, sIdx, eIdx, 'handle', 'social', lIdx);
                            const pStat = renderVarsInText(l.stat || '', globalVars, sIdx, eIdx, 'stat', 'social', lIdx);
                            return `<div class="social-card" style="border-radius: ${br};"><div style="font-size:8px; color:var(--accent-gold); font-weight:800; text-transform:uppercase;">${pPlat}</div><div class="social-card-val">${pStat}</div><div style="font-size:9px; color:var(--text-muted);">${pHandle}</div></div>`;
                        }).join('');
                        p = `${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<div class="social-grid">${sHtml}</div>`;
                    }
                    else if (elem.type === 'breakdown') {
                        const parsedTitle = renderVarsInText(elem.title || 'WAWASAN AUDIENS', globalVars, sIdx, eIdx, 'title');
                        const rows = (elem.rowsData || '').split('\n').filter(r => r.trim());
                        const rHtml = rows.map(r => {
                            const [label, val] = r.split(',').map(s => s ? s.trim() : '');
                            return `<div class="breakdown-row"><span>${renderVarsInText(label || '', globalVars, sIdx, eIdx, 'rowsData')}</span><strong style="color:var(--text-white);">${renderVarsInText(val || '', globalVars, sIdx, eIdx, 'rowsData')}</strong></div>`;
                        }).join('');
                        p = `${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<div style="background:rgba(22,24,22,0.6); border:1px solid var(--border-obsidian); padding:10px; border-radius:${br};"><div style="font-size:10px; font-weight:800; color:var(--accent-gold); margin-bottom:6px; letter-spacing:1px;">${parsedTitle}</div>${rHtml}</div>`;
                    }
                    else if (elem.type === 'wawasan') {
                        const parsedTitle = renderVarsInText(elem.title || 'CATATAN', globalVars, sIdx, eIdx, 'title');
                        const parsedContent = renderVarsInText(elem.content || '', globalVars, sIdx, eIdx, 'content');
                        p = `${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<div class="wawasan-box" style="border-radius: ${br};"><div style="font-size:10px; font-weight:800; color:var(--accent-gold); letter-spacing:1px;">${parsedTitle}</div><div style="font-size:11px; line-height:1.4;">${parsedContent}</div></div>`;
                    }
                    else if (elem.type === 'image') {
                        p = elem.imgData ? `<img src="${elem.imgData}" class="img-preview-box" style="border-radius:${br}">` : `<div style="border:1px dashed var(--border-obsidian); padding:20px; text-align:center; color:var(--text-muted); font-size:10px; border-radius:${br}">Belum ada gambar/logo diupload</div>`;
                    }
                    else if (elem.type === 'comparison') {
                        const parsedLabel = renderVarsInText(elem.label || 'PERBANDINGAN', globalVars, sIdx, eIdx, 'label');
                        if (elem.compareMode === 'boolean') {
                            const isTrue = (elem.boolVal === 'true' || elem.boolVal === true);
                            const textCustom = renderVarsInText(elem.boolText || (isTrue ? 'YA' : 'TIDAK'), globalVars, sIdx, eIdx, 'boolText');
                            const colorClass = isTrue ? 'var-up' : 'var-down';
                            const iconSymbol = isTrue ? '✓' : '✕';
                            p = `${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<div class="compare-box" style="border-radius: ${br};"><div><div style="font-size:9px; color:var(--text-muted); font-weight:800;">${parsedLabel}</div><div class="compare-num">${textCustom}</div></div><span class="var-badge ${colorClass}" style="font-size:12px; padding:4px 10px;">${iconSymbol} ${isTrue ? 'AKTIF' : 'NON-AKTIF'}</span></div>`;
                        } else {
                            const pVal = parseFloat(renderVarsInText(elem.prevVal || '0', globalVars, sIdx, eIdx, 'prevVal')) || 0;
                            const cVal = parseFloat(renderVarsInText(elem.currVal || '0', globalVars, sIdx, eIdx, 'currVal')) || 0;
                            const diff = cVal - pVal;
                            const pct = pVal !== 0 ? Math.abs((diff / pVal) * 100).toFixed(1) : '0';
                            const isUp = diff >= 0;
                            p = `${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<div class="compare-box" style="border-radius: ${br};"><div><div style="font-size:9px; color:var(--text-muted); font-weight:800;">${parsedLabel}</div><div class="compare-num">${cVal}</div></div><span class="var-badge ${isUp ? 'var-up' : 'var-down'}" style="font-size:11px; padding:4px 8px;">${isUp ? '▲' : '▼'} ${pct}% (${isUp ? '+' : ''}${diff})</span></div>`;
                        }
                    }
                    else if (elem.type === 'chart') {
                        const chartId = `chart-${sIdx}-${eIdx}`;
                        const rawLabels = (elem.labels || 'A, B').split(',').map(s => renderVarsInText(s.trim(), globalVars, sIdx, eIdx, 'labels'));
                        const dataArr = (elem.data || '10, 20').split(',').map(s => parseFloat(renderVarsInText(s.trim(), globalVars, sIdx, eIdx, 'data')) || 0);

                        const { badgeClass, badgeIcon, badgeText } = computeChartBadge(elem.badgeType || 'trend', dataArr);
                        const parsedTitle = renderVarsInText(elem.title || 'GRAFIK ANALISIS', globalVars, sIdx, eIdx, 'title');
                        const parsedSub = renderVarsInText(elem.subtitle || '', globalVars, sIdx, eIdx, 'subtitle');

                        p = `<div style="background:rgba(22,24,22,0.6); border:1px solid var(--border-obsidian); border-radius:${br}; padding:12px; width:100%;">
                                <div style="display:flex; justify-content:space-between; align-items:flex-start; margin-bottom:8px;">
                                    <div>
                                        ${pill ? `<div style="margin-bottom:4px;">${pill}</div>` : ''}
                                        <div style="font-size:12px; font-weight:800; color:var(--text-white);">${parsedTitle}</div>
                                        ${parsedSub ? `<div style="font-size:9px; color:var(--text-muted);">${parsedSub}</div>` : ''}
                                    </div>
                                    <span class="var-badge ${badgeClass}">${badgeIcon} ${badgeText}</span>
                                </div>
                                <div style="height:170px; width:100%; position:relative;"><canvas id="${chartId}"></canvas></div>
                             </div>`;

                        chartsToRender.push({
                            id: chartId,
                            type: elem.chartType || 'bar',
                            labels: rawLabels,
                            data: dataArr,
                            showValues: !!elem.showValues,
                            valueSuffix: elem.valueSuffix || ''
                        });
                    }

                    elemWrapper.innerHTML = dragBar + p;
                    slideBody.appendChild(elemWrapper);
                });

                const slideFooter = document.createElement('div'); slideFooter.className = 'slide-footer';
                const parsedFooterLeft = renderVarsInText(slide.footerLeft || 'MALEVIN', globalVars, sIdx, null, 'footerLeft');
                slideFooter.innerHTML = `<div>${parsedFooterLeft}</div><div class="slide-num">${sIdx + 1}</div>`;

                slideEl.appendChild(slideBody);
                slideEl.appendChild(slideFooter);
                container.appendChild(slideEl);
            });

            setTimeout(() => {
                chartsToRender.forEach(c => {
                    const ctx = document.getElementById(c.id);
                    if (ctx) {
                        const canvasCtx2d = ctx.getContext('2d');
                        const isPieLike = (c.type === 'pie' || c.type === 'doughnut');
                        let chartBg;
                        if (isPieLike) {
                            chartBg = ['#C49A57', '#B08847', '#9C7639', '#8A6831', '#785A2A'];
                        } else {
                            /* Gradient emas vertikal (gold -> gold-dark), migrasi dari tampilan gradient bar versi PDF vektor */
                            const grad = canvasCtx2d.createLinearGradient(0, 0, 0, ctx.height || 170);
                            grad.addColorStop(0, 'rgba(196, 154, 87, 0.9)');
                            grad.addColorStop(1, 'rgba(138, 104, 49, 0.35)');
                            chartBg = grad;
                        }
                        const instance = new Chart(ctx, {
                            type: c.type,
                            data: {
                                labels: c.labels,
                                datasets: [{
                                    data: c.data,
                                    backgroundColor: chartBg,
                                    borderColor: '#C49A57',
                                    borderWidth: 2,
                                    fill: c.type === 'line'
                                }]
                            },
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                plugins: { 
                                    legend: { display: (c.type === 'pie' || c.type === 'doughnut'), labels: { color: '#FEFEFE', font: { size: 9 } } },
                                    valueLabelPlugin: { enabled: c.showValues, suffix: c.valueSuffix }
                                },
                                scales: (c.type === 'pie' || c.type === 'doughnut') ? {} : {
                                    x: { ticks: { color: '#808280', font: { size: 8 } }, grid: { display: false } },
                                    y: { ticks: { color: '#808280', font: { size: 8 } }, grid: { color: '#242624' } }
                                }
                            }
                        });
                        chartInstances.push(instance);
                    }
                });
            }, 50);
        }

        /* PERBAIKAN 2: REAL IMPORT METADATA PDF DARI HASIL EXPORT MALEVIN */
        async function handlePDFImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            try {
                const arrayBuffer = await file.arrayBuffer();
                const pdfDoc = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
                const meta = await pdfDoc.getMetadata();

                let metadataString = null;
                if (meta && meta.info && meta.info.Subject) {
                    if (meta.info.Subject.startsWith('MALEVIN_METADATA:')) {
                        metadataString = meta.info.Subject.replace('MALEVIN_METADATA:', '');
                    }
                }

                if (!metadataString) {
                    alert("Gagal Import PDF!\nFile PDF ini tidak mengandung metadata MALEVIN yang valid atau dibuat dari aplikasi luar/lain.");
                    event.target.value = '';
                    return;
                }

                const payload = JSON.parse(metadataString);
                if (payload && payload.slidesData && payload.customVariables) {
                    slidesData = payload.slidesData;
                    customVariables = payload.customVariables;
                    saveToLocalStorage();
                    renderForms();
                    alert("Metadata PDF Berhasil Diimport!\nSemua variabel dan komponen slide telah dipulihkan dan dapat diedit langsung.");
                } else {
                    alert("Format metadata PDF rusak atau tidak sesuai.");
                }
            } catch (err) {
                console.error("PDF Import Error:", err);
                alert("Tidak dapat membaca file PDF. Pastikan file PDF valid dan berasal dari Export MALEVIN.");
            }
            event.target.value = '';
        }

        /* ===== EXPORT PDF (metode: setiap slide di-screenshot jadi gambar dulu, baru ditempel ke PDF) ===== */
        async function downloadPDF() {
            const { jsPDF } = window.jspdf;
            document.body.classList.add('exporting-pdf');

            const container = document.getElementById('deck-container');
            const originalTransform = container.style.transform;
            const originalMarginBottom = container.style.marginBottom;
            container.style.transform = 'none';
            container.style.marginBottom = '0px';

            const metadataPayload = {
                app: "MALEVIN_DECK_STUDIO",
                version: "6.0-image-export",
                slidesData: slidesData,
                customVariables: customVariables
            };

            let pdf = null;
            const pageWidth = 850;
            const slideElements = document.querySelectorAll('.slide');

            try {
                for (let i = 0; i < slideElements.length; i++) {
                    const slide = slideElements[i];

                    const canvas = await html2canvas(slide, {
                        scale: 2,
                        useCORS: true,
                        backgroundColor: '#0A0B0A',
                        logging: false
                    });

                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    /* Tinggi halaman mengikuti rasio asli canvas slide, bukan dipaksa,
                       supaya slide yang kontennya lebih tinggi tidak gepeng saat di-export */
                    const pageHeight = canvas.height * (pageWidth / canvas.width);

                    if (i === 0) {
                        pdf = new jsPDF({
                            orientation: 'landscape',
                            unit: 'pt',
                            format: [pageWidth, pageHeight]
                        });
                        /* Metadata deck (semua slide + variabel) disisipkan di field Subject PDF,
                           supaya bisa dipulihkan lagi lewat "Import PDF Metadata" */
                        pdf.setProperties({
                            title: "MALEVIN Deck Presentation",
                            subject: "MALEVIN_METADATA:" + JSON.stringify(metadataPayload),
                            keywords: "MALEVIN_STUDIO_DECK",
                            author: "MALEVIN"
                        });
                    } else {
                        pdf.addPage([pageWidth, pageHeight], 'landscape');
                    }
                    pdf.addImage(imgData, 'JPEG', 0, 0, pageWidth, pageHeight);
                }

                pdf.save(`MALEVIN_Deck_${Date.now()}.pdf`);
            } finally {
                container.style.transform = originalTransform;
                container.style.marginBottom = originalMarginBottom;
                document.body.classList.remove('exporting-pdf');
            }
        }

        /* ===== EXPORT / IMPORT METADATA LEWAT FILE JSON =====
           Cadangan selain lewat PDF: metadata (slidesData + customVariables) bisa
           di-export jadi file .json terpisah, lalu di-import lagi kapan saja
           tanpa perlu buka/scan file PDF. */
        function exportMetadataJSON() {
            const metadataPayload = {
                app: "MALEVIN_DECK_STUDIO",
                version: "6.0-image-export",
                slidesData: slidesData,
                customVariables: customVariables
            };
            const blob = new Blob([JSON.stringify(metadataPayload, null, 2)], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `MALEVIN_Metadata_${Date.now()}.json`;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
        }

        function importMetadataJSON(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function() {
                try {
                    const payload = JSON.parse(reader.result);
                    if (!payload || !payload.slidesData || !payload.customVariables) {
                        throw new Error('invalid');
                    }
                    slidesData = payload.slidesData;
                    customVariables = payload.customVariables;
                    saveToLocalStorage();
                    renderForms();
                    renderPreview();
                    alert("Metadata JSON Berhasil Diimport!\nSemua variabel dan komponen slide telah dipulihkan dan dapat diedit langsung.");
                } catch (err) {
                    console.error("JSON Import Error:", err);
                    alert("Gagal Import JSON!\nFile ini bukan file metadata MALEVIN yang valid.");
                }
            };
            reader.readAsText(file);
            event.target.value = '';
        }


    </script>
