<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malevin — Canva-Style Vector Engine</title>
    <!-- jsPDF untuk render Vector PDF murni -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <style>
        :root {
            --bg-obsidian: #0A0B0A;
            --surface-dark: #121312;
            --card-obsidian: #1A1C1A;
            --border-obsidian: #2A2C2A;
            --accent-gold: #C49A57;
            --text-white: #FEFEFE;
            --text-muted: #808280;
            --canvas-bg: #050505;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Arial, sans-serif; }

        body { background-color: var(--bg-obsidian); color: var(--text-white); height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

        /* TOPBAR */
        .topbar { background-color: var(--surface-dark); border-bottom: 1px solid var(--border-obsidian); padding: 12px 24px; display: flex; justify-content: space-between; align-items: center; z-index: 100; }
        .brand { font-size: 14px; font-weight: 800; letter-spacing: 2px; color: var(--accent-gold); display: flex; align-items: center; gap: 10px; }
        .badge { background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%); color: #0A0B0A; font-size: 9px; padding: 2px 6px; border-radius: 4px; }
        
        .btn { background-color: var(--card-obsidian); color: var(--text-white); border: 1px solid var(--border-obsidian); padding: 8px 14px; border-radius: 6px; font-size: 11px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.2s; }
        .btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .btn-gold { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; border: none; font-weight: 800; }
        .btn-gold:hover { transform: translateY(-1px); color: #000; }

        /* WORKSPACE */
        .workspace { display: flex; flex: 1; height: calc(100vh - 55px); }

        /* PROPERTIES SIDEBAR */
        .sidebar { width: 300px; background-color: var(--surface-dark); border-right: 1px solid var(--border-obsidian); display: flex; flex-direction: column; padding: 20px; gap: 20px; overflow-y: auto; }
        .sidebar-title { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 2px; font-weight: 800; border-bottom: 1px solid var(--border-obsidian); padding-bottom: 10px; }
        
        .form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
        .form-group label { font-size: 10px; color: #A0A0A0; }
        .form-control { background: var(--bg-obsidian); border: 1px solid var(--border-obsidian); color: white; padding: 8px 10px; border-radius: 4px; font-size: 12px; width: 100%; outline: none; }
        .form-control:focus { border-color: var(--accent-gold); }
        input[type="color"] { padding: 0; height: 32px; cursor: pointer; }
        input[type="range"] { accent-color: var(--accent-gold); }

        /* CANVAS AREA */
        .canvas-container { flex: 1; background-color: var(--canvas-bg); display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; }
        
        /* THE SLIDE (960x540 = 16:9) */
        #slide { width: 960px; height: 540px; background-color: #121312; position: relative; overflow: hidden; box-shadow: 0 20px 50px rgba(0,0,0,0.8); border: 1px solid #222; }
        
        .canvas-element { position: absolute; cursor: grab; user-select: none; line-height: 1.2; box-sizing: border-box; }
        .canvas-element:active { cursor: grabbing; }
        .canvas-element.selected { outline: 2px dashed var(--accent-gold); outline-offset: 2px; z-index: 100; }
        
        .no-selection-msg { font-size: 12px; color: var(--text-muted); text-align: center; margin-top: 40px; font-style: italic; }

        /* TOOLS ROW */
        .tools-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="brand">MALEVIN <span class="badge">VECTOR ENGINE</span></div>
        <div>
            <button class="btn btn-gold" onclick="exportToVectorPDF()">📥 Download Vector PDF</button>
        </div>
    </div>

    <div class="workspace">
        <div class="sidebar">
            <div class="sidebar-title">TAMBAH ELEMEN</div>
            <div class="tools-row">
                <button class="btn" onclick="addText()">+ Teks Baru</button>
                <button class="btn" onclick="document.getElementById('imgInput').click()">+ Gambar</button>
                <input type="file" id="imgInput" style="display: none;" accept="image/*" onchange="handleImageUpload(event)">
            </div>

            <div class="sidebar-title">PENGATURAN ELEMEN</div>
            <div id="propertiesPanel">
                <div class="no-selection-msg">Klik elemen pada kanvas untuk mengeditnya.</div>
            </div>
        </div>

        <div class="canvas-container" id="canvasContainer">
            <div id="slide" onmousedown="onSlideClick(event)">
                <!-- Elements rendered here by JS -->
            </div>
        </div>
    </div>

    <script>
        // State Management
        let elements = [
            { id: '1', type: 'text', text: 'CAMPAIGN DECK 2026', x: 60, y: 80, fontSize: 36, color: '#C49A57', bold: true },
            { id: '2', type: 'text', text: 'Tarik aku kemana saja!\nKlik aku untuk mengedit teks atau warna di panel kiri.', x: 60, y: 140, fontSize: 16, color: '#FFFFFF', bold: false }
        ];
        let selectedId = null;

        // Drag Variables
        let isDragging = false;
        let startMouseX = 0, startMouseY = 0;
        let startElX = 0, startElY = 0;

        const slideDOM = document.getElementById('slide');
        const propsPanel = document.getElementById('propertiesPanel');

        // Initial Render
        renderCanvas();

        function renderCanvas() {
            slideDOM.innerHTML = ''; // Bersihkan kanvas
            
            elements.forEach(el => {
                const node = document.createElement(el.type === 'image' ? 'img' : 'div');
                node.className = `canvas-element ${el.id === selectedId ? 'selected' : ''}`;
                node.style.left = `${el.x}px`;
                node.style.top = `${el.y}px`;
                node.id = `el-${el.id}`;

                if (el.type === 'text') {
                    node.innerText = el.text;
                    node.style.fontSize = `${el.fontSize}px`;
                    node.style.color = el.color;
                    node.style.fontWeight = el.bold ? 'bold' : 'normal';
                    node.style.whiteSpace = 'pre-wrap';
                } else if (el.type === 'image') {
                    node.src = el.src;
                    node.style.width = `${el.w}px`;
                    node.style.height = `${el.h}px`;
                    node.style.objectFit = 'cover';
                    node.style.borderRadius = `${el.borderRadius}px`; // Pill, Rounded, or Circle
                }

                // Attach drag events
                node.addEventListener('mousedown', (e) => startDrag(e, el));
                slideDOM.appendChild(node);
            });

            renderProperties();
        }

        // --- INTERAKSI DRAG & DROP ---
        function startDrag(e, el) {
            e.stopPropagation(); // Cegah event klik slide
            selectedId = el.id;
            isDragging = true;
            
            // Dapatkan skala zoom layar jika ada
            const rect = slideDOM.getBoundingClientRect();
            const scaleX = 960 / rect.width;
            const scaleY = 540 / rect.height;

            startMouseX = e.clientX * scaleX;
            startMouseY = e.clientY * scaleY;
            startElX = el.x;
            startElY = el.y;

            renderCanvas();
        }

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            const rect = slideDOM.getBoundingClientRect();
            const scaleX = 960 / rect.width;
            const scaleY = 540 / rect.height;

            const currentMouseX = e.clientX * scaleX;
            const currentMouseY = e.clientY * scaleY;
            
            const dx = currentMouseX - startMouseX;
            const dy = currentMouseY - startMouseY;

            const el = elements.find(e => e.id === selectedId);
            if (el) {
                el.x = startElX + dx;
                el.y = startElY + dy;
                // Update DOM langsung biar smooth tanpa re-render seluruh array
                const node = document.getElementById(`el-${el.id}`);
                node.style.left = `${el.x}px`;
                node.style.top = `${el.y}px`;
            }
        });

        window.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                renderProperties(); // Update posisi X & Y di form properties jika ada
            }
        });

        function onSlideClick(e) {
            // Deselect jika mengklik area kosong slide
            selectedId = null;
            renderCanvas();
        }

        // --- PROPERTY EDITOR ---
        function renderProperties() {
            const el = elements.find(e => e.id === selectedId);
            if (!el) {
                propsPanel.innerHTML = '<div class="no-selection-msg">Klik elemen pada kanvas untuk mengeditnya.</div>';
                return;
            }

            let html = '';
            if (el.type === 'text') {
                html += `
                    <div class="form-group"><label>Isi Teks</label><textarea class="form-control" rows="3" oninput="updateEl('text', this.value)">${el.text}</textarea></div>
                    <div class="form-group"><label>Ukuran Font (px)</label><input type="range" min="10" max="120" value="${el.fontSize}" oninput="updateEl('fontSize', parseInt(this.value)); document.getElementById('fs-val').innerText=this.value;"> <span id="fs-val" style="font-size:10px">${el.fontSize}</span></div>
                    <div class="form-group"><label>Warna Teks</label><input type="color" class="form-control" value="${el.color}" oninput="updateEl('color', this.value)"></div>
                    <div class="form-group"><label>Format</label>
                        <button class="btn" style="width:100%; border-color: ${el.bold ? 'var(--accent-gold)' : ''}" onclick="updateEl('bold', !${el.bold})">Teks Tebal (Bold)</button>
                    </div>
                `;
            } else if (el.type === 'image') {
                html += `
                    <div class="form-group"><label>Lebar (W)</label><input type="range" min="50" max="800" value="${el.w}" oninput="updateEl('w', parseInt(this.value))"></div>
                    <div class="form-group"><label>Tinggi (H)</label><input type="range" min="50" max="800" value="${el.h}" oninput="updateEl('h', parseInt(this.value))"></div>
                    <div class="form-group"><label>Lengkungan Sudut / Pill / Circle</label><input type="range" min="0" max="300" value="${el.borderRadius}" oninput="updateEl('borderRadius', parseInt(this.value))"></div>
                `;
            }
            
            html += `<button class="btn" style="color: #FF5555; border-color: #552222; margin-top: 15px; width: 100%" onclick="deleteElement('${el.id}')">HAPUS ELEMEN</button>`;
            propsPanel.innerHTML = html;
        }

        function updateEl(key, value) {
            const el = elements.find(e => e.id === selectedId);
            if (el) { el[key] = value; renderCanvas(); }
        }

        // --- ADD & DELETE ACTIONS ---
        function addText() {
            const newEl = { id: Date.now().toString(), type: 'text', text: 'Teks Baru', x: 400, y: 250, fontSize: 24, color: '#FFFFFF', bold: false };
            elements.push(newEl);
            selectedId = newEl.id;
            renderCanvas();
        }

        function handleImageUpload(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    // Kalkulasi ukuran agar pas di layar (max 300px)
                    let w = img.width; let h = img.height;
                    if (w > 300) { h = h * (300/w); w = 300; }
                    const newEl = { id: Date.now().toString(), type: 'image', src: event.target.result, x: 330, y: 150, w: w, h: h, borderRadius: 0 };
                    elements.push(newEl);
                    selectedId = newEl.id;
                    renderCanvas();
                }
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
            e.target.value = ''; // reset
        }

        function deleteElement(id) {
            elements = elements.filter(e => e.id !== id);
            selectedId = null;
            renderCanvas();
        }

        // --- ALGORITMA EKSPOR VEKTOR ASLI (THE MAGIC) ---
        async function exportToVectorPDF() {
            // Deselect agar garis seleksi tidak ikut ke-render secara visual
            selectedId = null; 
            renderCanvas();

            const { jsPDF } = window.jspdf;
            // Orientasi Landscape, satuan Pixel (pt), Resolusi Canvas kita 960x540
            const doc = new jsPDF({ orientation: 'landscape', unit: 'px', format: [960, 540] });

            // 1. Gambar Background Slide
            doc.setFillColor(18, 19, 18); // warna #121312
            doc.rect(0, 0, 960, 540, 'F');

            // 2. Loop Semua Elemen dari Data Model (Bukan dari HTML!)
            for (let el of elements) {
                if (el.type === 'text') {
                    // Pengaturan Vektor Teks Asli
                    doc.setFont("helvetica", el.bold ? "bold" : "normal");
                    doc.setFontSize(el.fontSize);
                    doc.setTextColor(el.color);
                    
                    // jsPDF tidak mendukung multi-line secara otomatis dari \n dengan baseline 'top' sempurna
                    // Kita pisah \n jadi array agar tercetak turun ke bawah
                    const textLines = el.text.split('\n');
                    doc.text(textLines, el.x, el.y, { baseline: 'top' });
                } 
                else if (el.type === 'image') {
                    // Jika gambar butuh melengkung (rounded/pill), jsPDF asli tidak bisa kliping gambar sembarangan.
                    // Solusi: Kita gambar ke kanvas virtual sementar yang di kliping, ambil base64-nya, tempel ke PDF!
                    if (el.borderRadius > 0) {
                        const canvas = document.createElement('canvas');
                        canvas.width = el.w; canvas.height = el.h;
                        const ctx = canvas.getContext('2d');
                        
                        // Buat path melengkung
                        ctx.beginPath();
                        ctx.roundRect(0, 0, el.w, el.h, el.borderRadius);
                        ctx.clip(); // Potong
                        
                        // Gambar image ke dalam path melengkung
                        const imgNode = document.getElementById(`el-${el.id}`);
                        ctx.drawImage(imgNode, 0, 0, el.w, el.h);
                        
                        // Masukkan gambar terpotong ke PDF
                        const clippedImg = canvas.toDataURL('image/png');
                        doc.addImage(clippedImg, 'PNG', el.x, el.y, el.w, el.h);
                    } else {
                        // Jika kotak biasa, tempel langsung (kualitas maksimal)
                        doc.addImage(el.src, 'JPEG', el.x, el.y, el.w, el.h);
                    }
                }
            }

            // 3. Unduh secara paksa (Langsung masuk file explorer tanpa dialog print)
            doc.save('Malevin_Vector_Slide.pdf');
        }
    </script>
</body>
</html>
