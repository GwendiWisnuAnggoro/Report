<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malevin — Deck Studio & Dynamic Analytics Engine</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
<style>
    :root {
        --bg-obsidian: #0A0B0A;
        --surface-dark: #121312;
        --card-obsidian: #161816;
        --border-obsidian: #242624;
        --accent-gold: #C49A57;
        --accent-gold-glow: rgba(196, 154, 87, 0.15);
        --text-white: #FEFEFE;
        --text-muted: #808280;
        --positive: #4CAF7A;
        --negative: #E55353;
        --font-main: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body { 
        background-color: var(--bg-obsidian); 
        color: var(--text-white); 
        font-family: var(--font-main); 
        min-height: 100vh; 
        display: flex; 
        flex-direction: column; 
        overflow-x: hidden; 
        -webkit-font-smoothing: antialiased; 
    }

    .topbar { 
        background-color: var(--surface-dark); 
        border-bottom: 1px solid var(--border-obsidian); 
        padding: 10px 20px; 
        display: flex; 
        justify-content: space-between; 
        align-items: center; 
        z-index: 100; 
        flex-wrap: wrap; 
        gap: 10px; 
    }

    .brand-title { font-size: 14px; font-weight: 800; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
    .brand-badge { background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%); color: #0A0B0A; font-size: 9px; padding: 2px 6px; border-radius: 2px; font-weight: 800; letter-spacing: 1px; }
    .topbar-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }

    .mode-tabs { display: flex; gap: 4px; background: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 6px; padding: 3px; }
    .mode-tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px 14px; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: all 0.2s ease; }
    .mode-tab-btn.active { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; }
    .mode-tab-btn:not(.active):hover { color: var(--accent-gold); }

    .app-container { display: flex; flex: 1; min-height: 0; overflow: hidden; }

    /* EDITOR PANEL */
    .editor-panel { width: 100%; max-width: 680px; margin: 0 auto; background-color: var(--surface-dark); display: flex; flex-direction: column; overflow-y: auto; padding: 20px; gap: 16px; }
    .slide-accordion { background-color: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
    .slide-accordion-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-obsidian); padding-bottom: 8px; flex-wrap: wrap; gap: 6px; }
    
    .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
    .add-elem-btn { background-color: var(--surface-dark); color: var(--text-white); border: 1px solid var(--border-obsidian); font-size: 9px; padding: 8px 4px; border-radius: 4px; cursor: pointer; font-weight: 700; letter-spacing: 0.5px; text-align: center; }
    .add-elem-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
    .add-elem-btn.btn-ana { border-color: rgba(196, 154, 87, 0.4); color: var(--accent-gold); background: rgba(196, 154, 87, 0.05); }

    .element-box { background-color: var(--bg-obsidian); border: 1px solid var(--border-obsidian); border-left: 3px solid var(--accent-gold); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; margin-top: 4px; }
    .element-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; }
    
    .form-group { display: flex; flex-direction: column; gap: 4px; }
    .form-group label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
    .form-control { background-color: var(--surface-dark); border: 1px solid var(--border-obsidian); color: var(--text-white); padding: 7px 9px; border-radius: 4px; font-size: 11px; font-family: inherit; width: 100%; }
    .form-control:focus { outline: none; border-color: var(--accent-gold); }
    textarea.form-control { resize: vertical; min-height: 50px; line-height: 1.4; }
    .two-col-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }

    .btn { background-color: var(--card-obsidian); color: var(--text-white); border: 1px solid var(--border-obsidian); padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
    .btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
    .btn-gold { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; border: none; font-weight: 800; }
    .btn-danger { background-color: transparent; color: #E55353; border: 1px solid rgba(229, 83, 83, 0.3); padding: 3px 8px; font-size: 9px; }

    /* LIVE PREVIEW CANVAS */
    .preview-panel { flex: 1; background-color: #050505; overflow: auto; padding: 30px; display: flex; flex-direction: column; align-items: center; }
    #deck-container { display: flex; flex-direction: column; gap: 30px; width: 850px; margin: 0 auto; }

    .slide {
        width: 850px !important; min-height: 478px; height: auto; background-color: var(--bg-obsidian); border: 1px solid var(--border-obsidian); padding: 28px 36px 20px 36px; position: relative; box-shadow: 0 15px 40px rgba(0,0,0,0.9); display: flex; flex-direction: column; justify-content: space-between; box-sizing: border-box; gap: 20px; flex-shrink: 0; overflow: hidden;
    }

    .slide::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: linear-gradient(90deg, #C49A57 0%, rgba(196,154,87,0.2) 100%); }
    
    .slide-body { flex: 1; display: flex; flex-wrap: wrap; flex-direction: row; align-content: flex-start; gap: 16px; justify-content: flex-start; margin: 10px 0; position: relative; width: 100%; }
    .slide-body.has-cover { justify-content: center; align-items: flex-start; flex-direction: column; }

    .draggable-element { position: relative; user-select: none; transition: transform 0.15s ease, border-color 0.15s ease; border: 1px dashed transparent; padding: 4px; border-radius: 4px; }
    
    .elem-width-full { width: 100%; }
    .elem-width-half { width: calc(50% - 8px); }
    .elem-width-third { width: calc(33.333% - 10.66px); }
    .elem-width-twothird { width: calc(66.666% - 5.33px); }

    .draggable-element:hover { border-color: rgba(196, 154, 87, 0.4); background: rgba(196, 154, 87, 0.02); }

    .elem-brand-pill { background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%); color: #0A0B0A; font-size: 8px; font-weight: 800; padding: 3px 8px; letter-spacing: 1px; text-transform: uppercase; display: inline-block; }
    .elem-tag { font-size: 9px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; display: inline-block; }
    .elem-title { font-size: 20px; font-weight: 800; color: var(--text-white); text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; }
    
    .t-hero { font-size: 42px; font-weight: 800; color: var(--text-white); text-transform: uppercase; line-height: 1.05; }
    .t-judul { font-size: 26px; font-weight: 800; color: var(--text-white); text-transform: uppercase; line-height: 1.15; }
    .t-subjudul { font-size: 16px; font-weight: 700; color: var(--accent-gold); line-height: 1.3; }
    .t-paragraf { font-size: 11px; color: #C0C2C0; line-height: 1.5; white-space: pre-line; }

    .text-card-wrap { background-color: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); border-left: 2px solid var(--accent-gold); padding: 12px 14px; border-radius: 0 4px 4px 0; }

    .kpi-grid { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
    .kpi-card { flex: 1; min-width: 80px; background: rgba(22, 24, 22, 0.8); border: 1px solid var(--border-obsidian); padding: 10px; text-align: center; }
    .kpi-value { font-size: 22px; font-weight: 800; color: var(--accent-gold); letter-spacing: 1px; }

    .col-wrap { display: flex; gap: 10px; width: 100%; flex-wrap: wrap; }
    .col-item { flex: 1; min-width: 100px; }
    .col-card--accent { background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); border-left: 2px solid var(--accent-gold); padding: 10px 12px; border-radius: 0 4px 4px 0; }
    .col-card--plain { background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); padding: 10px 12px; border-radius: 4px; }
    .col-card--minimal { border-bottom: 1px solid var(--border-obsidian); padding-bottom: 8px; }
    .col-card--numbered { position: relative; background: rgba(22, 24, 22, 0.6); border: 1px solid var(--border-obsidian); padding: 10px 12px 10px 36px; border-radius: 4px; }
    .col-num-badge { position: absolute; left: 8px; top: 10px; width: 18px; height: 18px; border-radius: 50%; background: linear-gradient(135deg, #C49A57, #8A6831); color: #0A0B0A; font-size: 9px; font-weight: 800; display: flex; align-items: center; justify-content: center; }

    .var-badge { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; font-size: 9px; padding: 2px 6px; border-radius: 12px; white-space: nowrap; }
    .var-up { color: var(--positive); background: rgba(76, 175, 122, 0.12); }
    .var-down { color: var(--negative); background: rgba(229, 83, 83, 0.12); }
    .var-flat { color: var(--text-muted); background: rgba(128, 130, 128, 0.12); }

    .compare-box { background: rgba(22, 24, 22, 0.8); border: 1px solid var(--border-obsidian); border-radius: 4px; padding: 12px; display: flex; align-items: center; justify-content: space-between; width: 100%; }
    .compare-num { font-size: 20px; font-weight: 800; color: var(--text-white); }

    .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; width: 100%; }
    .social-card { background: rgba(22, 24, 22, 0.7); border: 1px solid var(--border-obsidian); border-radius: 4px; padding: 10px; }
    .social-card-val { font-size: 16px; font-weight: 800; color: var(--text-white); margin: 3px 0; }

    .breakdown-row { display: flex; justify-content: space-between; align-items: center; font-size: 10px; color: #C0C2C0; padding: 4px 0; border-bottom: 1px dashed var(--border-obsidian); }
    .wawasan-box { background: rgba(196, 154, 87, 0.05); border: 1px solid var(--accent-gold); padding: 12px; font-size: 11px; color: #E0E0E0; display: flex; flex-direction: column; gap: 8px; }

    .img-preview-box { max-width: 100%; max-height: 250px; object-fit: contain; display: block; }
    .slide-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-obsidian); padding-top: 8px; font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: auto; width: 100%; }
    .slide-num { font-size: 11px; font-weight: 800; color: var(--accent-gold); }

    /* FIX LAYOUT UNTUK TAMPILAN HP / SCREEN KECIL */
    @media (max-width: 768px) {
        body {
            height: auto !important;
            overflow-y: auto !important;
        }

        .app-container {
            height: auto !important;
            overflow: visible !important;
        }

        .editor-panel {
            max-height: none !important;
            overflow-y: visible !important;
            padding: 12px !important;
            padding-bottom: 80px !important; /* Ruang napas ekstra di paling bawah */
        }

        .btn-grid {
            grid-template-columns: repeat(2, 1fr); /* Di HP dibuat 2 kolom agar tombol tidak terlalu padat */
        }

        .preview-panel {
            padding: 10px !important;
        }
    }
</style>

</head>
<body>

    <div class="topbar">
        <div class="brand-title">
            <span id="brandLabel">MALEVIN</span> <span class="brand-badge">STUDIO DECK & ANALYTICS</span>
        </div>
        <select class="form-control" style="width: auto; padding: 4px 8px; font-size: 10px;" id="accountSelect" onchange="setAccount(this.value)">
            <option value="Malevin Official">Malevin Official</option>
            <option value="Malevin Haircare">Malevin Haircare</option>
            <option value="Kawaitta Studio">Kawaitta Studio</option>
        </select>
        <div class="mode-tabs">
            <button class="mode-tab-btn" id="tabEditBtn" onclick="setMode('edit')">Form Editor</button>
            <button class="mode-tab-btn" id="tabPreviewBtn" onclick="setMode('preview')">Canvas Preview</button>
        </div>
        <div class="topbar-actions">
            <input type="file" id="pdfInput" accept="application/pdf" style="display:none" onchange="handlePDFImport(event)">
            <button class="btn" id="importPdfBtn" onclick="document.getElementById('pdfInput').click()">Import PDF (Edit Ulang)</button>
            <button class="btn btn-gold" id="downloadBtn" onclick="downloadPDF()">Export Deck (PDF)</button>
        </div>
    </div>

    <div class="app-container">
        <div class="editor-panel" id="editorPanel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; font-weight:800; color:var(--accent-gold); letter-spacing:1px;">SLIDES CONTROL</span>
                <button class="btn btn-gold" onclick="addSlide()">+ Slide Baru</button>
            </div>
            <div id="forms-wrapper"></div>
        </div>
        <div class="preview-panel" id="previewPanel">
            <div id="deck-container"></div>
        </div>
    </div>

    <script>
        const ELEM_LABELS = { 
            cover: 'COVER', header: 'HEADER', text: 'TEKS', columns: 'KOLOM DOKUMEN', table: 'TABEL', 
            kpi: 'KPI METRIK', chart: 'GRAFIK ANALISIS', image: 'GAMBAR/LOGO', comparison: 'PERBANDINGAN INSIGHT', 
            social: 'STATISTIK SOSIAL (IKHTISAR)', breakdown: 'WAWASAN PENONTON', wawasan: 'ANALISIS KUSTOM' 
        };

        let currentAccount = 'Malevin Official';

        let slidesData = [
            {
                id: 1, 
                footerLeft: 'PREPARED BY MALEVIN CREATIVE TEAM',
                elements: [
                    { type: 'cover', width: 'full', brand: 'MALEVIN', tag: 'Deck Studio', title: 'Q1 ANALYTICS DECK 2026', subtitle: 'Growth, Engagement & Performance Insights', shapeStyle: 'sharp' }
                ]
            },
            {
                id: 2,
                footerLeft: 'Section 01 — Executive Summary',
                elements: [
                    { type: 'header', width: 'full', brand: 'MALEVIN', tag: 'IKHTISAR KINERJA', title: 'PERFORMA KONTEN BULANAN' },
                    { 
                        type: 'chart', width: 'half', chartType: 'bar', 
                        labels: 'Minggu 1, Minggu 2, Minggu 3, Minggu 4', data: '1200, 3400, 5800, 2100', 
                        title: 'GRAFIK PENONTON MINGGUAN', subtitle: 'Pertumbuhan tertinggi dicapai pada Minggu ke-3' 
                    },
                    { 
                        type: 'social', width: 'half', sectionTitle: 'IKHTISAR KINERJA SOSIAL', period: '1 - 15 Sep 2026',
                        metrics: [
                            { label: 'Tayangan (Views)', value: '1,245,000', deltaPercent: '18.4%', dir: 'up', varName: 'views' },
                            { label: 'Suka (Likes)', value: '84,200', deltaPercent: '12.1%', dir: 'up', varName: 'likes' },
                            { label: 'Komentar', value: '4,150', deltaPercent: '5.2%', dir: 'down', varName: 'comments' },
                            { label: 'Bagikan (Shares)', value: '12,800', deltaPercent: '24.5%', dir: 'up', varName: 'shares' }
                        ]
                    }
                ]
            }
        ];

        let chartInstances = [];

        function setAccount(val) {
            currentAccount = val;
            document.getElementById('brandLabel').innerText = val.toUpperCase();
            renderPreview();
        }

        /* =========================================================
           GLOBAL VARIABLE ENGINE
           ========================================================= */
        function computeGlobalVariables() {
            const vars = {};
            slidesData.forEach(slide => {
                slide.elements.forEach(elem => {
                    if (elem.type === 'image' && elem.varName && elem.imgData) {
                        vars[elem.varName] = { type: 'image', value: elem.imgData };
                    }
                    if (elem.type === 'text' && elem.varName && elem.content) {
                        vars[elem.varName] = { type: 'text', value: elem.content };
                    }
                    if (elem.type === 'comparison' && elem.varName) {
                        const prev = parseFloat(elem.prevVal) || 0;
                        const curr = parseFloat(elem.currVal) || 0;
                        const diff = curr - prev;
                        let pct = prev !== 0 ? Math.abs((diff / prev) * 100).toFixed(1) : (curr !== 0 ? '100' : '0');
                        const dir = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
                        vars[elem.varName] = { type: 'stat', dir, pct: pct + '%', value: elem.currVal + (elem.unit || '') };
                    }
                    if (elem.type === 'social' && elem.metrics) {
                        elem.metrics.forEach(m => {
                            if (m.varName) {
                                vars[m.varName] = { type: 'stat', dir: m.dir || 'up', pct: m.deltaPercent || '', value: m.value || '' };
                            }
                        });
                    }
                });
            });
            return vars;
        }

        function renderVarsInText(str, vars) {
            if (!str) return '';
            return str.replace(/\{\{(\w+)\}\}/g, (match, varKey) => {
                const item = vars[varKey];
                if (!item) return match;
                if (item.type === 'image') return `<img src="${item.value}" style="max-height:40px; vertical-align:middle; display:inline-block; margin:2px;">`;
                if (item.type === 'stat') {
                    const arrow = item.dir === 'up' ? '▲' : (item.dir === 'down' ? '▼' : '—');
                    const badgeClass = item.dir === 'up' ? 'var-up' : (item.dir === 'down' ? 'var-down' : 'var-flat');
                    return `<span class="var-badge ${badgeClass}">${arrow} ${item.pct || item.value}</span>`;
                }
                return item.value;
            });
        }

        /* =========================================================
           FORM EDITOR RENDERER
           ========================================================= */
        function renderForms() {
            const wrapper = document.getElementById('forms-wrapper');
            wrapper.innerHTML = '';

            slidesData.forEach((slide, sIdx) => {
                const card = document.createElement('div');
                card.className = 'slide-accordion';
                let elementsHTML = '';

                slide.elements.forEach((elem, eIdx) => {
                    const widthVal = elem.width || 'full';
                    const layoutSelector = `
                        <div class="form-group"><label>Lebar Elemen Grid</label>
                        <select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'width', this.value)">
                            <option value="full" ${widthVal === 'full' ? 'selected' : ''}>Full (100%)</option>
                            <option value="half" ${widthVal === 'half' ? 'selected' : ''}>1/2 Kolom (50%)</option>
                            <option value="third" ${widthVal === 'third' ? 'selected' : ''}>1/3 Kolom (33%)</option>
                            <option value="twothird" ${widthVal === 'twothird' ? 'selected' : ''}>2/3 Kolom (66%)</option>
                        </select></div>`;

                    const styleShape = elem.shapeStyle || 'sharp';
                    const shapeSelector = `<div class="form-group"><label>Style Sudut</label><select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'shapeStyle', this.value)"><option value="sharp" ${styleShape === 'sharp' ? 'selected' : ''}>Kotak</option><option value="rounded" ${styleShape === 'rounded' ? 'selected' : ''}>Melengkung</option></select></div>`;
                    
                    let fields = `<div class="two-col-form">${layoutSelector}${shapeSelector}</div><div class="form-group"><label>Brand / ID</label><input type="text" class="form-control" value="${elem.brand || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'brand', this.value)"></div>`;

                    if (elem.type === 'cover' || elem.type === 'header') { 
                        fields += `<div class="form-group"><label>Tag</label><input type="text" class="form-control" value="${elem.tag || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'tag', this.value)"></div><div class="form-group"><label>Judul</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>`; 
                        if(elem.type==='cover') fields += `<div class="form-group"><label>Sub-judul</label><input type="text" class="form-control" value="${elem.subtitle || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'subtitle', this.value)"></div>`;
                    } 
                    else if (elem.type === 'text') { 
                        fields += `
                        <div class="form-group"><label>Ukuran Teks</label>
                            <select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'style', this.value)">
                                <option value="hero" ${elem.style === 'hero' ? 'selected' : ''}>Hero (Besar)</option>
                                <option value="judul" ${elem.style === 'judul' ? 'selected' : ''}>Judul</option>
                                <option value="subjudul" ${elem.style === 'subjudul' ? 'selected' : ''}>Sub Judul</option>
                                <option value="paragraf" ${(!elem.style || elem.style === 'paragraf') ? 'selected' : ''}>Paragraf Regular</option>
                            </select>
                        </div>
                        <div class="form-group"><label>Nama Variable Teks</label><input type="text" class="form-control" value="${elem.varName || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'varName', this.value)"></div>
                        <div class="form-group"><label>Isi Teks</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'content', this.value)">${elem.content || ''}</textarea></div>
                        <div class="form-group"><label><input type="checkbox" ${elem.card ? 'checked' : ''} onchange="updateElem(${sIdx}, ${eIdx}, 'card', this.checked)"> Bungkus Dalam Kartu Obsidian</label></div>`; 
                    } 
                    else if (elem.type === 'image') { 
                        fields += `
                        <div class="form-group"><label>Nama Variable Gambar</label><input type="text" class="form-control" value="${elem.varName || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'varName', this.value)"></div>
                        <div class="form-group"><label>Upload Gambar / Logo</label><input type="file" class="form-control" accept="image/*" onchange="handleImageUpload(${sIdx}, ${eIdx}, this)"></div>`; 
                    } 
                    else if (elem.type === 'columns') {
                        const designOpts = ['accent', 'plain', 'minimal', 'numbered'].map(d => `<option value="${d}" ${(elem.design || 'accent') === d ? 'selected' : ''}>${d.toUpperCase()}</option>`).join('');
                        const colRows = (elem.cols || []).map((c, cIdx) => `
                            <div class="element-box">
                                <div class="element-header"><span>KOLOM ${cIdx + 1}</span><button class="btn btn-danger" onclick="removeColumnItem(${sIdx}, ${eIdx}, ${cIdx})">✕</button></div>

                    else if (elem.type === 'social') {
                        const mRows = (elem.metrics || []).map((m, mIdx) => `

                                <div class="form-group"><label>Nama Variable</label><input type="text" class="form-control" value="${m.varName || ''}" oninput="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'varName', this.value)"></div>
                                <div class="two-col-form">
                                    <div class="form-group"><label>Nilai</label><input type="text" class="form-control" value="${m.value || ''}" oninput="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'value', this.value)"></div>
                                    <div class="form-group"><label>Arah Tren</label>
                                        <select class="form-control" onchange="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'dir', this.value)">

                                            <option value="down" ${m.dir === 'down' ? 'selected' : ''}>Turun (Merah ▼)</option>
                                            <option value="flat" ${m.dir === 'flat' ? 'selected' : ''}>Tetap (—)</option>
                                        </select>
                                    </div>
                                </div>
                                <div class="form-group"><label>Persentase Perubahan</label><input type="text" class="form-control" value="${m.deltaPercent || ''}" oninput="updateSocialMetric(${sIdx}, ${eIdx}, ${mIdx}, 'deltaPercent', this.value)"></div>
                            </div>`).join('');

                        fields += `
                        <div class="form-group"><label>Judul Section Statistik</label><input type="text" class="form-control" value="${elem.sectionTitle || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'sectionTitle', this.value)"></div>
                        <div class="form-group"><label>Periode Waktu</label><input type="text" class="form-control" value="${elem.period || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'period', this.value)"></div>
                        ${mRows}<button class="btn" onclick="addSocialMetric(${sIdx}, ${eIdx})">+ Tambah Metrik Social</button>`;
                    }
                    else if (elem.type === 'breakdown') {
                        const bRows = (elem.items || []).map((it, iIdx) => `

                                <div class="element-header"><span>ITEM ${iIdx + 1}</span><button class="btn btn-danger" onclick="removeBreakdownItem(${sIdx}, ${eIdx}, ${iIdx})">✕</button></div>

                                    <div class="form-group"><label>Label</label><input type="text" class="form-control" value="${it.label || ''}" oninput="updateBreakdownItem(${sIdx}, ${eIdx}, ${iIdx}, 'label', this.value)"></div>
                                    <div class="form-group"><label>Persen (%)</label><input type="text" class="form-control" value="${it.percent || ''}" oninput="updateBreakdownItem(${sIdx}, ${eIdx}, ${iIdx}, 'percent', this.value)"></div>
                                </div>
                            </div>`).join('');
                        fields += `<div class="form-group"><label>Judul Wawasan</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>${bRows}<button class="btn" onclick="addBreakdownItem(${sIdx}, ${eIdx})">+ Tambah Baris Demografi</button>`;
                    }
                    else if (elem.type === 'kpi') {
                        fields += `<div class="form-group"><label>Metrik KPI</label><div>${(elem.items || []).map((k, kIdx) => `<div style="display:flex; gap:4px; margin-bottom:4px;"><input type="text" class="form-control" placeholder="Nilai" value="${k.val || ''}" oninput="updateKpiItem(${sIdx}, ${eIdx}, ${kIdx}, 'val', this.value)"><input type="text" class="form-control" placeholder="Label" value="${k.lbl || ''}" oninput="updateKpiItem(${sIdx}, ${eIdx}, ${kIdx}, 'lbl', this.value)"><button class="btn btn-danger" onclick="deleteKpiItem(${sIdx}, ${eIdx}, ${kIdx})">✕</button></div>`).join('')}</div><button class="btn" onclick="addKpiItem(${sIdx}, ${eIdx})">+ Tambah Metrik</button></div>`;

                    else if (elem.type === 'chart') {

                                <select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'chartType', this.value)">

                    else if (elem.type === 'wawasan') {

                        <div class="form-group"><label>Kesimpulan Analisis</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'content', this.value)">${elem.content || ''}</textarea></div>`;

                    elementsHTML += `<div class="element-box"><div class="element-header"><span>ELEM ${eIdx + 1}: ${ELEM_LABELS[elem.type] || elem.type}</span><button class="btn btn-danger" onclick="deleteElem(${sIdx}, ${eIdx})">Hapus</button></div>${fields}</div>`;
                });

                card.innerHTML = `<div class="slide-accordion-header"><strong style="font-size:12px; color:var(--accent-gold);">SLIDE ${sIdx + 1}</strong><button class="btn btn-danger" onclick="deleteSlide(${sIdx})">Hapus Slide</button></div>
                <div class="form-group"><label>Footer Left</label><input type="text" class="form-control" value="${slide.footerLeft || ''}" oninput="updateSlideFooter(${sIdx}, this.value)"></div>
                ${elementsHTML}
                <div style="margin-top:10px;"><label style="font-size:9px; color:var(--text-muted); font-weight:800;">+ TAMBAH ELEMEN KONTEN & ANALISIS:</label>

                    <button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'cover')">+ COVER</button>
                    <button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'header')">+ HEADER</button>
                    <button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'text')">+ TEKS</button>
                    <button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'image')">+ GAMBAR</button>
                    <button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'columns')">+ KOLOM</button>
                    <button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'kpi')">+ KPI</button>
                    <button class="add-elem-btn btn-ana" onclick="addElementToSlide(${sIdx}, 'chart')">+ GRAFIK</button>
                    <button class="add-elem-btn btn-ana" onclick="addElementToSlide(${sIdx}, 'social')">+ STATS SOSIAL</button>
                    <button class="add-elem-btn btn-ana" onclick="addElementToSlide(${sIdx}, 'comparison')">+ PERBANDINGAN</button>
                    <button class="add-elem-btn btn-ana" onclick="addElementToSlide(${sIdx}, 'breakdown')">+ DEMOGRAFI</button>
                    <button class="add-elem-btn btn-ana" onclick="addElementToSlide(${sIdx}, 'wawasan')" style="grid-column: span 2;">+ ANALISIS DINAMIS</button>
                </div></div>`;
                wrapper.appendChild(card);
            });
            renderPreview();
        }

        function getRadiusCss(style) { return style === 'rounded' ? '6px' : '0px'; }
        function handleImageUpload(sIdx, eIdx, input) { if (input.files && input.files[0]) { const reader = new FileReader(); reader.onload = function(e) { slidesData[sIdx].elements[eIdx].imgData = e.target.result; renderPreview(); }; reader.readAsDataURL(input.files[0]); } }

        /* =========================================================
           LIVE CANVAS PREVIEW RENDERER
           ========================================================= */
        function renderPreview() {
            chartInstances.forEach(c => c.destroy()); chartInstances = [];
            const container = document.getElementById('deck-container'); container.innerHTML = '';
            let chartsToRender = [];

            const globalVars = computeGlobalVariables();

            slidesData.forEach((slide, sIdx) => {
                const slideEl = document.createElement('div'); slideEl.className = 'slide';
                const slideBody = document.createElement('div');
                slideBody.className = `slide-body ${slide.elements.some(e => e.type === 'cover') ? 'has-cover' : ''}`;

                slide.elements.forEach((elem, eIdx) => {
                    const elemWrapper = document.createElement('div');
                    
                    const wVal = elem.width || 'full';
                    const wClass = wVal === 'half' ? 'elem-width-half' : (wVal === 'third' ? 'elem-width-third' : (wVal === 'twothird' ? 'elem-width-twothird' : 'elem-width-full'));
                    elemWrapper.className = `draggable-element ${wClass}`; 

                    const br = getRadiusCss(elem.shapeStyle);
                    const pill = elem.brand ? `<span class="elem-brand-pill" style="border-radius: ${br};">${elem.brand}</span>` : '';
                    let p = '';

                    if (elem.type === 'cover') {
                        p = `<div style="width: 100%; padding: 20px 0;"><div style="display:flex; gap:6px; margin-bottom:12px;">${pill}${elem.tag ? `<span class="elem-tag">${elem.tag}</span>` : ''}</div><div class="elem-title" style="font-size:36px; margin: 10px 0;">${elem.title || ''}</div><p style="font-size:14px; color:var(--accent-gold);">${elem.subtitle || ''}</p></div>`;
                    }
                    else if (elem.type === 'header') {
                        p = `<div style="border-bottom: 1px solid var(--border-obsidian); padding-bottom: 8px;"><div style="display:flex; gap:6px;">${pill}<span class="elem-tag">${elem.tag || ''}</span></div><div class="elem-title" style="margin-top:4px;">${elem.title || ''}</div></div>`;
                    }
                    else if (elem.type === 'text') {
                        const parsedContent = renderVarsInText(elem.content || '', globalVars);
                        const styleCls = elem.style === 'hero' ? 't-hero' : (elem.style === 'judul' ? 't-judul' : (elem.style === 'subjudul' ? 't-subjudul' : 't-paragraf'));
                        const textHTML = `<div class="${styleCls}">${parsedContent}</div>`;
                        p = elem.card ? `<div class="text-card-wrap" style="border-radius:${br};">${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}${textHTML}</div>` : `<div>${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}${textHTML}</div>`;
                    }
                    else if (elem.type === 'image') {
                        p = `<div>${pill ? `<div style="margin-bottom:4px;">${pill}</div>` : ''}${elem.imgData ? `<img src="${elem.imgData}" class="img-preview-box" style="border-radius: ${br}; width: 100%;">` : '<div style="border: 1px dashed var(--border-obsidian); padding: 20px; text-align: center;">[ Gambar / Logo Kosong ]</div>'}</div>`;
                    }
                    else if (elem.type === 'columns') {
                        const design = elem.design || 'accent';
                        const colHtml = (elem.cols || []).map((c, cIdx) => {
                            const parsedT = renderVarsInText(c.text || '', globalVars);
                            if (design === 'numbered') {
                                return `<div class="col-item col-card--numbered" style="border-radius:${br};"><div class="col-num-badge">${cIdx + 1}</div><div class="elem-tag">${c.title || ''}</div><p class="t-paragraf">${parsedT}</p></div>`;
                            }
                            const cardCls = design === 'plain' ? 'col-card--plain' : (design === 'minimal' ? 'col-card--minimal' : 'col-card--accent');
                            return `<div class="col-item ${cardCls}" style="border-radius:${br};"><div class="elem-tag">${c.title || ''}</div><p class="t-paragraf">${parsedT}</p></div>`;
                        }).join('');
                        p = `<div style="width:100%;">${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<div class="col-wrap">${colHtml}</div></div>`;
                    }
                    else if (elem.type === 'comparison') {
                        const prev = parseFloat(elem.prevVal) || 0;
                        const curr = parseFloat(elem.currVal) || 0;
                        const diff = curr - prev;
                        const pct = prev !== 0 ? Math.abs((diff / prev) * 100).toFixed(1) : (curr !== 0 ? '100' : '0');
                        const dir = diff > 0 ? 'up' : (diff < 0 ? 'down' : 'flat');
                        const arrow = dir === 'up' ? '▲' : (dir === 'down' ? '▼' : '—');
                        const badgeCls = dir === 'up' ? 'var-up' : (dir === 'down' ? 'var-down' : 'var-flat');

                        p = `<div class="compare-box" style="border-radius:${br};">
                            <div><div class="elem-tag">${elem.label || 'PERBANDINGAN DATA'}</div><div class="compare-num">${elem.currVal || '0'} <span style="font-size:11px; color:var(--text-muted);">${elem.unit || ''}</span></div></div>
                            <div style="text-align:right;"><span class="var-badge ${badgeCls}">${arrow} ${pct}%</span><div style="font-size:8px; color:var(--text-muted); margin-top:4px;">Sblm: ${elem.prevVal || '0'}</div></div>
                        </div>`;
                    }
                    else if (elem.type === 'social') {
                        const mCards = (elem.metrics || []).map(m => {
                            const arrow = m.dir === 'up' ? '▲' : (m.dir === 'down' ? '▼' : '—');
                            const badgeCls = m.dir === 'up' ? 'var-up' : (m.dir === 'down' ? 'var-down' : 'var-flat');
                            return `<div class="social-card" style="border-radius:${br};">
                                <div style="font-size:8px; color:var(--text-muted); font-weight:800; text-transform:uppercase;">${m.label || 'Metrik'}</div>
                                <div class="social-card-val">${m.value || '0'}</div>
                                ${m.deltaPercent ? `<span class="var-badge ${badgeCls}">${arrow} ${m.deltaPercent}</span>` : ''}
                            </div>`;
                        }).join('');

                        p = `<div style="width:100%;">${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}
                            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;"><span class="elem-tag">${elem.sectionTitle || 'ANALISIS SOSIAL'}</span><span style="font-size:8px; color:var(--accent-gold); font-weight:700;">${elem.period || ''}</span></div>
                            <div class="social-grid">${mCards}</div>
                        </div>`;
                    }
                    else if (elem.type === 'breakdown') {
                        const bRows = (elem.items || []).map(it => `
                            <div class="breakdown-row"><span>${it.label || ''}</span><span style="color:var(--accent-gold); font-weight:800;">${it.percent || 0}%</span></div>
                        `).join('');
                        p = `<div class="text-card-wrap" style="border-radius:${br};"><div class="elem-tag">${elem.title || 'WAWASAN PENONTON'}</div><div style="margin-top:6px;">${bRows}</div></div>`;
                    }
                    else if (elem.type === 'kpi') {
                        p = `<div>${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<div class="kpi-grid">${(elem.items || []).map(k => `<div class="kpi-card" style="border-radius: ${br};"><div class="kpi-value">${k.val || '0'}</div><div style="font-size: 8px; color: var(--text-muted); text-transform: uppercase;">${k.lbl || ''}</div></div>`).join('')}</div></div>`;
                    }
                    else if (elem.type === 'wawasan') {
                        let varsHTML = '';
                        if (elem.vars && elem.vars.length > 0) {
                            varsHTML = `<div style="display:flex; flex-wrap:wrap; gap:6px; border-bottom:1px dashed rgba(196,154,87,0.3); padding-bottom:6px;">${elem.vars.map(v => `<div style="background:rgba(0,0,0,0.5); padding:4px 8px; border-radius:4px; font-size:9px;"><span style="color:var(--text-muted);">${v.k}:</span> <strong style="color:var(--accent-gold);">${v.v}</strong></div>`).join('')}</div>`;
                        }
                        p = `<div>${pill ? `<div style="margin-bottom:4px;">${pill}</div>` : ''}<div class="wawasan-box" style="border-radius: ${br};"><strong style="color:var(--accent-gold);">💡 ANALISIS DATA:</strong>${varsHTML}<div>${elem.content || ''}</div></div></div>`;
                    }
                    else if (elem.type === 'chart') {
                        const chartId = `chart-${sIdx}-${eIdx}`;
                        p = `<div style="display:flex; flex-direction:column; height:100%; width:100%;">${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}
                            <div style="background:var(--card-obsidian); padding:12px; border-radius:${br}; border:1px solid var(--border-obsidian); flex:1; min-height:220px; width:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px;">
                                <div style="position:relative; width:100%; flex:1; min-height:160px;">
                                    <canvas id="${chartId}"></canvas>
                                </div>
                                ${(elem.title || elem.subtitle) ? `
                                    <div style="text-align:center; width:100%; border-top:1px dashed var(--border-obsidian); padding-top:6px; margin-top:2px;">
                                        ${elem.title ? `<div style="font-size:11px; font-weight:800; color:var(--text-white); letter-spacing:0.5px; text-transform:uppercase;">${elem.title}</div>` : ''}
                                        ${elem.subtitle ? `<div style="font-size:9px; color:var(--accent-gold); font-weight:600; margin-top:1px;">${elem.subtitle}</div>` : ''}
                                    </div>
                                ` : ''}
                            </div></div>`;
                        chartsToRender.push({ id: chartId, type: elem.chartType || 'bar', labels: elem.labels || 'A,B,C', data: elem.data || '10,20,30' });
                    }

                    elemWrapper.innerHTML = p; slideBody.appendChild(elemWrapper);
                });

                slideEl.appendChild(slideBody);
                slideEl.innerHTML += `<div class="slide-footer"><span>${slide.footerLeft || ''}</span><span class="slide-num">${sIdx + 1 < 10 ? '0' + (sIdx + 1) : sIdx + 1}</span></div>`;
                container.appendChild(slideEl);
            });

            /* =========================================================
               CHART ENGINE DYNAMICAL OPACITY & CENTER BADGE PLUGINS
               ========================================================= */
            setTimeout(() => {
                chartsToRender.forEach(c => {
                    const canvas = document.getElementById(c.id);
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        const dataNums = c.data.split(',').map(Number);
                        const maxVal = Math.max(...dataNums);

                        // Opsi Opacity Dinamis: Data terbanyak dapat Opacity Penuh (100%), sisanya proporsional
                        const bgColors = dataNums.map(v => {
                            if (maxVal === 0) return 'rgba(196, 154, 87, 0.5)';
                            const ratio = v / maxVal;
                            const opacity = Math.max(0.35, ratio).toFixed(2);
                            return `rgba(196, 154, 87, ${opacity})`;
                        });

                        const borderColors = dataNums.map(v => v === maxVal ? '#FFFFFF' : '#C49A57');
                        const borderWidths = dataNums.map(v => v === maxVal ? 2 : 1);

                        // Custom Plugin untuk Menampilkan Sekat & Badge Nilai/Persentase di Tengah
                        const centerLabelPlugin = {
                            id: 'malevinCenterLabels',
                            afterDatasetsDraw(chart) {
                                const { ctx } = chart;
                                chart.data.datasets.forEach((dataset, datasetIdx) => {
                                    const meta = chart.getDatasetMeta(datasetIdx);
                                    meta.data.forEach((element, index) => {
                                        const val = dataset.data[index];
                                        if (val === undefined || val === null) return;

                                        let text = val.toLocaleString('id-ID');
                                        if (['pie', 'doughnut'].includes(chart.config.type)) {
                                            const total = dataset.data.reduce((a, b) => Number(a) + Number(b), 0);
                                            const pct = total > 0 ? ((val / total) * 100).toFixed(1) + '%' : '0%';
                                            text = `${val} (${pct})`;
                                        }

                                        const pos = element.tooltipPosition();
                                        ctx.save();
                                        ctx.font = 'bold 9px var(--font-main, sans-serif)';
                                        ctx.textAlign = 'center';
                                        ctx.textBaseline = 'middle';

                                        const textWidth = ctx.measureText(text).width;
                                        const boxW = textWidth + 10;
                                        const boxH = 15;

                                        // Gambar Kotak / Badge Sekat Bergaris
                                        ctx.fillStyle = 'rgba(10, 11, 10, 0.85)';
                                        ctx.strokeStyle = '#C49A57';
                                        ctx.lineWidth = 1;

                                        if (ctx.roundRect) {
                                            ctx.beginPath();
                                            ctx.roundRect(pos.x - boxW / 2, pos.y - boxH / 2, boxW, boxH, 3);
                                            ctx.fill();
                                            ctx.stroke();
                                        } else {
                                            ctx.fillRect(pos.x - boxW / 2, pos.y - boxH / 2, boxW, boxH);
                                            ctx.strokeRect(pos.x - boxW / 2, pos.y - boxH / 2, boxW, boxH);
                                        }

                                        ctx.fillStyle = '#FEFEFE';
                                        ctx.fillText(text, pos.x, pos.y);
                                        ctx.restore();
                                    });
                                });
                            }
                        };

                        const newChart = new Chart(ctx, {
                            type: c.type,
                            data: {
                                labels: c.labels.split(','),
                                datasets: [{
                                    label: 'Data',
                                    data: dataNums,
                                    backgroundColor: bgColors,
                                    borderColor: borderColors,
                                    borderWidth: borderWidths
                                }]
                            },
                            plugins: [centerLabelPlugin],
                            options: {
                                responsive: true,
                                maintainAspectRatio: false,
                                color: '#C0C2C0',
                                plugins: {
                                    legend: { display: ['pie', 'doughnut'].includes(c.type), labels: { color: '#C0C2C0', font: { size: 9 } } }
                                },
                                scales: !['pie', 'doughnut'].includes(c.type) ? {
                                    y: { beginAtZero: true, grid: { color: '#242624' }, ticks: { color: '#808280', font: { size: 9 } } },
                                    x: { grid: { color: '#242624' }, ticks: { color: '#808280', font: { size: 9 } } }
                                } : {}
                            }
                        });
                        chartInstances.push(newChart);
                    }
                });
            }, 50);
        }

        /* =========================================================
           FORM ACTIONS & DYNAMIC LIST MANAGEMENT
           ========================================================= */
        function updateElem(sIdx, eIdx, k, v) { slidesData[sIdx].elements[eIdx][k] = v; renderPreview(); }
        function updateSlideFooter(sIdx, v) { slidesData[sIdx].footerLeft = v; renderPreview(); }

        function addColumnItem(sIdx, eIdx) { if (!slidesData[sIdx].elements[eIdx].cols) slidesData[sIdx].elements[eIdx].cols = []; slidesData[sIdx].elements[eIdx].cols.push({ title: 'Kolom Baru', text: 'Isi poin...' }); renderForms(); }
        function updateColumnItem(sIdx, eIdx, cIdx, k, v) { slidesData[sIdx].elements[eIdx].cols[cIdx][k] = v; renderPreview(); }
        function removeColumnItem(sIdx, eIdx, cIdx) { slidesData[sIdx].elements[eIdx].cols.splice(cIdx, 1); renderForms(); }

        function addSocialMetric(sIdx, eIdx) { if (!slidesData[sIdx].elements[eIdx].metrics) slidesData[sIdx].elements[eIdx].metrics = []; slidesData[sIdx].elements[eIdx].metrics.push({ label: 'Metrik Baru', value: '0', deltaPercent: '+0%', dir: 'up', varName: '' }); renderForms(); }
        function updateSocialMetric(sIdx, eIdx, mIdx, k, v) { slidesData[sIdx].elements[eIdx].metrics[mIdx][k] = v; renderPreview(); }
        function removeSocialMetric(sIdx, eIdx, mIdx) { slidesData[sIdx].elements[eIdx].metrics.splice(mIdx, 1); renderForms(); }

        function addBreakdownItem(sIdx, eIdx) { if (!slidesData[sIdx].elements[eIdx].items) slidesData[sIdx].elements[eIdx].items = []; slidesData[sIdx].elements[eIdx].items.push({ label: 'Kategori', percent: '50' }); renderForms(); }
        function updateBreakdownItem(sIdx, eIdx, iIdx, k, v) { slidesData[sIdx].elements[eIdx].items[iIdx][k] = v; renderPreview(); }
        function removeBreakdownItem(sIdx, eIdx, iIdx) { slidesData[sIdx].elements[eIdx].items.splice(iIdx, 1); renderForms(); }

        function addKpiItem(sIdx, eIdx) { if (!slidesData[sIdx].elements[eIdx].items) slidesData[sIdx].elements[eIdx].items = []; slidesData[sIdx].elements[eIdx].items.push({ val: '0', lbl: 'New' }); renderForms(); }
        function updateKpiItem(sIdx, eIdx, kIdx, k, v) { slidesData[sIdx].elements[eIdx].items[kIdx][k] = v; renderPreview(); }
        function deleteKpiItem(sIdx, eIdx, kIdx) { slidesData[sIdx].elements[eIdx].items.splice(kIdx, 1); renderForms(); }

        function addWawasanVar(sIdx, eIdx) { if (!slidesData[sIdx].elements[eIdx].vars) slidesData[sIdx].elements[eIdx].vars = []; slidesData[sIdx].elements[eIdx].vars.push({ k: 'Kategori', v: 'Nilai' }); renderForms(); }
        function updateWawasanVar(sIdx, eIdx, vIdx, k, val) { slidesData[sIdx].elements[eIdx].vars[vIdx][k] = val; renderPreview(); }
        function deleteWawasanVar(sIdx, eIdx, vIdx) { slidesData[sIdx].elements[eIdx].vars.splice(vIdx, 1); renderForms(); }

        function addElementToSlide(sIdx, type) { 
            const ne = { type, width: 'full', brand: '', shapeStyle: 'rounded' }; 
            if (type === 'columns') { ne.design = 'accent'; ne.cols = [{ title: 'Poin 1', text: 'Detail...' }, { title: 'Poin 2', text: 'Detail...' }]; }
            else if (type === 'comparison') { ne.label = 'PERBANDINGAN DATA'; ne.prevVal = '1000'; ne.currVal = '1500'; ne.unit = 'Views'; ne.varName = 'perbandingan'; }
            else if (type === 'social') { ne.sectionTitle = 'IKHTISAR KINERJA'; ne.period = 'Bulan Ini'; ne.metrics = [{ label: 'Tayangan (Views)', value: '100,000', deltaPercent: '10%', dir: 'up', varName: 'views' }]; }
            else if (type === 'breakdown') { ne.title = 'WAWASAN PENONTON'; ne.items = [{ label: 'Perempuan', percent: '75' }]; }
            else if (type === 'wawasan') { ne.vars = [{ k: 'Korelasi', v: 'Positif' }]; ne.content = 'Tulis wawasan...'; }
            else if (type === 'chart') { ne.chartType = 'bar'; ne.labels = 'A,B,C'; ne.data = '10,20,30'; ne.title = 'JUDUL GRAFIK'; ne.subtitle = 'Sub-judul Keterangan'; }
            slidesData[sIdx].elements.push(ne); renderForms(); 
        }

        function deleteElem(sIdx, eIdx) { slidesData[sIdx].elements.splice(eIdx, 1); renderForms(); }
        function addSlide() { slidesData.push({ id: Date.now(), footerLeft: `${currentAccount.toUpperCase()} TEAM`, elements: [{ type: 'header', width: 'full', title: 'SLIDE BARU' }] }); renderForms(); }
        function deleteSlide(sIdx) { if (slidesData.length > 1) { slidesData.splice(sIdx, 1); renderForms(); } }

        /* =========================================================
           PDF EXPORT & IMPORT ENGINE
           ========================================================= */
        async function downloadPDF() {
            const btn = document.getElementById('downloadBtn'); const ogText = btn.innerText; btn.innerText = 'Menyimpan...'; btn.disabled = true;
            setMode('preview'); await new Promise(r => setTimeout(r, 500)); 

            try {
                const { jsPDF } = window.jspdf;
                let pdf = null;
                const pdfWidth = 850;
                const slides = document.querySelectorAll('.slide');

                for (let i = 0; i < slides.length; i++) {
                    const slide = slides[i];
                    const isolatedBox = document.createElement('div');
                    isolatedBox.style.position = 'absolute'; isolatedBox.style.left = '-9999px'; isolatedBox.style.top = '0'; isolatedBox.style.width = '850px';
                    
                    const clone = slide.cloneNode(true);
                    const origCanvases = slide.querySelectorAll('canvas');
                    const clonedCanvases = clone.querySelectorAll('canvas');
                    origCanvases.forEach((orig, idx) => clonedCanvases[idx].getContext('2d').drawImage(orig, 0, 0));

                    isolatedBox.appendChild(clone); document.body.appendChild(isolatedBox);
                    const actualHeight = Math.max(clone.offsetHeight, clone.scrollHeight);

                    const canvas = await html2canvas(clone, { scale: 2, useCORS: true, backgroundColor: '#0A0B0A', width: 850, height: actualHeight });
                    document.body.removeChild(isolatedBox);

                    const imgData = canvas.toDataURL('image/jpeg', 0.95);
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;
                    const orientation = pdfWidth > pdfHeight ? 'landscape' : 'portrait';

                    if (i === 0) pdf = new jsPDF({ orientation, unit: 'px', format: [pdfWidth, pdfHeight] });
                    else pdf.addPage([pdfWidth, pdfHeight], orientation);

                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                }

                const stateData = encodeURIComponent(JSON.stringify(slidesData));
                pdf.setProperties({
                    title: 'Malevin Deck Export',
                    subject: 'MALEVIN_STATE:' + stateData,
                    creator: 'Malevin Deck Studio'
                });

                pdf.save(`${currentAccount.replace(/\s+/g, '_')}_Deck.pdf`);
            } catch (error) {
                console.error(error); alert("Terjadi kesalahan saat meng-export PDF.");
            } finally { btn.innerText = ogText; btn.disabled = false; }
        }

        async function handlePDFImport(event) {
            const file = event.target.files[0];
            if (!file) return;

            const btn = document.getElementById('importPdfBtn');
            const ogText = btn.innerText;
            btn.innerText = 'Membaca Data Asli...'; btn.disabled = true;

            try {
                const fileReader = new FileReader();
                fileReader.onload = async function() {
                    const typedarray = new Uint8Array(this.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    const metadata = await pdf.getMetadata();

                    if (metadata && metadata.info && metadata.info.Subject && metadata.info.Subject.startsWith('MALEVIN_STATE:')) {
                        const rawState = metadata.info.Subject.replace('MALEVIN_STATE:', '');
                        slidesData = JSON.parse(decodeURIComponent(rawState));
                        renderForms();
                        alert("Berhasil! Seluruh data slide, grafik, dan variabel telah dikembalikan.");
                    } else {
                        alert("Gagal Import: PDF ini bukan berasal dari aplikasi ini atau tidak memiliki data state.");
                    }
                    btn.innerText = ogText; btn.disabled = false;
                    event.target.value = ''; 
                };
                fileReader.readAsArrayBuffer(file);
            } catch (error) {
                console.error(error); alert("Kesalahan saat membaca PDF."); btn.innerText = ogText; btn.disabled = false;
            }
        }

        function setMode(mode) {
            const ep = document.getElementById('editorPanel'), pp = document.getElementById('previewPanel'), te = document.getElementById('tabEditBtn'), tp = document.getElementById('tabPreviewBtn');
            if (mode === 'preview') { ep.style.display = 'none'; pp.style.display = 'flex'; te.classList.remove('active'); tp.classList.add('active'); } 
            else { ep.style.display = 'flex'; pp.style.display = 'none'; tp.classList.remove('active'); te.classList.add('active'); }
        }

        renderForms(); setMode('edit');
    </script>
