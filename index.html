<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Malevin — Canvas & Vector PDF Deck Studio</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <style>
        :root {
            --bg-obsidian: #0A0B0A;
            --surface-dark: #121312;
            --card-obsidian: #161816;
            --border-obsidian: #242624;
            --accent-gold: #C49A57;
            --text-white: #FEFEFE;
            --text-muted: #808280;
            --font-main: 'Helvetica Neue', -apple-system, BlinkMacSystemFont, Arial, sans-serif;
        }

        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-obsidian);
            color: var(--text-white);
            font-family: var(--font-main);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            -webkit-font-smoothing: antialiased;
        }

        .topbar {
            background-color: var(--surface-dark);
            border-bottom: 1px solid var(--border-obsidian);
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
            flex-wrap: wrap;
            gap: 10px;
        }

        .brand-title { font-size: 14px; font-weight: 800; letter-spacing: 2px; display: flex; align-items: center; gap: 10px; }
        .brand-badge { background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%); color: #0A0B0A; font-size: 9px; padding: 2px 6px; border-radius: 2px; font-weight: 800; letter-spacing: 1px; }
        .topbar-actions { display: flex; gap: 10px; align-items: center; }

        .mode-tabs { display: flex; gap: 4px; background: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 6px; padding: 3px; }
        .mode-tab-btn { background: transparent; border: none; color: var(--text-muted); padding: 6px 14px; font-size: 10px; font-weight: 800; letter-spacing: 1px; text-transform: uppercase; border-radius: 4px; cursor: pointer; transition: all 0.2s ease; }
        .mode-tab-btn.active { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; }
        .mode-tab-btn:not(.active):hover { color: var(--accent-gold); }

        .app-container { display: flex; flex: 1; height: calc(100vh - 53px); overflow: hidden; }

        /* EDITOR PANEL */
        .editor-panel { width: 100%; max-width: 650px; margin: 0 auto; background-color: var(--surface-dark); display: flex; flex-direction: column; overflow-y: auto; padding: 20px; gap: 16px; }
        .slide-accordion { background-color: var(--card-obsidian); border: 1px solid var(--border-obsidian); border-radius: 6px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
        .slide-accordion-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border-obsidian); padding-bottom: 8px; }
        .section-label-btn { font-size: 9px; font-weight: 800; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 6px; margin-bottom: 4px; }
        .btn-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
        
        .add-elem-btn { background-color: var(--surface-dark); color: var(--text-white); border: 1px solid var(--border-obsidian); font-size: 9px; padding: 6px 4px; border-radius: 4px; cursor: pointer; font-weight: 700; letter-spacing: 0.5px; text-align: center; }
        .add-elem-btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }

        .element-box { background-color: var(--bg-obsidian); border: 1px solid var(--border-obsidian); border-left: 3px solid var(--accent-gold); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 8px; }
        .element-header { display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 700; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; }
        
        .form-group { display: flex; flex-direction: column; gap: 4px; }
        .form-group label { font-size: 9px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 700; }
        .form-control { background-color: var(--surface-dark); border: 1px solid var(--border-obsidian); color: var(--text-white); padding: 7px 9px; border-radius: 4px; font-size: 11px; font-family: inherit; width: 100%; }
        .form-control:focus { outline: none; border-color: var(--accent-gold); }
        textarea.form-control { resize: vertical; min-height: 50px; line-height: 1.4; }

        .btn { background-color: var(--card-obsidian); color: var(--text-white); border: 1px solid var(--border-obsidian); padding: 6px 12px; border-radius: 4px; font-size: 10px; font-weight: 700; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; }
        .btn:hover { border-color: var(--accent-gold); color: var(--accent-gold); }
        .btn-gold { background: linear-gradient(135deg, #C49A57 0%, #A37E43 100%); color: #0A0B0A; border: none; font-weight: 800; }
        .btn-danger { background-color: transparent; color: #E55353; border: 1px solid rgba(229, 83, 83, 0.3); padding: 3px 8px; font-size: 9px; }

        /* LIVE PREVIEW CANVAS */
        .preview-panel {
            flex: 1;
            background-color: #050505;
            overflow: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #deck-container {
            display: flex;
            flex-direction: column;
            gap: 30px;
            width: 850px;
            margin: 0 auto;
        }

        /* SLIDE AUTO HEIGHT + FIX WIDTH */
        .slide {
            width: 850px !important;
            min-height: 478px;
            height: auto;
            background-color: var(--bg-obsidian);
            border: 1px solid var(--border-obsidian);
            padding: 28px 36px 20px 36px;
            position: relative;
            box-shadow: 0 15px 40px rgba(0,0,0,0.9);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-sizing: border-box;
            gap: 20px;
            flex-shrink: 0;
            overflow: hidden;
        }

        .slide::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 3px;
            background: linear-gradient(90deg, #C49A57 0%, rgba(196,154,87,0.2) 100%);
        }

        .corner-accent { position: absolute; width: 10px; height: 10px; border-color: var(--accent-gold); border-style: solid; opacity: 0.3; pointer-events: none; }
        .corner-tl { top: 10px; left: 10px; border-width: 1px 0 0 1px; }
        .corner-br { bottom: 10px; right: 10px; border-width: 0 1px 1px 0; }

        .slide-body { flex: 1; display: flex; flex-direction: column; gap: 12px; justify-content: flex-start; margin: 10px 0; position: relative; width: 100%; }
        .slide-body.has-cover { justify-content: center; align-items: flex-start; }

        /* DRAGGABLE STYLING */
        .draggable-element { position: relative; cursor: grab; user-select: none; transition: transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; border: 1px dashed transparent; padding: 4px; border-radius: 4px; width: 100%; }
        .draggable-element:hover { border-color: rgba(196, 154, 87, 0.5); background: rgba(196, 154, 87, 0.02); }
        .draggable-element.dragging { opacity: 0.4; cursor: grabbing; border-color: var(--accent-gold); }
        .snap-guide-line { position: absolute; left: 0; right: 0; height: 1px; background-color: var(--accent-gold); box-shadow: 0 0 8px var(--accent-gold); z-index: 10; pointer-events: none; display: none; }
        .drag-drop-target { border-top: 2px solid var(--accent-gold) !important; box-shadow: 0 -4px 10px rgba(196, 154, 87, 0.3); }

        /* ELEMENT STYLING */
        .elem-brand-pill { background: linear-gradient(135deg, #C49A57 0%, #8A6831 100%); color: #0A0B0A; font-size: 8px; font-weight: 800; padding: 3px 8px; letter-spacing: 1px; text-transform: uppercase; display: inline-block; }
        .elem-tag { font-size: 9px; color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; font-weight: 700; display: inline-block; }
        .elem-title { font-size: 20px; font-weight: 800; color: var(--text-white); text-transform: uppercase; letter-spacing: 1px; line-height: 1.2; }
        p.slide-text { color: #C0C2C0; font-size: 11px; line-height: 1.5; white-space: pre-line; }

        .malevin-list { list-style: none; padding-left: 0; display: flex; flex-direction: column; gap: 6px; }
        .malevin-list li { position: relative; padding-left: 16px; font-size: 11px; color: #C0C2C0; }
        .malevin-list li::before { content: '■'; position: absolute; left: 0; top: 0; color: var(--accent-gold); font-size: 8px; }

        /* TABEL PERBAIKAN: Diberi table-layout fixed agar tidak terpotong ke kanan */
        .malevin-table { width: 100%; border-collapse: collapse; font-size: 10px; margin-top: 4px; table-layout: fixed; }
        .malevin-table th { background-color: rgba(196, 154, 87, 0.12); color: var(--accent-gold); text-transform: uppercase; letter-spacing: 1px; padding: 7px 10px; border-bottom: 1px solid var(--accent-gold); text-align: left; font-weight: 700; word-wrap: break-word; }
        .malevin-table td { padding: 6px 10px; border-bottom: 1px solid var(--border-obsidian); color: #D1D1D1; word-wrap: break-word; }

        /* KPI PERBAIKAN: Diberi min-width:0 agar fleksibel pas di 850px */
        .kpi-grid { display: flex; gap: 10px; width: 100%; flex-wrap: nowrap; }
        .kpi-card { flex: 1; min-width: 0; background: rgba(22, 24, 22, 0.8); border: 1px solid var(--border-obsidian); padding: 10px; text-align: center; }
        .kpi-value { font-size: 22px; font-weight: 800; color: var(--accent-gold); letter-spacing: 1px; }
        .kpi-label { font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

        .wawasan-box { background: rgba(196, 154, 87, 0.05); border: 1px solid var(--accent-gold); padding: 10px; font-size: 11px; color: #E0E0E0; }
        .img-preview-box { max-width: 100%; max-height: 250px; object-fit: contain; display: block; }

        .slide-footer { display: flex; justify-content: space-between; align-items: center; border-top: 1px solid var(--border-obsidian); padding-top: 8px; font-size: 8px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1.5px; margin-top: auto; width: 100%; }
        .slide-num { font-size: 11px; font-weight: 800; color: var(--accent-gold); }
    </style>
</head>
<body>

    <div class="topbar">
        <div class="brand-title">
            <span>MALEVIN</span> <span class="brand-badge">DECK STUDIO</span>
        </div>
        <div class="mode-tabs">
            <button class="mode-tab-btn" id="tabEditBtn" onclick="setMode('edit')">Form Editor</button>
            <button class="mode-tab-btn" id="tabPreviewBtn" onclick="setMode('preview')">Canvas Preview</button>
        </div>
        <div class="topbar-actions">
            <button class="btn btn-gold" id="downloadBtn" onclick="downloadPDF()">Download Deck (PDF)</button>
        </div>
    </div>

    <div class="app-container">
        <!-- LEFT PANEL -->
        <div class="editor-panel" id="editorPanel">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <span style="font-size:12px; font-weight:800; color:var(--accent-gold); letter-spacing:1px;">SLIDES CONTROL</span>
                <button class="btn btn-gold" onclick="addSlide()">+ Slide Baru</button>
            </div>
            <div id="forms-wrapper"></div>
        </div>

        <!-- RIGHT PANEL -->
        <div class="preview-panel" id="previewPanel">
            <div id="deck-container"></div>
        </div>
    </div>

    <script>
        const ELEM_LABELS = { cover: 'COVER', header: 'HEADER', text: 'TEKS', list: 'POIN LIST', table: 'TABEL', kpi: 'KPI METRIK', wawasan: 'WAWASAN', image: 'GAMBAR' };

        let slidesData = [
            {
                id: 1, footerLeft: 'PREPARED BY MALEVIN CREATIVE & PRODUCTION TEAM',
                elements: [
                    { type: 'cover', brand: 'MALEVIN OFFICIAL', tag: 'Creative Proposal', title: 'CAMPAIGN DECK 2026', subtitle: 'Dynamic Brand Strategy & Visual Direction', shapeStyle: 'sharp' }
                ]
            },
            {
                id: 2, footerLeft: 'SECTION 01 - PERFORMANCE & DELIVERABLES',
                elements: [
                    { type: 'header', brand: 'MALEVIN IO', tag: 'Section 01', title: 'PERFORMANCE & DELIVERABLES', shapeStyle: 'rounded' },
                    {
                        type: 'kpi', brand: 'METRICS', shapeStyle: 'rounded',
                        items: [ { val: '1.2M+', lbl: 'Monthly Reach' }, { val: '4.8%', lbl: 'Eng. Rate' }, { val: '120+', lbl: 'Video Assets' } ]
                    },
                    {
                        type: 'table', brand: 'CLIENT ID: 40921', shapeStyle: 'sharp',
                        headers: ['Platform', 'Format', 'Target Output'],
                        rows: [ ['TikTok', 'Short Video', '40 Clips / Mo'], ['Instagram', 'Reels & Grid', '20 Posts / Mo'], ['YouTube', 'Shorts', '15 Clips / Mo'] ]
                    },
                    {
                        type: 'list', brand: 'DELIVERABLES', shapeStyle: 'pill',
                        items: [ 'High Quality 4K Video Render & Raw Files', 'Custom Sound Design & Color Grading', 'Full Commercial Rights License' ]
                    }
                ]
            }
        ];

        let draggedItem = null;

        function renderForms() {
            const wrapper = document.getElementById('forms-wrapper');
            wrapper.innerHTML = '';

            slidesData.forEach((slide, sIdx) => {
                const card = document.createElement('div');
                card.className = 'slide-accordion';
                let elementsHTML = '';

                slide.elements.forEach((elem, eIdx) => {
                    const styleShape = elem.shapeStyle || 'sharp';
                    let shapeSelector = `<div class="form-group"><label>Style Sudut</label><select class="form-control" onchange="updateElem(${sIdx}, ${eIdx}, 'shapeStyle', this.value)"><option value="sharp" ${styleShape === 'sharp' ? 'selected' : ''}>Kotak</option><option value="rounded" ${styleShape === 'rounded' ? 'selected' : ''}>Melengkung</option><option value="pill" ${styleShape === 'pill' ? 'selected' : ''}>Kapsul</option></select></div>`;
                    let fields = `<div class="form-group"><label>Brand / ID</label><input type="text" class="form-control" value="${elem.brand || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'brand', this.value)"></div>${shapeSelector}`;

                    if (elem.type === 'cover') { fields += `<div class="form-group"><label>Tag</label><input type="text" class="form-control" value="${elem.tag || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'tag', this.value)"></div><div class="form-group"><label>Judul</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div><div class="form-group"><label>Sub-judul</label><input type="text" class="form-control" value="${elem.subtitle || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'subtitle', this.value)"></div>`; } 
                    else if (elem.type === 'header') { fields += `<div class="form-group"><label>Tag</label><input type="text" class="form-control" value="${elem.tag || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'tag', this.value)"></div><div class="form-group"><label>Judul</label><input type="text" class="form-control" value="${elem.title || ''}" oninput="updateElem(${sIdx}, ${eIdx}, 'title', this.value)"></div>`; } 
                    else if (elem.type === 'text') { fields += `<div class="form-group"><label>Isi Teks</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'content', this.value)">${elem.content || ''}</textarea></div>`; } 
                    else if (elem.type === 'image') { fields += `<div class="form-group"><label>Upload Gambar</label><input type="file" class="form-control" accept="image/*" onchange="handleImageUpload(${sIdx}, ${eIdx}, this)"></div>`; } 
                    else if (elem.type === 'list') { fields += `<div class="form-group"><label>Poin List</label><div>${(elem.items || []).map((item, lIdx) => `<div style="display:flex; gap:4px; margin-bottom:4px;"><input type="text" class="form-control" value="${item}" oninput="updateListItem(${sIdx}, ${eIdx}, ${lIdx}, this.value)"><button class="btn btn-danger" onclick="deleteListItem(${sIdx}, ${eIdx}, ${lIdx})">✕</button></div>`).join('')}</div><button class="btn" onclick="addListItem(${sIdx}, ${eIdx})">+ Tambah Poin</button></div>`; } 
                    else if (elem.type === 'kpi') { fields += `<div class="form-group"><label>KPI Metrik</label><div>${(elem.items || []).map((k, kIdx) => `<div style="display:flex; gap:4px; margin-bottom:4px;"><input type="text" class="form-control" value="${k.val || ''}" oninput="updateKpiItem(${sIdx}, ${eIdx}, ${kIdx}, 'val', this.value)"><input type="text" class="form-control" value="${k.lbl || ''}" oninput="updateKpiItem(${sIdx}, ${eIdx}, ${kIdx}, 'lbl', this.value)"><button class="btn btn-danger" onclick="deleteKpiItem(${sIdx}, ${eIdx}, ${kIdx})">✕</button></div>`).join('')}</div><button class="btn" onclick="addKpiItem(${sIdx}, ${eIdx})">+ Tambah KPI</button></div>`; } 
                    else if (elem.type === 'table') { fields += `<div class="form-group"><label>Kolom Header</label><div>${(elem.headers || []).map((h, cIdx) => `<div style="display:flex; gap:4px; margin-bottom:4px;"><input type="text" class="form-control" value="${h}" oninput="updateTableHeader(${sIdx}, ${eIdx}, ${cIdx}, this.value)"><button class="btn btn-danger" onclick="deleteTableColumn(${sIdx}, ${eIdx}, ${cIdx})">✕</button></div>`).join('')}</div><button class="btn" onclick="addTableColumn(${sIdx}, ${eIdx})">+ Tambah Kolom</button></div><div class="form-group"><label>Baris Data</label><div>${(elem.rows || []).map((row, rIdx) => `<div style="display:flex; gap:4px; margin-bottom:4px;"><div style="display:flex; gap:4px; flex:1;">${(elem.headers || []).map((_, cIdx) => `<input type="text" class="form-control" value="${row[cIdx] || ''}" oninput="updateTableCell(${sIdx}, ${eIdx}, ${rIdx}, ${cIdx}, this.value)">`).join('')}</div><button class="btn btn-danger" onclick="deleteTableRow(${sIdx}, ${eIdx}, ${rIdx})">✕</button></div>`).join('')}</div><button class="btn" onclick="addTableRow(${sIdx}, ${eIdx})">+ Tambah Baris</button></div>`; } 
                    else if (elem.type === 'wawasan') { fields += `<div class="form-group"><label>Catatan</label><textarea class="form-control" oninput="updateElem(${sIdx}, ${eIdx}, 'content', this.value)">${elem.content || ''}</textarea></div>`; }

                    elementsHTML += `<div class="element-box"><div class="element-header"><span>ELEMEN ${eIdx + 1}: ${ELEM_LABELS[elem.type] || elem.type}</span><button class="btn btn-danger" onclick="deleteElem(${sIdx}, ${eIdx})">Hapus</button></div>${fields}</div>`;
                });

                card.innerHTML = `<div class="slide-accordion-header"><strong style="font-size:12px; color:var(--accent-gold);">SLIDE ${sIdx + 1}</strong><button class="btn btn-danger" onclick="deleteSlide(${sIdx})">Hapus Slide</button></div><div class="form-group"><label>Footer</label><input type="text" class="form-control" value="${slide.footerLeft || ''}" oninput="updateSlideFooter(${sIdx}, this.value)"></div>${elementsHTML}<div class="btn-grid"><button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'cover')">+ COVER</button><button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'header')">+ HEADER</button><button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'text')">+ TEKS</button><button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'image')">+ GAMBAR</button><button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'list')">+ POIN LIST</button><button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'table')">+ TABEL</button><button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'kpi')">+ KPI</button><button class="add-elem-btn" onclick="addElementToSlide(${sIdx}, 'wawasan')">+ WAWASAN</button></div>`;
                wrapper.appendChild(card);
            });
            renderPreview();
        }

        function getRadiusCss(style) { return style === 'rounded' ? '6px' : (style === 'pill' ? '20px' : '0px'); }

        function handleImageUpload(sIdx, eIdx, input) {
            if (input.files && input.files[0]) {
                const reader = new FileReader();
                reader.onload = function (e) { slidesData[sIdx].elements[eIdx].imgData = e.target.result; renderPreview(); };
                reader.readAsDataURL(input.files[0]);
            }
        }

        function renderPreview() {
            const container = document.getElementById('deck-container');
            container.innerHTML = '';

            slidesData.forEach((slide, sIdx) => {
                const slideEl = document.createElement('div');
                slideEl.className = 'slide';
                const slideBody = document.createElement('div');
                slideBody.className = `slide-body ${slide.elements.some(e => e.type === 'cover') ? 'has-cover' : ''}`;
                const snapLine = document.createElement('div'); snapLine.className = 'snap-guide-line'; slideBody.appendChild(snapLine);

                slide.elements.forEach((elem, eIdx) => {
                    const elemWrapper = document.createElement('div');
                    elemWrapper.className = 'draggable-element'; elemWrapper.draggable = true; elemWrapper.dataset.sIdx = sIdx; elemWrapper.dataset.eIdx = eIdx;

                    elemWrapper.addEventListener('dragstart', (e) => { draggedItem = { sIdx, eIdx }; elemWrapper.classList.add('dragging'); });
                    elemWrapper.addEventListener('dragend', () => { elemWrapper.classList.remove('dragging'); snapLine.style.display = 'none'; document.querySelectorAll('.draggable-element').forEach(el => el.classList.remove('drag-drop-target')); draggedItem = null; });
                    elemWrapper.addEventListener('dragover', (e) => { e.preventDefault(); if (!draggedItem || draggedItem.sIdx !== sIdx) return; snapLine.style.display = 'block'; snapLine.style.top = `${elemWrapper.offsetTop}px`; elemWrapper.classList.add('drag-drop-target'); });
                    elemWrapper.addEventListener('dragleave', () => elemWrapper.classList.remove('drag-drop-target'));
                    elemWrapper.addEventListener('drop', (e) => { e.preventDefault(); snapLine.style.display = 'none'; elemWrapper.classList.remove('drag-drop-target'); if (draggedItem && (draggedItem.sIdx === sIdx)) { const fIdx = draggedItem.eIdx; if (fIdx !== eIdx) { const mItem = slidesData[sIdx].elements.splice(fIdx, 1)[0]; slidesData[sIdx].elements.splice(eIdx, 0, mItem); renderForms(); } } });

                    const br = getRadiusCss(elem.shapeStyle);
                    const pill = elem.brand ? `<span class="elem-brand-pill" style="border-radius: ${br};">${elem.brand}</span>` : '';
                    let p = '';

                    if (elem.type === 'cover') p = `<div style="width: 100%; padding: 20px 0;"><div style="display:flex; gap:6px; margin-bottom:12px;">${pill}${elem.tag ? `<span class="elem-tag">${elem.tag}</span>` : ''}</div><div class="elem-title" style="font-size:36px; margin: 10px 0;">${elem.title || ''}</div><p style="font-size:14px; color:var(--accent-gold);">${elem.subtitle || ''}</p></div>`;
                    else if (elem.type === 'header') p = `<div style="border-bottom: 1px solid var(--border-obsidian); padding-bottom: 8px;"><div style="display:flex; gap:6px;">${pill}<span class="elem-tag">${elem.tag || ''}</span></div><div class="elem-title" style="margin-top:4px;">${elem.title || ''}</div></div>`;
                    else if (elem.type === 'text') p = `<div>${pill ? `<div style="margin-bottom:4px;">${pill}</div>` : ''}<p class="slide-text">${elem.content || ''}</p></div>`;
                    else if (elem.type === 'image') p = `<div>${pill ? `<div style="margin-bottom:4px;">${pill}</div>` : ''}${elem.imgData ? `<img src="${elem.imgData}" class="img-preview-box" style="border-radius: ${br};">` : '<div style="border: 1px dashed var(--border-obsidian); padding: 20px; text-align: center; color: var(--text-muted); font-size: 10px;">[ Gambar Kosong ]</div>'}</div>`;
                    else if (elem.type === 'list') p = `<div>${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<ul class="malevin-list">${(elem.items || []).map(i => `<li>${i}</li>`).join('')}</ul></div>`;
                    else if (elem.type === 'kpi') p = `<div>${pill ? `<div style="margin-bottom:6px;">${pill}</div>` : ''}<div class="kpi-grid">${(elem.items || []).map(k => `<div class="kpi-card" style="border-radius: ${br};"><div class="kpi-value">${k.val || '0'}</div><div class="kpi-label">${k.lbl || ''}</div></div>`).join('')}</div></div>`;
                    else if (elem.type === 'table') p = `<div>${pill ? `<div style="margin-bottom:4px;">${pill}</div>` : ''}<table class="malevin-table"><thead><tr>${(elem.headers || []).map(h => `<th>${h}</th>`).join('')}</tr></thead><tbody>${(elem.rows || []).map(r => `<tr>${(elem.headers || []).map((_, cIdx) => `<td>${r[cIdx] || ''}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
                    else if (elem.type === 'wawasan') p = `<div>${pill ? `<div style="margin-bottom:4px;">${pill}</div>` : ''}<div class="wawasan-box" style="border-radius: ${br};"><strong style="color:var(--accent-gold); display:block; margin-bottom:4px;">💡 ANALISIS:</strong>${elem.content || ''}</div></div>`;

                    elemWrapper.innerHTML = p; slideBody.appendChild(elemWrapper);
                });

                slideEl.innerHTML = `<div class="corner-accent corner-tl"></div><div class="corner-accent corner-br"></div>`;
                slideEl.appendChild(slideBody);
                slideEl.innerHTML += `<div class="slide-footer"><span>${slide.footerLeft || ''}</span><span class="slide-num">${sIdx + 1 < 10 ? '0' + (sIdx + 1) : sIdx + 1}</span></div>`;
                container.appendChild(slideEl);
            });
        }

        function updateElem(sIdx, eIdx, k, v) { slidesData[sIdx].elements[eIdx][k] = v; renderPreview(); }
        function updateSlideFooter(sIdx, v) { slidesData[sIdx].footerLeft = v; renderPreview(); }
        function addTableColumn(sIdx, eIdx) { const el = slidesData[sIdx].elements[eIdx]; if (!el.headers) el.headers = []; el.headers.push(`Kolom ${el.headers.length + 1}`); renderForms(); }
        function deleteTableColumn(sIdx, eIdx, cIdx) { const el = slidesData[sIdx].elements[eIdx]; el.headers.splice(cIdx, 1); if (el.rows) el.rows.forEach(r => r.splice(cIdx, 1)); renderForms(); }
        function updateTableHeader(sIdx, eIdx, cIdx, v) { slidesData[sIdx].elements[eIdx].headers[cIdx] = v; renderPreview(); }
        function addTableRow(sIdx, eIdx) { const el = slidesData[sIdx].elements[eIdx]; if (!el.rows) el.rows = []; el.rows.push(new Array(el.headers ? el.headers.length : 1).fill('')); renderForms(); }
        function deleteTableRow(sIdx, eIdx, rIdx) { slidesData[sIdx].elements[eIdx].rows.splice(rIdx, 1); renderForms(); }
        function updateTableCell(sIdx, eIdx, rIdx, cIdx, v) { if (!slidesData[sIdx].elements[eIdx].rows[rIdx]) slidesData[sIdx].elements[eIdx].rows[rIdx] = []; slidesData[sIdx].elements[eIdx].rows[rIdx][cIdx] = v; renderPreview(); }
        function addListItem(sIdx, eIdx) { const el = slidesData[sIdx].elements[eIdx]; if (!el.items) el.items = []; el.items.push('Poin baru...'); renderForms(); }
        function deleteListItem(sIdx, eIdx, lIdx) { slidesData[sIdx].elements[eIdx].items.splice(lIdx, 1); renderForms(); }
        function updateListItem(sIdx, eIdx, lIdx, v) { slidesData[sIdx].elements[eIdx].items[lIdx] = v; renderPreview(); }
        function addKpiItem(sIdx, eIdx) { const el = slidesData[sIdx].elements[eIdx]; if (!el.items) el.items = []; el.items.push({ val: '0', lbl: 'Metrik Baru' }); renderForms(); }
        function deleteKpiItem(sIdx, eIdx, kIdx) { slidesData[sIdx].elements[eIdx].items.splice(kIdx, 1); renderForms(); }
        function updateKpiItem(sIdx, eIdx, kIdx, k, v) { slidesData[sIdx].elements[eIdx].items[kIdx][k] = v; renderPreview(); }
        function addElementToSlide(sIdx, type) { const ne = { type, brand: '', shapeStyle: 'sharp' }; if (type === 'cover') { ne.tag = 'Proposal'; ne.title = 'TITLE'; ne.subtitle = 'Subtitle'; } else if (type === 'header') { ne.tag = 'Section'; ne.title = 'TITLE'; } else if (type === 'text') { ne.content = 'Teks...'; } else if (type === 'list') { ne.items = ['Item 1', 'Item 2']; } else if (type === 'kpi') { ne.items = [{ val: '100K', lbl: 'Metric 1' }]; } else if (type === 'table') { ne.headers = ['A', 'B']; ne.rows = [['D1', 'D2']]; } else if (type === 'wawasan') { ne.content = 'Catatan...'; } slidesData[sIdx].elements.push(ne); renderForms(); }
        function deleteElem(sIdx, eIdx) { slidesData[sIdx].elements.splice(eIdx, 1); renderForms(); }
        function addSlide() { slidesData.push({ id: Date.now(), footerLeft: 'PREPARED BY MALEVIN TEAM', elements: [{ type: 'header', brand: '', tag: 'Tag', title: 'SLIDE BARU', shapeStyle: 'sharp' }] }); renderForms(); }
        function deleteSlide(sIdx) { if (slidesData.length > 1) { slidesData.splice(sIdx, 1); renderForms(); } }

        /* =========================================================
           SOLUSI UTAMA: RENDER DENGAN ISOLASI DOM (OFF-SCREEN CLONE)
           ========================================================= */
        async function downloadPDF() {
            const btn = document.getElementById('downloadBtn');
            const originalText = btn.innerText;
            btn.innerText = 'Memproses PDF (Harap Tunggu)...';
            btn.disabled = true;

            setMode('preview');
            await new Promise(r => setTimeout(r, 400));

            try {
                const { jsPDF } = window.jspdf;
                let pdf = null;
                const pdfWidth = 850;

                const slides = document.querySelectorAll('.slide');

                for (let i = 0; i < slides.length; i++) {
                    const slide = slides[i];

                    // 1. Buat kontainer khusus di luar layar yang leluasa tanpa batasan viewport browser
                    const isolatedBox = document.createElement('div');
                    isolatedBox.style.position = 'fixed';
                    isolatedBox.style.left = '-9999px';
                    isolatedBox.style.top = '0';
                    isolatedBox.style.width = '850px';
                    isolatedBox.style.zIndex = '-9999';

                    // 2. Kloning slide asli
                    const clone = slide.cloneNode(true);
                    clone.style.boxShadow = 'none';
                    clone.style.border = 'none';
                    clone.style.width = '850px';
                    clone.style.margin = '0';

                    // Hilangkan garis putus-putus pada elemen draggable saat di-foto
                    const draggables = clone.querySelectorAll('.draggable-element');
                    draggables.forEach(d => { d.style.border = 'none'; });

                    isolatedBox.appendChild(clone);
                    document.body.appendChild(isolatedBox);

                    // 3. Foto elemen yang terisolasi dengan resolusi tinggi (1200px simulated window)
                    const canvas = await html2canvas(clone, {
                        scale: 3,
                        useCORS: true,
                        backgroundColor: '#0A0B0A',
                        logging: false,
                        width: 850,
                        windowWidth: 1200
                    });

                    // Hapus elemen sampel setelah selesai di-foto
                    document.body.removeChild(isolatedBox);

                    const imgData = canvas.toDataURL('image/jpeg', 1.0);
                    const pdfHeight = (canvas.height * pdfWidth) / canvas.width;

                    if (i === 0) {
                        pdf = new jsPDF({
                            orientation: 'portrait',
                            unit: 'px',
                            format: [pdfWidth, pdfHeight]
                        });
                    } else {
                        pdf.addPage([pdfWidth, pdfHeight], 'portrait');
                    }

                    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidth, pdfHeight);
                }

                pdf.save('Malevin_Deck_Official.pdf');
            } catch (error) {
                console.error("Gagal export PDF:", error);
                alert("Terjadi kesalahan saat memproses PDF.");
            } finally {
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        function setMode(mode) {
            const ep = document.getElementById('editorPanel'), pp = document.getElementById('previewPanel'), te = document.getElementById('tabEditBtn'), tp = document.getElementById('tabPreviewBtn');
            if (mode === 'preview') { ep.style.display = 'none'; pp.style.display = 'flex'; te.classList.remove('active'); tp.classList.add('active'); } 
            else { ep.style.display = 'flex'; pp.style.display = 'none'; tp.classList.remove('active'); te.classList.add('active'); }
        }

        renderForms();
        setMode('edit');
    </script>
